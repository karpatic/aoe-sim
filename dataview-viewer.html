            };
            const referenceSpeed = spriteKey && mapSpriteByKey.has(spriteKey)
              ? positiveUnitRecordSpeed(unitRecord)
              : null;
            const history = actorGlobalCommandHistories.get(instanceId) ?? [];
            const nextIndex = upperBound(history, row.time + .001);
            const nextEvent = history[nextIndex];
            const possibleLossTime = indexedPossibleLossTimes.get(actorKey);
            const ownershipUnresolved = Boolean(
              (object && object.owner !== row.player)
                || (moveIssuersByInstance.get(instanceId)?.size ?? 0) > 1,
            );
            const explicitDeleteTime = !ownershipUnresolved && object?.explicit_delete > row.time
              && (!nextEvent || object.explicit_delete < nextEvent.time)
              ? object.explicit_delete
              : null;
            const aggregateCorrelatedLoss = !ownershipUnresolved && possibleLossTime > row.time
              && (!nextEvent || possibleLossTime < nextEvent.time);
            const inferredLossTime = row.time + Math.max(
              90 + Math.min(180, partyStrength * 4),
              row.commandArrow?.lifetime ?? 60,
            );
            // A command destination is a last-known position, not permission
            // to pin an actor there for the rest of the replay. Expire stale
            // non-villager positions after six minutes and workers after ten;
            // this is deliberately not classified as a confirmed death.
            const stalePositionTime = row.time + (worker ? 600 : 360);
            return {
              instanceId,
              worker,
              category,
              spriteKey,
              categoryEvidence,
              identityEvidenceQuality,
              unitIdentity,
              referenceSpeed,
              referenceUnitName: unitRecord?.name ?? object?.name ?? inferredCategory?.name ?? '',
              ownershipUnresolved,
              strength: estimatedUnitStrength(row.player, instanceId),
              endTime: explicitDeleteTime
                ?? (aggregateCorrelatedLoss
                  ? possibleLossTime
                  : nextEvent?.time ?? (exposure.exposed ? inferredLossTime : stalePositionTime)),
              outcome: explicitDeleteTime
                ? 'explicit removal command'
                : aggregateCorrelatedLoss
                  ? 'possible aggregate-correlated loss'
                  : nextEvent
                    ? 'later command evidence'
                    : exposure.exposed
                      ? (ownershipUnresolved
                        ? 'selection-scoped assumption loss estimate'
                        : 'user-assumption loss estimate')
                      : 'stale position estimate expired; survival unresolved',
            };
          });
          const movementProfile = movementProfileForParty(row, members);
          const buildTransitionEstimate = buildTransitionEstimateForParty(row, members, movementProfile);
          return {
            id: index,
            time: row.time,
            player: row.player,
            position: row.position,
            kind: row.kind,
            commandArrow: row.commandArrow ?? null,
            movementProfile,
            villagerTaskAssignment: row.villagerTaskAssignment ?? null,
            buildTransitionEstimate,
            members,
            strength: partyStrength,
            exposure,
          };
        });

      function visibleMovementPartyRows(seconds) {
        const activeAssignments = new Map();
        movementParties.forEach((party) => {
          if (party.time > seconds) return;
          party.members.forEach((member) => {
            if (seconds >= member.endTime) return;
            const actorKey = `${party.player}:${member.instanceId}`;
            const prior = activeAssignments.get(actorKey);
            if (prior && prior.party.time > party.time) return;
            activeAssignments.set(actorKey, { party, member });
          });
        });
        const grouped = new Map();
        activeAssignments.forEach(({ party, member }) => {
          const taskKey = party.villagerTaskAssignment ? `:${party.villagerTaskAssignment.key}` : '';
          const key = `${party.player}:${party.kind}${taskKey}:${party.id}:${party.position.x.toFixed(2)}:${party.position.y.toFixed(2)}`;
          const existing = grouped.get(key) ?? {
            id: party.id,
            player: party.player,
            position: party.position,
            kind: party.kind,
            commandArrow: party.commandArrow,
            movementProfile: party.movementProfile,
            villagerTaskAssignment: party.villagerTaskAssignment,
            buildTransitionEstimate: party.buildTransitionEstimate,
            latestTime: party.time,
            members: [],
            reasons: new Set(),
          };
          existing.latestTime = Math.max(existing.latestTime, party.time);
          existing.members.push(member);
          party.exposure.reasons.forEach((reason) => existing.reasons.add(reason));
          grouped.set(key, existing);
        });
        return [...grouped.values()];
      }

      function formatEstimatedTimelineTime(seconds) {
        return Number.isFinite(seconds) ? formatDuration(seconds) : 'unresolved';
      }

      function effectiveVillagerTaskStateForParty(party, seconds) {
        const estimate = party.buildTransitionEstimate ?? null;
        const indexedAssignment = party.villagerTaskAssignment ?? null;
        if (!estimate) {
          const workAnimation = party.kind === 'attack'
            ? null
            : villagerWorkAnimationForAssignment(indexedAssignment);
          return {
            indexedAssignment,
            effectiveAssignment: indexedAssignment,
            phase: '',
            estimate: null,
            workAnimation,
          };
        }
        const hasCompletion = Number.isFinite(estimate.estimatedCompletionTime);
        const afterCompletion = hasCompletion && seconds >= estimate.estimatedCompletionTime;
        const effectiveAssignment = afterCompletion && estimate.postBuildAssignment
          ? estimate.postBuildAssignment
          : indexedAssignment;
        const phase = !hasCompletion
          ? 'construction-estimate-unresolved'
          : afterCompletion && estimate.postBuildAssignment
            ? 'post-build'
            : afterCompletion
              ? 'post-build-resource-unresolved'
              : 'construction';
        const workAnimation = party.kind === 'attack'
          ? null
          : villagerWorkAnimationForAssignment(effectiveAssignment);
        return {
          indexedAssignment,
          effectiveAssignment,
          phase,
          estimate,
          workAnimation,
        };
      }

      function buildTransitionEvidenceTitle(state) {
        const estimate = state.estimate;
        if (!estimate) return '';
        const postAssignment = estimate.postBuildAssignment
          ? `${estimate.postBuildAssignment.label} (${estimate.postBuildAssignment.key})`
          : 'unresolved; keeping build/hammering';
        return [
          `Building target: ${estimate.targetName}.`,
          `Estimated arrival: ${formatEstimatedTimelineTime(estimate.estimatedArrivalTime)} (${estimate.arrivalEvidence}).`,
          `Estimated completion: ${formatEstimatedTimelineTime(estimate.estimatedCompletionTime)} from ${formatStatNumber(estimate.baseBuildSeconds)}s base build time and ${estimate.builderCount} selected Villager builder(s), multi-builder duration ${formatStatNumber(estimate.constructionSeconds)}s.`,
          `Phase: ${state.phase || 'none'}.`,
          `Post-build assignment: ${postAssignment}.`,
          estimate.postBuildResourceEvidence ? `Post-build resource evidence: ${estimate.postBuildResourceEvidence}.` : '',
          `Active Villager marker cue: ${state.workAnimation?.label ?? 'generic'}.`,
        ].filter(Boolean).join(' ');
      }

      function buildTransitionEvidenceDataset(party, state) {
        const estimate = state.estimate;
        if (!estimate) return '';
        return [
          `p${party.player}`,
          `id${party.id}`,
          `target=${estimate.targetName}`,
          `builders=${estimate.builderCount}`,
          `arrival=${Number.isFinite(estimate.estimatedArrivalTime) ? estimate.estimatedArrivalTime.toFixed(3) : 'unresolved'}`,
          `completion=${Number.isFinite(estimate.estimatedCompletionTime) ? estimate.estimatedCompletionTime.toFixed(3) : 'unresolved'}`,
          `phase=${state.phase}`,
          `post=${estimate.postBuildAssignment?.key ?? 'unresolved'}`,
          `resource=${estimate.postBuildResourceFamily || 'unresolved'}`,
          `resourceStatus=${estimate.postBuildResourceStatus || 'unresolved'}`,
          `marker=${state.workAnimation?.key ?? 'generic'}`,
        ].join(',');
      }

      function activeMappedActorAssignments(seconds) {
        return Object.freeze(visibleMovementPartyRows(seconds).flatMap((party) => {
          const interpolation = partyStripInterpolationState(party, seconds);
          const taskState = effectiveVillagerTaskStateForParty(party, seconds);
          return party.members.map((member) => {
            const unitIdentity = Object.freeze({
              quality: member.unitIdentity?.quality ?? member.identityEvidenceQuality ?? 'unclassified',
              unit_id: member.unitIdentity?.unit_id ?? null,
              name: member.unitIdentity?.name ?? '',
              evidence: member.unitIdentity?.evidence ?? member.categoryEvidence ?? '',
            });
            const mapRendered = Boolean(
              member.spriteKey
                && mapSpriteByKey.has(member.spriteKey)
                && partyComposition([member], taskState.effectiveAssignment).entries.length,
            );
            return Object.freeze({
              player: party.player,
              instanceId: member.instanceId,
              worker: Boolean(member.worker),
              villager: Boolean(member.worker),
              partyId: party.id,
              partyKind: party.kind,
              partyTime: party.latestTime,
              villagerTaskAssignment: taskState.effectiveAssignment?.key ?? null,
              indexedVillagerTaskAssignment: taskState.indexedAssignment?.key ?? null,
              villagerTaskPhase: taskState.phase,
              position: Object.freeze({ x: interpolation.current.x, y: interpolation.current.y }),
              commandDestination: Object.freeze({ x: interpolation.destination.x, y: interpolation.destination.y }),
              unitIdentity,
              resolvedUnitId: unitIdentity.unit_id,
              unitName: unitIdentity.name,
              referenceUnitName: member.referenceUnitName,
              spriteKey: member.spriteKey ?? null,
              spriteCategory: member.spriteKey && mapSpriteByKey.has(member.spriteKey)
                ? mapSpriteByKey.get(member.spriteKey).label
                : '',
              category: member.category ?? unitCategoryForMapSpriteKey(member.spriteKey),
              evidenceQuality: unitIdentity.quality,
              evidence: member.categoryEvidence,
              outcome: member.outcome,
              endTime: member.endTime,
              mapRendered,
            });
          });
        }));
      }

      function partyComposition(members, villagerTaskAssignment = null, villagerTaskState = null) {
        const counts = Object.fromEntries(mapSpriteDefinitions.map((definition) => [definition.key, 0]));
        const evidenceCounts = Object.fromEntries(mapSpriteDefinitions.map((definition) => [
          definition.key,
          { direct: 0, productionInferred: 0 },
        ]));
        const categoryCounts = Object.fromEntries(mapSpriteDefinitions.map((definition) => [definition.key, {}]));
        const unclassifiedMembers = [];
        members.forEach((member) => {
          const spriteKey = member.spriteKey;
          if (spriteKey && mapSpriteByKey.has(spriteKey) && Object.prototype.hasOwnProperty.call(counts, spriteKey)) {
            counts[spriteKey] += 1;
            if (member.categoryEvidence.includes('production evidence')) {
              evidenceCounts[spriteKey].productionInferred += 1;
            } else {
              evidenceCounts[spriteKey].direct += 1;
            }
            const category = member.category ?? 'unknown';
            categoryCounts[spriteKey][category] = (categoryCounts[spriteKey][category] ?? 0) + 1;
          } else {
            unclassifiedMembers.push(member);
          }
        });
        const entries = mapSpriteDefinitions
          .map((definition) => {
            const evidence = evidenceCounts[definition.key];
            return {
              ...definition,
              count: counts[definition.key],
              direct: evidence.direct,
              productionInferred: evidence.productionInferred,
              estimated: evidence.productionInferred > 0,
              categoryCounts: categoryCounts[definition.key],
              villagerTaskAssignment: definition.key === 'villagers' ? villagerTaskAssignment : null,
              villagerTaskState: definition.key === 'villagers' ? villagerTaskState : null,
            };
          })
          .filter((entry) => entry.count > 0);
        return {
          counts,
          evidenceCounts,
          entries,
          categorized: entries.reduce((sum, entry) => sum + entry.count, 0),
          unclassified: unclassifiedMembers.length,
          unclassifiedMembers,
          total: members.length,
        };
      }

      function partyCompositionEvidence(composition) {
        return [
          ...composition.entries.map((entry) => {
            const taskEvidence = entry.villagerTaskAssignment
              ? `,task=${entry.villagerTaskAssignment.key}`
              : '';
            const phaseEvidence = entry.villagerTaskState?.phase
              ? `,phase=${entry.villagerTaskState.phase}`
              : '';
            return `${entry.key}=${entry.estimated ? '~' : ''}${entry.count}(direct=${entry.direct},production=${entry.productionInferred},categories=${Object.entries(entry.categoryCounts).map(([category, count]) => `${category}:${count}`).join('|') || 'none'}${taskEvidence}${phaseEvidence})`;
          }),
          `unclassified=${composition.unclassified}`,
          composition.unclassifiedMembers.length
            ? `unknown_ids=${composition.unclassifiedMembers.map((member) => member.instanceId).join(',')}`
            : '',
          `total=${composition.total}`,
        ].filter(Boolean).join(':');
      }

      function countSummary(values) {
        const counts = new Map();
        values.filter(Boolean).forEach((value) => {
          counts.set(value, (counts.get(value) ?? 0) + 1);
        });
        return [...counts.entries()]
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([value, count]) => `${value}:${count}`)
          .join(',');
      }

      function mappedActorTotalsByPlayer(assignments) {
        const counts = new Map(game.match.players.map((player) => [player.number, 0]));
        assignments.forEach((assignment) => {
          counts.set(assignment.player, (counts.get(assignment.player) ?? 0) + 1);
        });
        return [...counts.entries()]
          .sort((a, b) => a[0] - b[0])
          .map(([player, count]) => `${player}:${count}`)
          .join(',');
      }

      function mappedActorEvidenceSplitText(counts) {
        return ['direct', 'production-inferred', 'sprite-category', 'unclassified']
          .map((quality) => `${quality}:${counts.get(quality) ?? 0}`)
          .join(',');
      }

      function mappedActorEvidenceSplits(assignments) {
        const counts = new Map();
        assignments.forEach((assignment) => {
          const key = assignment.evidenceQuality ?? 'unclassified';
          counts.set(key, (counts.get(key) ?? 0) + 1);
        });
        return mappedActorEvidenceSplitText(counts);
      }

      function mappedActorEvidenceSplitsByPlayer(assignments) {
        const byPlayer = new Map(game.match.players.map((player) => [player.number, new Map()]));
        assignments.forEach((assignment) => {
          const counts = byPlayer.get(assignment.player) ?? new Map();
          const key = assignment.evidenceQuality ?? 'unclassified';
          counts.set(key, (counts.get(key) ?? 0) + 1);
          byPlayer.set(assignment.player, counts);
        });
        return [...byPlayer.entries()]
          .sort((a, b) => a[0] - b[0])
          .map(([player, counts]) => `${player}:${mappedActorEvidenceSplitText(counts)}`)
          .join(';');
      }

      function mappedActorLineEvidence(assignments) {
        return assignments
          .map((assignment) => [
            `p${assignment.player}`,
            `id${assignment.instanceId}`,
            `quality=${assignment.evidenceQuality ?? 'unclassified'}`,
            `worker=${assignment.worker ? 'true' : 'false'}`,
            `sprite=${assignment.spriteKey ?? 'unclassified'}`,
            assignment.unitIdentity?.unit_id !== null && assignment.unitIdentity?.unit_id !== undefined
              ? `unit=${assignment.unitIdentity.unit_id}`
              : '',
            assignment.unitIdentity?.name ? `name=${assignment.unitIdentity.name}` : '',
            assignment.villagerTaskAssignment ? `task=${assignment.villagerTaskAssignment}` : '',
            assignment.villagerTaskPhase ? `phase=${assignment.villagerTaskPhase}` : '',
          ].filter(Boolean).join('/'))
          .join(';');
      }

      function formatMapPosition(position, digits = 2) {
        if (!position) return 'n/a';
        return `${Number(position.x).toFixed(digits)},${Number(position.y).toFixed(digits)}`;
      }

      function partyStripInterpolationState(party, seconds) {
        const profile = party.movementProfile;
        const destination = profile?.destination ?? party.position;
        const fallback = (status, reason) => ({
          source: profile?.source ?? null,
          current: destination,
          destination,
          distance: profile?.distance ?? 0,
          slowestSpeed: profile?.slowestSpeed ?? null,
          progress: 1,
          travelTime: profile?.travelTime ?? null,
          status,
          fallbackReason: reason,
          speedEvidence: profile?.speedEvidence ?? [],
          visibleMemberCount: profile?.visibleMemberCount ?? party.members.length,
          speedMemberCount: profile?.speedMemberCount ?? 0,
        });
        if (!profile) return fallback('fallback:no-profile', 'no interpolation profile; strip stays at destination');
        if (profile.status !== 'interpolated') return fallback(profile.status, profile.fallbackReason);
        const elapsed = Math.max(0, seconds - profile.time);
        const progress = Math.max(0, Math.min(1, elapsed * profile.slowestSpeed / profile.distance));
        const current = {
          x: profile.source.x + (profile.destination.x - profile.source.x) * progress,
          y: profile.source.y + (profile.destination.y - profile.source.y) * progress,
        };
        return {
          source: profile.source,
          current,
          destination: profile.destination,
          distance: profile.distance,
          slowestSpeed: profile.slowestSpeed,
          progress,
          travelTime: profile.travelTime,
          status: progress >= 1 ? 'arrived' : progress <= 0 ? 'pending' : 'moving',
          fallbackReason: '',
          speedEvidence: profile.speedEvidence,
          visibleMemberCount: profile.visibleMemberCount,
          speedMemberCount: profile.speedMemberCount,
        };
      }

      function partyStripInterpolationTitle(state) {
        if (state.fallbackReason) return `Strip anchor fallback: ${state.fallbackReason}.`;
        return `Strip anchor: straight command-segment interpolation from sparse command evidence, ${Math.round(state.progress * 100)}% at ${formatStatNumber(state.slowestSpeed)} tiles/s.`;
      }

      function partyStripInterpolationEvidence(party, state, taskState = null) {
        const task = taskState?.effectiveAssignment
          ? `/${taskState.effectiveAssignment.key}`
          : (party.villagerTaskAssignment ? `/${party.villagerTaskAssignment.key}` : '');
        return [
          `${party.kind}${task}:p${party.player}:id${party.id}:members=${party.members.length}`,
          taskState?.indexedAssignment && taskState.indexedAssignment !== taskState.effectiveAssignment
            ? `indexedTask=${taskState.indexedAssignment.key}`
            : '',
          taskState?.phase ? `phase=${taskState.phase}` : '',
          `t=${party.latestTime.toFixed(3)}`,
          `src=${formatMapPosition(state.source)}`,
          `cur=${formatMapPosition(state.current)}`,
          `dst=${formatMapPosition(state.destination)}`,
          `dist=${formatStatNumber(state.distance)}`,
          `speed=${state.slowestSpeed === null ? 'n/a' : formatStatNumber(state.slowestSpeed)}`,
          `progress=${state.progress.toFixed(3)}`,
          `travel=${state.travelTime === null ? 'n/a' : formatStatNumber(state.travelTime)}`,
          `status=${state.status}`,
          state.fallbackReason ? `fallback=${state.fallbackReason}` : '',
          state.speedEvidence.length ? `speeds=${state.speedEvidence.join('|')}` : '',
        ].filter(Boolean).join(',');
      }

      const partySpriteNodes = new Map();
      let partySpriteNodesCreated = 0;
      let partySpriteSrcAssignments = 0;
      let partyTaskMarkerSrcAssignments = 0;

      function partyStripLayout(anchorX, anchorY, composition, align = 'center') {
        const iconSize = 16;
        const gap = 1;
        const paddingX = 1;
        const height = 21;
        const fontSize = 9;
        const badgeFontSize = 8;
        const spriteCellSize = 18;
        const badgeSlotSize = 10;
        const taskMarkerSize = 8;
        const taskMarkerInset = 1;
        const entryWidth = spriteCellSize + badgeSlotSize;
        const width = paddingX * 2 + composition.entries.length * entryWidth
          + gap * Math.max(0, composition.entries.length - 1);
        const left = align === 'after' ? anchorX : anchorX - width / 2;
        const top = anchorY - height / 2;
        return { iconSize, gap, paddingX, height, fontSize, badgeFontSize, spriteCellSize, badgeSlotSize, taskMarkerSize, taskMarkerInset, entryWidth, width, left, top };
      }

      function villagerWorkAnimationForAssignment(villagerTaskAssignment) {
        const assignmentKey = villagerTaskAssignment?.key;
        return Object.prototype.hasOwnProperty.call(villagerWorkAnimationDefinitions, assignmentKey)
          ? villagerWorkAnimationDefinitions[assignmentKey]
          : null;
      }

      function partySpriteAsset(kind, spriteKey, villagerTaskAssignment = null) {
        if (spriteKey === 'villagers') {
          if (kind === 'attack') return partySpriteAssets.attack.villagers ?? null;
          const workAnimation = villagerWorkAnimationForAssignment(villagerTaskAssignment);
          if (workAnimation) return workAnimation.asset;
        }
        return partySpriteAssets[kind]?.[spriteKey] ?? partySpriteAssets.attack[spriteKey] ?? null;
      }

      function teamSpriteFilter(teamColor) {
        const normalized = String(teamColor ?? '').toLowerCase().trim();
        if (normalized === 'blue') {
          return 'grayscale(1) sepia(1) saturate(8.5) hue-rotate(168deg) brightness(.92) contrast(1.24)';
        }
        if (normalized === 'orange') {
          return 'grayscale(1) sepia(1) saturate(8) hue-rotate(338deg) brightness(1.1) contrast(1.18)';
        }
        return 'grayscale(1) sepia(1) saturate(1.45) hue-rotate(0deg) brightness(1.04) contrast(1.08)';
      }

      function setDatasetValue(element, key, value) {
        if (value === null || value === undefined || value === '') {
          delete element.dataset[key];
          return;
        }
        element.dataset[key] = String(value);
      }

      function applyVillagerTaskStateDatasets(element, taskState) {
        const estimate = taskState?.estimate ?? null;
        setDatasetValue(element, 'indexedVillagerTaskAssignment', taskState?.indexedAssignment?.key ?? '');
        setDatasetValue(element, 'indexedVillagerTaskLabel', taskState?.indexedAssignment?.label ?? '');
        setDatasetValue(element, 'villagerTaskAssignment', taskState?.effectiveAssignment?.key ?? '');
        setDatasetValue(element, 'villagerTaskLabel', taskState?.effectiveAssignment?.label ?? '');
        setDatasetValue(element, 'villagerTaskPhase', taskState?.phase ?? '');
        setDatasetValue(element, 'villagerWorkAnimation', taskState?.workAnimation?.key ?? '');
        setDatasetValue(element, 'villagerWorkAnimationLabel', taskState?.workAnimation?.label ?? '');
        setDatasetValue(element, 'buildingTarget', estimate?.targetName ?? '');
        setDatasetValue(element, 'estimatedBuildArrival', Number.isFinite(estimate?.estimatedArrivalTime)
          ? estimate.estimatedArrivalTime.toFixed(3)
          : '');
        setDatasetValue(element, 'estimatedBuildCompletion', Number.isFinite(estimate?.estimatedCompletionTime)
          ? estimate.estimatedCompletionTime.toFixed(3)
          : '');
        setDatasetValue(element, 'builderCount', estimate?.builderCount ?? '');
        setDatasetValue(element, 'baseBuildSeconds', Number.isFinite(estimate?.baseBuildSeconds)
          ? formatStatNumber(estimate.baseBuildSeconds)
          : '');
        setDatasetValue(element, 'estimatedConstructionSeconds', Number.isFinite(estimate?.constructionSeconds)
          ? formatStatNumber(estimate.constructionSeconds)
          : '');
        setDatasetValue(element, 'buildArrivalStatus', estimate?.arrivalStatus ?? '');
        setDatasetValue(element, 'buildArrivalEvidence', estimate?.arrivalEvidence ?? '');
        setDatasetValue(element, 'postBuildResourceAssignment', estimate?.postBuildAssignment?.key ?? '');
        setDatasetValue(element, 'postBuildResourceStatus', estimate?.postBuildResourceStatus ?? '');
        setDatasetValue(element, 'postBuildResourceFamily', estimate?.postBuildResourceFamily ?? '');
        setDatasetValue(element, 'postBuildResourceEvidence', estimate?.postBuildResourceEvidence ?? '');
      }

      function villagerAnimationTitle(entry, kind) {
        if (entry.key !== 'villagers') return '';
        if (kind === 'attack') return 'Villager marker: fighting';
        const workAnimation = entry.villagerTaskState?.workAnimation
          ?? villagerWorkAnimationForAssignment(entry.villagerTaskAssignment);
        if (workAnimation) return `Villager marker: ${workAnimation.label}`;
        return 'Villager marker: generic';
      }

      function partySpriteEntryTitle(entry, kind) {
        const categorySummary = Object.entries(entry.categoryCounts)
          .map(([category, count]) => `${category}: ${count}`)
          .join(', ');
        return [
          `${entry.label}: ${entry.count}`,
          villagerAnimationTitle(entry, kind),
          entry.villagerTaskAssignment ? `Task marker: semantic assignment cue (${entry.villagerTaskAssignment.label})` : '',
          entry.villagerTaskState?.phase ? `Task phase: ${entry.villagerTaskState.phase}` : '',
          entry.villagerTaskState ? buildTransitionEvidenceTitle(entry.villagerTaskState) : '',
          `${entry.direct} direct`,
          `${entry.productionInferred} production-inferred`,
          categorySummary ? `broad categories: ${categorySummary}` : '',
        ].filter(Boolean).join(' | ');
      }

      function applyPartySpriteImageAsset(item, image, party, entry) {
        const spriteAsset = partySpriteAsset(party.kind, entry.key, entry.villagerTaskAssignment);
        const workAnimation = entry.key === 'villagers' && party.kind !== 'attack'
          ? (entry.villagerTaskState?.workAnimation
            ?? villagerWorkAnimationForAssignment(entry.villagerTaskAssignment))
          : null;
        if (spriteAsset && image.dataset.spriteAsset !== spriteAsset) {
          image.src = spriteAsset;
          partySpriteSrcAssignments += 1;
        } else if (!spriteAsset && image.dataset.spriteAsset) {
          image.removeAttribute('src');
        }
        item.dataset.spriteAsset = spriteAsset ?? '';
        image.dataset.spriteAsset = spriteAsset ?? '';
        if (entry.key === 'villagers') {
          applyVillagerTaskStateDatasets(item, entry.villagerTaskState ?? {
            indexedAssignment: entry.villagerTaskAssignment,
            effectiveAssignment: entry.villagerTaskAssignment,
            phase: '',
            estimate: null,
            workAnimation,
          });
          applyVillagerTaskStateDatasets(image, entry.villagerTaskState ?? {
            indexedAssignment: entry.villagerTaskAssignment,
            effectiveAssignment: entry.villagerTaskAssignment,
            phase: '',
            estimate: null,
            workAnimation,
          });
        }
      }

      function applyPartyTaskMarkerAsset(item, entry) {
        const taskMarkerSymbol = entry.key === 'villagers' ? entry.villagerTaskAssignment?.symbol : null;
        let taskMarker = item.querySelector('.party-sprite-task-marker');
        if (!taskMarkerSymbol) {
          taskMarker?.remove();
          ['villagerTaskAssignment', 'villagerTaskLabel', 'villagerTaskPhase'].forEach((key) => {
            delete item.dataset[key];
          });
          return;
        }
        if (!taskMarker) {
          taskMarker = generatedMarker(
            'party-sprite-task-marker',
            taskMarkerSymbol,
            entry.villagerTaskAssignment.label,
          );
          item.append(taskMarker);
        }
        if (taskMarker.dataset.spriteAsset !== taskMarkerSymbol) {
          taskMarker.textContent = taskMarkerSymbol;
          partyTaskMarkerSrcAssignments += 1;
        }
        taskMarker.dataset.spriteAsset = taskMarkerSymbol;
        taskMarker.dataset.villagerTaskAssignment = entry.villagerTaskAssignment.key;
        taskMarker.dataset.villagerTaskLabel = entry.villagerTaskAssignment.label;
        taskMarker.dataset.villagerTaskPhase = entry.villagerTaskState?.phase ?? '';
        taskMarker.title = entry.villagerTaskAssignment.label;
        applyVillagerTaskStateDatasets(taskMarker, entry.villagerTaskState ?? {
          indexedAssignment: entry.villagerTaskAssignment,
          effectiveAssignment: entry.villagerTaskAssignment,
          phase: '',
          estimate: null,
          workAnimation: villagerWorkAnimationForAssignment(entry.villagerTaskAssignment),
        });
      }

      function movementPartyKey(party) {
        const parts = [
          party.kind,
          party.player,
          `party=${party.id}`,
        ];
        if (party.villagerTaskAssignment) parts.push(`task=${party.villagerTaskAssignment.key}`);
        parts.push(party.position.x.toFixed(2), party.position.y.toFixed(2));
        return parts.join(':');
      }

      function createPartySpriteNode(party, composition, teamColor, layout, key) {
        const strip = document.createElement('div');
        strip.className = 'party-sprite-strip';
        strip.dataset.key = key;
        strip.dataset.teamColor = teamColor;
        strip.style.setProperty('--player-color', teamColor);
        strip.style.setProperty('--team-sprite-filter', teamSpriteFilter(teamColor));
        composition.entries.forEach((entry) => {
          const item = document.createElement('span');
          item.className = 'party-sprite-item';
          item.dataset.spriteKey = entry.key;
          item.dataset.count = String(entry.count);
          item.title = partySpriteEntryTitle(entry, party.kind);
          const image = generatedMarker(
            'party-sprite-image',
            mapSpriteSymbols.get(entry.key) ?? entry.key,
            entry.label,
          );
          image.setAttribute('aria-hidden', 'true');
          applyPartySpriteImageAsset(item, image, party, entry);
          const count = document.createElement('span');
          count.className = 'party-sprite-count';
          item.append(image, count);
          applyPartyTaskMarkerAsset(item, entry);
          strip.append(item);
        });
        spriteOverlay.append(strip);
        partySpriteNodes.set(key, strip);
        partySpriteNodesCreated += 1;
        return strip;
      }

      function spriteOverlayScale() {
        const bounds = spriteOverlay.getBoundingClientRect();
        return {
          x: bounds.width / Math.max(1, gameplayCanvas.width),
          y: bounds.height / Math.max(1, gameplayCanvas.height),
        };
      }

      function updatePartySpriteNode(strip, party, composition, teamColor, layout, interpolation, taskState) {
        const scale = spriteOverlayScale();
        const uniformScale = Math.min(scale.x, scale.y) || 1;
        strip.style.left = `${layout.left * scale.x}px`;
        strip.style.top = `${layout.top * scale.y}px`;
        strip.style.width = `${layout.width * scale.x}px`;
        strip.style.height = `${layout.height * scale.y}px`;
        strip.style.setProperty('--player-color', teamColor);
        strip.style.setProperty('--team-sprite-filter', teamSpriteFilter(teamColor));
        strip.style.setProperty('--strip-gap', `${layout.gap * uniformScale}px`);
        strip.style.setProperty('--strip-padding-x', `${layout.paddingX * uniformScale}px`);
        strip.style.setProperty('--strip-height', `${layout.height * uniformScale}px`);
        strip.style.setProperty('--strip-font-size', `${layout.fontSize * uniformScale}px`);
        strip.style.setProperty('--badge-font-size', `${layout.badgeFontSize * uniformScale}px`);
        strip.style.setProperty('--sprite-cell-size', `${layout.spriteCellSize * uniformScale}px`);
        strip.style.setProperty('--badge-slot-size', `${layout.badgeSlotSize * uniformScale}px`);
        strip.style.setProperty('--task-marker-size', `${layout.taskMarkerSize * uniformScale}px`);
        strip.style.setProperty('--task-marker-inset', `${layout.taskMarkerInset * uniformScale}px`);
        strip.style.setProperty('--party-entry-width', `${layout.entryWidth * uniformScale}px`);
        strip.style.setProperty('--sprite-size', `${layout.iconSize * uniformScale}px`);
        strip.dataset.kind = party.kind;
        strip.dataset.player = String(party.player);
        strip.dataset.teamColor = teamColor;
        strip.dataset.latestTime = party.latestTime.toFixed(3);
        strip.dataset.position = `${party.position.x.toFixed(2)},${party.position.y.toFixed(2)}`;
        strip.dataset.commandSource = formatMapPosition(interpolation.source);
        strip.dataset.commandCurrent = formatMapPosition(interpolation.current);
        strip.dataset.commandDestination = formatMapPosition(interpolation.destination);
        strip.dataset.commandSegmentDistance = formatStatNumber(interpolation.distance);
        strip.dataset.commandSlowestSpeed = interpolation.slowestSpeed === null
          ? ''
          : formatStatNumber(interpolation.slowestSpeed);
        strip.dataset.commandProgress = interpolation.progress.toFixed(3);
        strip.dataset.commandTravelTime = interpolation.travelTime === null
          ? ''
          : formatStatNumber(interpolation.travelTime);
        strip.dataset.commandInterpolationStatus = interpolation.status;
        strip.dataset.commandInterpolationFallback = interpolation.fallbackReason;
        strip.dataset.commandSpeedMembers = `${interpolation.speedMemberCount}/${interpolation.visibleMemberCount}`;
        strip.dataset.commandSpeedEvidence = interpolation.speedEvidence.join('|');
        applyVillagerTaskStateDatasets(strip, taskState);
        strip.dataset.composition = partyCompositionEvidence(composition);
        const taskTitle = taskState?.effectiveAssignment
          ? ` Active Villager assignment cue: ${taskState.effectiveAssignment.label}; indexed command assignment: ${taskState.indexedAssignment?.label ?? 'none'}; Villager marker: ${taskState.workAnimation?.label ?? 'generic'}.`
          : '';
        const buildTitle = taskState ? buildTransitionEvidenceTitle(taskState) : '';
        strip.title = `Player ${party.player} ${teamColor} ${party.kind} party: ${composition.entries.map((entry) => partySpriteEntryTitle(entry, party.kind)).join('; ')}.${taskTitle} ${buildTitle} Unclassified selected actors: ${composition.unclassified}. ${partyStripInterpolationTitle(interpolation)}`;
        strip.setAttribute('aria-label', strip.title);
        composition.entries.forEach((entry) => {
          const item = strip.querySelector(`[data-sprite-key="${entry.key}"]`);
          if (!item) return;
          item.dataset.count = String(entry.count);
          item.title = partySpriteEntryTitle(entry, party.kind);
          item.setAttribute('aria-label', item.title);
          const image = item.querySelector('.party-sprite-image');
          if (image) applyPartySpriteImageAsset(item, image, party, entry);
          applyPartyTaskMarkerAsset(item, entry);
          const count = item.querySelector('.party-sprite-count');
          count.textContent = String(entry.count);
          count.dataset.estimated = String(entry.estimated);
        });
      }

      function renderPartySpriteStrips(visibleMovementParties, seconds) {
        const visibleKeys = new Set();
        const interpolationRows = [];
        let reusedNodes = 0;
        visibleMovementParties.forEach((party) => {
          const taskState = effectiveVillagerTaskStateForParty(party, seconds);
          const composition = partyComposition(party.members, taskState.effectiveAssignment, taskState);
          if (!composition.entries.length) return;
          const teamColor = playerColors.get(party.player) ?? '#888';
          const interpolation = partyStripInterpolationState(party, seconds);
          interpolationRows.push({ party, interpolation, taskState });
          const x = interpolation.current.x * cellSize;
          const y = interpolation.current.y * cellSize;
          const align = party.kind === 'attack' ? 'after' : 'center';
          const anchorX = party.kind === 'attack' ? x + 8 : x;
          const taskOffsetY = ['gather', 'build', 'repair'].includes(party.kind) ? -9 : 0;
          const anchorY = party.kind === 'attack' ? y - 12 : y + taskOffsetY;
          const layout = partyStripLayout(anchorX, anchorY, composition, align);
          const key = `${movementPartyKey(party)}:${composition.entries.map((entry) => entry.key).join(',')}`;
          visibleKeys.add(key);
          const existing = partySpriteNodes.get(key);
          const strip = existing ?? createPartySpriteNode(party, composition, teamColor, layout, key);
          if (existing) reusedNodes += 1;
          updatePartySpriteNode(strip, party, composition, teamColor, layout, interpolation, taskState);
        });
        partySpriteNodes.forEach((strip, key) => {
          if (visibleKeys.has(key)) return;
          strip.remove();
          partySpriteNodes.delete(key);
        });
        gameplayCanvas.dataset.partySpriteNodesActive = String(partySpriteNodes.size);
        gameplayCanvas.dataset.partySpriteNodesCreated = String(partySpriteNodesCreated);
        gameplayCanvas.dataset.partySpriteNodesReusedThisRender = String(reusedNodes);
        gameplayCanvas.dataset.partySpriteSrcAssignments = String(partySpriteSrcAssignments);
        gameplayCanvas.dataset.partyTaskMarkerSrcAssignments = String(partyTaskMarkerSrcAssignments);
        return interpolationRows;
      }

      function drawMovementParty(party) {
        const x = party.position.x * cellSize;
        const y = party.position.y * cellSize;
        if (party.kind === 'attack') {
          const teamColor = playerColors.get(party.player) ?? '#888';
          context.save();
          context.globalAlpha = .95;
          context.lineCap = 'round';
          [[4, '#111'], [2.2, teamColor]].forEach(([width, color]) => {
            context.strokeStyle = color;
            context.lineWidth = width;
            context.beginPath();
            context.moveTo(x - 5, y - 5);
            context.lineTo(x + 5, y + 5);
            context.moveTo(x + 5, y - 5);
            context.lineTo(x - 5, y + 5);
            context.stroke();
          });
          context.restore();
        }
      }

      function update(seconds) {
        context.clearRect(0, 0, gameplayCanvas.width, gameplayCanvas.height);
        resourceContext.clearRect(0, 0, resourceCanvas.width, resourceCanvas.height);
        buildingContext.clearRect(0, 0, buildingCanvas.width, buildingCanvas.height);

        const depletionRows = depletions.slice(0, upperBound(depletions, seconds));
        const depletedIds = new Set(depletionRows.map((row) => row.resource_id));
        const activeConstructionClearances = constructionClearances.slice(0, upperBound(constructionClearances, seconds));
        const constructionDepletedIds = new Set(activeConstructionClearances.flatMap((row) => row.resourceIds));
        const activeConstructionDepletionPositions = [...new Map(
          activeConstructionClearances.flatMap((row) => row.depletionPositions)
            .map((position) => [`${position.x.toFixed(3)}:${position.y.toFixed(3)}`, position]),
        ).values()];
        const estimatedDepletedNodes = estimateNodes.filter((node) =>
          node.depleted_time !== null && Number(node.depleted_time) <= seconds,
        );
        const finalAllocationRows = finalCapacityAllocations.slice(0, upperBound(finalCapacityAllocations, seconds));
        const estimatedDepletedIds = new Set(estimatedDepletedNodes.map((node) => node.instance_id));
        let visibleAnimals = 0;
        let consumedAnimals = 0;
        let visibleGaiaFood = 0;
        let consumedGaiaFood = 0;
        mapResources.resources.forEach((resource) => {
          const currentPosition = resourcePositionAt(resource, seconds);
          const centerX = currentPosition.x * cellSize;
          const centerY = currentPosition.y * cellSize;
          const animalStyle = mapResources.animalStyles.get(resource.name);
          if (animalStyle) {
            const isAnimal = mapResources.animalNames.has(resource.name);
            const window = animalGatherWindows.get(resource.instance_id);
            if ((window && seconds >= window.end) || estimatedDepletedIds.has(resource.instance_id)
              || constructionDepletedIds.has(resource.instance_id)) {
              consumedGaiaFood += 1;
              if (isAnimal) consumedAnimals += 1;
              return;
            }
            visibleGaiaFood += 1;
            if (isAnimal) visibleAnimals += 1;
            resourceContext.globalAlpha = window && seconds >= window.start
              ? Math.max(0, 1 - (seconds - window.start) / 300)
              : 1;
            resourceContext.beginPath();
            resourceContext.arc(centerX, centerY, 3.5, 0, Math.PI * 2);
            resourceContext.fillStyle = animalStyle.color;
            resourceContext.fill();
            resourceContext.strokeStyle = animalStyle.color === '#111' ? '#fff' : '#111';
            resourceContext.lineWidth = 1;
            resourceContext.stroke();
            resourceContext.globalAlpha = 1;
            return;
          }
          const style = mapResources.resourceStyles.get(resource.name);
          resourceContext.globalAlpha = depletedIds.has(resource.instance_id) || estimatedDepletedIds.has(resource.instance_id)
            || constructionDepletedIds.has(resource.instance_id) ? .25 : 1;
          resourceContext.beginPath();
          resourceContext.arc(centerX, centerY, 2.4, 0, Math.PI * 2);
          resourceContext.fillStyle = style.color;
          resourceContext.fill();
          resourceContext.lineWidth = 1;
          resourceContext.strokeStyle = '#111';
          resourceContext.stroke();
        });
        estimatedDepletedNodes.forEach((node) => {
          if (!node.position || depletedIds.has(node.instance_id)) return;
          const x = node.position.x * cellSize;
          const y = node.position.y * cellSize;
          resourceContext.strokeStyle = '#111';
          resourceContext.lineWidth = 2;
          resourceContext.setLineDash([2, 2]);
          resourceContext.beginPath();
          resourceContext.moveTo(x - 4, y - 4);
          resourceContext.lineTo(x + 4, y + 4);
          resourceContext.moveTo(x + 4, y - 4);
          resourceContext.lineTo(x - 4, y + 4);
          resourceContext.stroke();
          resourceContext.setLineDash([]);
        });
        resourceContext.globalAlpha = 1;
        depletionRows.forEach((row) => {
          const x = row.position.x * cellSize;
          const y = row.position.y * cellSize;
          resourceContext.strokeStyle = '#111';
          resourceContext.lineWidth = 2;
          resourceContext.setLineDash([2, 2]);
          resourceContext.beginPath();
          resourceContext.moveTo(x - 4, y - 4);
          resourceContext.lineTo(x + 4, y + 4);
          resourceContext.moveTo(x + 4, y - 4);
          resourceContext.lineTo(x - 4, y + 4);
          resourceContext.stroke();
          resourceContext.setLineDash([]);

        });
        activeConstructionDepletionPositions.forEach((position) => {
          const x = position.x * cellSize;
          const y = position.y * cellSize;
          resourceContext.strokeStyle = '#111';
          resourceContext.lineWidth = 2;
          resourceContext.setLineDash([2, 2]);
          resourceContext.beginPath();
          resourceContext.moveTo(x - 4, y - 4);
          resourceContext.lineTo(x + 4, y + 4);
          resourceContext.moveTo(x + 4, y - 4);
          resourceContext.lineTo(x - 4, y + 4);
          resourceContext.stroke();
          resourceContext.setLineDash([]);
        });

        const snapshotIndex = Math.max(0, upperBound(buildingSnapshots, seconds) - 1);
        const buildingState = buildingSnapshots[snapshotIndex];
        let estimatedInactiveFarms = 0;
        let estimatedInferredReseeds = 0;
        buildingIconRenderStats = { visibleMapped: 0, loadedVisibleMapped: 0, missingVisibleMapped: 0 };
        const rangeBuildings = buildingState.buildings.filter((row) => buildingAttackRange(buildingName(row)) > 0);
        rangeBuildings.forEach(drawBuildingRange);
        buildingState.buildings.forEach((row) => {
          const farmStatus = farmEstimateStatus(row, seconds);
          if (farmStatus && !farmStatus.active) estimatedInactiveFarms += 1;
          if (farmStatus?.inferred) estimatedInferredReseeds += 1;
          drawBuilding(row, seconds);
        });

        const visibleViewlocks = currentViewlocks(seconds);
        visibleViewlocks.forEach(drawViewlock);

        lifetimes.players.forEach((player) => {
          const x = player.start_position.x * cellSize;
          const y = player.start_position.y * cellSize;
          context.strokeStyle = playerColors.get(player.number) ?? '#fff';
          context.lineWidth = 2;
          context.beginPath();
          context.arc(x, y, 7, 0, Math.PI * 2);
          context.stroke();
        });

        const recentEnd = upperBound(nonGatherMapEvents, seconds);
        const recentStart = upperBound(nonGatherMapEvents, Math.max(0, seconds - maxCommandTravelLifetime));
        const recentRows = nonGatherMapEvents
          .slice(recentStart, recentEnd)
          .filter((row) => seconds - row.time < (row.commandDisplayLifetime ?? 60));
        const arrowEnd = upperBound(commandArrows, seconds);
        const arrowStart = upperBound(commandArrows, Math.max(0, seconds - maxCommandTravelLifetime));
        const visibleCommandArrows = commandArrows
          .slice(arrowStart, arrowEnd)
          .filter((row) => seconds - row.time < row.lifetime);
        const gatherEnd = upperBound(gatherEvents, seconds);
        const gatherStart = upperBound(gatherEvents, Math.max(0, seconds - 1200));
        const visibleGatherByDestination = new Map();
        gatherEvents.slice(gatherStart, gatherEnd).forEach((row) => {
          if (seconds - row.time > (row.commandDisplayLifetime ?? gatherEventLifetime(row))) return;
          if (clearedByBuilding(row, seconds)) return;
          const key = row.target_id ?? `${row.player}:${row.position.x.toFixed(2)}:${row.position.y.toFixed(2)}`;
          visibleGatherByDestination.set(key, row);
        });
        const visibleGatherRows = [...visibleGatherByDestination.values()];
        const visibleMovementParties = visibleMovementPartyRows(seconds);
        const currentMappedAssignments = activeMappedActorAssignments(seconds);
        const mapRenderedCategorizedAssignments = currentMappedAssignments.filter((assignment) => assignment.mapRendered);
        const mapRenderedVillagerAssignments = mapRenderedCategorizedAssignments
          .filter((assignment) => assignment.worker);
        visibleCommandArrows.forEach((row) => drawCommandArrow(row, seconds));
        visibleMovementParties.forEach(drawMovementParty);
        const visiblePartyStripInterpolations = renderPartySpriteStrips(visibleMovementParties, seconds);
        const visibleEffectiveTaskRows = visibleMovementParties
          .map((party) => ({ party, taskState: effectiveVillagerTaskStateForParty(party, seconds) }));
        recentRows.filter((row) => !['move', 'attack'].includes(row.kind)).forEach((row) => drawRecentEvent(row, seconds));
        visibleGatherRows.forEach((row) => drawRecentEvent(row, seconds));
        const gatherPointSnapshotIndex = Math.max(0, upperBound(gatherPointSnapshots, seconds) - 1);
        const activeGatherPoints = gatherPointSnapshots[gatherPointSnapshotIndex].points.filter((row) =>
          (buildingTerminalTimes.get(row.source_id) ?? Infinity) > seconds && !clearedByBuilding(row, seconds),
        );
        activeGatherPoints.forEach(drawGatherPoint);


        gameplayCanvas.dataset.currentTime = String(seconds);
        gameplayCanvas.dataset.visibleViewlocks = String(visibleViewlocks.length);
        gameplayCanvas.dataset.visibleViewlockEvidence = visibleViewlocks.map(viewlockEvidence).join(';');
        gameplayCanvas.dataset.depletions = depletionRows.length;
        gameplayCanvas.dataset.recentMapEvents = recentRows.length + visibleGatherRows.length;
        gameplayCanvas.dataset.visibleGatherMarks = visibleGatherRows.length;
        gameplayCanvas.dataset.indexedCommandArrows = commandArrows.length;
        gameplayCanvas.dataset.visibleCommandArrows = visibleCommandArrows.length;
        gameplayCanvas.dataset.visibleCommandArrowKinds = [...new Set(visibleCommandArrows.map((row) => row.kind))]
          .sort()
          .join(',');
        gameplayCanvas.dataset.indexedMovementParties = movementParties.length;
        gameplayCanvas.dataset.indexedMoveParties = movementParties.filter((party) => party.kind === 'move').length;
        gameplayCanvas.dataset.indexedAttackParties = movementParties.filter((party) => party.kind === 'attack').length;
        gameplayCanvas.dataset.indexedGatherParties = movementParties.filter((party) => party.kind === 'gather').length;
        gameplayCanvas.dataset.indexedBuildParties = movementParties.filter((party) => party.kind === 'build').length;
        gameplayCanvas.dataset.indexedRepairParties = movementParties.filter((party) => party.kind === 'repair').length;
        gameplayCanvas.dataset.indexedPartyKinds = countSummary(movementParties.map((party) => party.kind));
        gameplayCanvas.dataset.indexedVillagerTaskAssignments = countSummary(
          movementParties.map((party) => party.villagerTaskAssignment?.key),
        );
        gameplayCanvas.dataset.indexedBuildTransitionEstimates = String(
          movementParties.filter((party) => party.buildTransitionEstimate).length,
        );
        gameplayCanvas.dataset.visibleMovementParties = visibleMovementParties.length;
        gameplayCanvas.dataset.visibleMoveParties = visibleMovementParties.filter((party) => party.kind === 'move').length;
        gameplayCanvas.dataset.visibleAttackParties = visibleMovementParties.filter((party) => party.kind === 'attack').length;
        gameplayCanvas.dataset.visibleGatherParties = visibleMovementParties.filter((party) => party.kind === 'gather').length;
        gameplayCanvas.dataset.visibleBuildParties = visibleMovementParties.filter((party) => party.kind === 'build').length;
        gameplayCanvas.dataset.visibleRepairParties = visibleMovementParties.filter((party) => party.kind === 'repair').length;
        gameplayCanvas.dataset.activePartyKinds = countSummary(visibleMovementParties.map((party) => party.kind));
        gameplayCanvas.dataset.activeIndexedVillagerTaskAssignments = countSummary(
          visibleMovementParties.map((party) => party.villagerTaskAssignment?.key),
        );
        gameplayCanvas.dataset.activeVillagerTaskAssignments = countSummary(
          visibleEffectiveTaskRows.map(({ taskState }) => taskState.effectiveAssignment?.key),
        );
        gameplayCanvas.dataset.activeVillagerTaskPhases = countSummary(
          visibleEffectiveTaskRows.map(({ taskState }) => taskState.phase),
        );
        gameplayCanvas.dataset.activePostBuildResourceAssignments = countSummary(
          visibleEffectiveTaskRows.map(({ taskState }) =>
            taskState.estimate?.postBuildAssignment?.key),
        );
        gameplayCanvas.dataset.activeBuildTransitionEvidence = visibleEffectiveTaskRows
          .map(({ party, taskState }) => buildTransitionEvidenceDataset(party, taskState))
          .filter(Boolean)
          .join(';');
        gameplayCanvas.dataset.visibleMovementPartyMembers = visibleMovementParties
          .reduce((sum, party) => sum + party.members.length, 0);
        gameplayCanvas.dataset.currentMappedActorAssignments = String(currentMappedAssignments.length);
        gameplayCanvas.dataset.mapRenderedCategorizedMembers = String(mapRenderedCategorizedAssignments.length);
        gameplayCanvas.dataset.mapRenderedCategorizedMembersByPlayer = mappedActorTotalsByPlayer(mapRenderedCategorizedAssignments);
        gameplayCanvas.dataset.renderedCategorizedPartyMembersByPlayer = mappedActorTotalsByPlayer(mapRenderedCategorizedAssignments);
        gameplayCanvas.dataset.mapRenderedVillagerMembers = String(mapRenderedVillagerAssignments.length);
        gameplayCanvas.dataset.mapRenderedVillagerMembersByPlayer = mappedActorTotalsByPlayer(mapRenderedVillagerAssignments);
        gameplayCanvas.dataset.renderedVillagerPartyMembersByPlayer = mappedActorTotalsByPlayer(mapRenderedVillagerAssignments);
        gameplayCanvas.dataset.currentMappedEvidenceSplits = mappedActorEvidenceSplits(currentMappedAssignments);
        gameplayCanvas.dataset.currentMappedEvidenceSplitsByPlayer = mappedActorEvidenceSplitsByPlayer(currentMappedAssignments);
        gameplayCanvas.dataset.currentMappedActorEvidence = mappedActorLineEvidence(currentMappedAssignments);
        gameplayCanvas.dataset.visiblePartyEvidence = visibleEffectiveTaskRows
          .map(({ party, taskState }) => `${party.kind}${taskState.effectiveAssignment ? `/${taskState.effectiveAssignment.key}` : ''}${taskState.indexedAssignment && taskState.indexedAssignment !== taskState.effectiveAssignment ? `/indexed:${taskState.indexedAssignment.key}` : ''}${taskState.phase ? `/phase:${taskState.phase}` : ''}:${party.player}:${party.members.length}:${party.latestTime.toFixed(3)}@${party.position.x.toFixed(1)},${party.position.y.toFixed(1)}[${party.members.map((member) => member.instanceId).join(',')}]`)
          .join(';');
        gameplayCanvas.dataset.visiblePartyComposition = visibleMovementParties
          .map((party) => {
            const taskState = effectiveVillagerTaskStateForParty(party, seconds);
            const composition = partyComposition(party.members, taskState.effectiveAssignment, taskState);
            return `${party.kind}${taskState.effectiveAssignment ? `/${taskState.effectiveAssignment.key}` : ''}${taskState.indexedAssignment && taskState.indexedAssignment !== taskState.effectiveAssignment ? `/indexed:${taskState.indexedAssignment.key}` : ''}:${party.player}:${partyCompositionEvidence(composition)}:${party.latestTime.toFixed(3)}@${party.position.x.toFixed(1)},${party.position.y.toFixed(1)}[${party.members.map((member) => member.instanceId).join(',')}]`;
          })
          .join(';');
        gameplayCanvas.dataset.partyStripInterpolationClock = `replay-time:${seconds.toFixed(3)}`;
        gameplayCanvas.dataset.partyStripInterpolationEvidence = visiblePartyStripInterpolations
          .map(({ party, interpolation, taskState }) => partyStripInterpolationEvidence(party, interpolation, taskState))
          .join(';');
        gameplayCanvas.dataset.partyStripInterpolationFallbacks = String(
          visiblePartyStripInterpolations.filter(({ interpolation }) => interpolation.fallbackReason).length,
        );
        gameplayCanvas.dataset.partyStripInterpolated = String(
          visiblePartyStripInterpolations.filter(({ interpolation }) => !interpolation.fallbackReason).length,
        );
        const elapsedPartyOutcomes = movementParties.flatMap((party) =>
          party.members
            .filter((member) => member.endTime <= seconds)
            .map((member) => ({ ...member, key: `${party.player}:${member.instanceId}` })),
        );
        gameplayCanvas.dataset.assumptionAdjustedPartyLosses = new Set(
          elapsedPartyOutcomes
            .filter((member) => ['user-assumption loss estimate', 'selection-scoped assumption loss estimate'].includes(member.outcome))
            .map((member) => member.key),
        ).size;
        gameplayCanvas.dataset.possibleAggregateCorrelatedLosses = new Set(
          elapsedPartyOutcomes
            .filter((member) => member.outcome === 'possible aggregate-correlated loss')
            .map((member) => member.key),
        ).size;
        gameplayCanvas.dataset.assumptionAdjustedWorkerLosses = new Set(
          elapsedPartyOutcomes
            .filter((member) => member.worker
              && ['user-assumption loss estimate', 'selection-scoped assumption loss estimate'].includes(member.outcome))
            .map((member) => member.key),
        ).size;
        gameplayCanvas.dataset.selectionScopedAssumptionLosses = new Set(
          elapsedPartyOutcomes
            .filter((member) => member.outcome === 'selection-scoped assumption loss estimate')
            .map((member) => member.instanceId),
        ).size;
        gameplayCanvas.dataset.unresolvedOwnershipMembers = new Set(
          movementParties.flatMap((party) => party.members
            .filter((member) => member.ownershipUnresolved)
            .map((member) => `${party.player}:${member.instanceId}`)),
        ).size;
        gameplayCanvas.dataset.indexedPossiblePathBuildingEncounters = possiblePathBuildingEncounters.length;
        ['build', 'repair', 'gather', 'garrison', 'ungarrison', 'attack', 'target', 'order', 'move'].forEach((kind) => {
          gameplayCanvas.dataset[`visible${kind[0].toUpperCase()}${kind.slice(1)}Marks`] = String(
            ['move', 'attack'].includes(kind)
              ? visibleMovementParties.filter((party) => party.kind === kind).length
              : kind === 'gather'
                ? visibleGatherRows.length
              : recentRows.filter((row) => row.kind === kind).length,
          );
        });
        gameplayCanvas.dataset.visibleGatherMarkTimes = visibleGatherRows
          .map((row) => `${row.target_id ?? 'position'}:${row.time.toFixed(3)}`)
          .join(',');
        gameplayCanvas.dataset.activeGatherPoints = activeGatherPoints.length;
        gameplayCanvas.dataset.activeGatherPointSources = activeGatherPoints.map((row) => row.source_id).join(',');
        gameplayCanvas.dataset.activeGatherPointTargets = activeGatherPoints
          .map((row) => `${row.source_id}:${row.target_id ?? `${row.position.x.toFixed(2)},${row.position.y.toFixed(2)}`}`)
          .join(',');
        gameplayCanvas.dataset.syntheticVillagerGatherEvents = villagerGatherEvents.length;
        const nonFoodResourceIds = new Set(
          mapResources.resources
            .filter((resource) => !mapResources.animalStyles.has(resource.name))
            .map((resource) => resource.instance_id),
        );
        const depletedVisibleResourceIds = new Set(
          [...depletedIds, ...estimatedDepletedIds, ...constructionDepletedIds].filter((id) => nonFoodResourceIds.has(id)),
        );
        resourceCanvas.dataset.visibleResources = Math.max(0, mapResources.resources.length - depletedVisibleResourceIds.size - consumedGaiaFood);
        resourceCanvas.dataset.visibleGaiaFood = visibleGaiaFood;
        resourceCanvas.dataset.consumedGaiaFood = consumedGaiaFood;
        resourceCanvas.dataset.visibleAnimals = visibleAnimals;
        resourceCanvas.dataset.consumedAnimals = consumedAnimals;
        resourceCanvas.dataset.estimatedDepletions = estimatedDepletedNodes.length;
        resourceCanvas.dataset.constructionClearances = activeConstructionClearances.length;
        resourceCanvas.dataset.constructionDepletedResources = constructionDepletedIds.size;
        resourceCanvas.dataset.constructionDepletionPositions = activeConstructionDepletionPositions.length;
        resourceCanvas.dataset.constructionForestTiles = activeConstructionClearances
          .reduce((count, row) => count + row.forestTileCount, 0);
        resourceCanvas.dataset.activeAnimalMoves = [...animalMovementEvents.values()]
          .reduce((count, events) => count + upperBound(events, seconds), 0);
        resourceCanvas.dataset.movedAnimalPositions = [...animalMovementEvents.entries()].flatMap(([instanceId, events]) => {
          const index = upperBound(events, seconds) - 1;
          if (index < 0) return [];
          const position = events[index].position;
          return [`${instanceId}:${position.x.toFixed(3)},${position.y.toFixed(3)}`];
        }).join(';');
        resourceCanvas.dataset.finalCapacityAllocations = finalAllocationRows.length;
        buildingCanvas.dataset.visibleBuildings = buildingState.buildings.length;
        buildingCanvas.dataset.visibleMappedBuildingIcons = buildingIconRenderStats.visibleMapped;
        buildingCanvas.dataset.loadedVisibleMappedBuildingIcons = buildingIconRenderStats.loadedVisibleMapped;
        buildingCanvas.dataset.missingVisibleMappedBuildingIcons = buildingIconRenderStats.missingVisibleMapped;
        buildingCanvas.dataset.cachedBuildingIconImages = buildingIconImageCache.size;
        buildingCanvas.dataset.visibleBuildingEvidence = buildingState.buildings
          .map((row) => `${buildingName(row)}@${row.position.x.toFixed(1)},${row.position.y.toFixed(1)}:${(row.time ?? 0).toFixed(3)}:p${row.player ?? row.owner}`)
          .join(';');
        buildingCanvas.dataset.visibleRangeCircles = rangeBuildings.length;
        buildingCanvas.dataset.inferredClusterCollapseDemolitions = buildingState.clusterCollapseDemolitions;
        buildingCanvas.dataset.clusterCollapseEvidence = clusterCollapseDemolitions
          .map((row) => `${row.name}@${row.position.x.toFixed(1)},${row.position.y.toFixed(1)}:${row.time.toFixed(3)}:p${row.owner}:a${row.anchorCount}:d${row.directAnchorCount}`)
          .join(';');
        buildingCanvas.dataset.clusterCollapseModes = clusterCollapseDemolitions
          .map((row) => `${row.name}@${row.position.x.toFixed(1)},${row.position.y.toFixed(1)}:${row.time.toFixed(3)}:${row.controlMode ?? 'standard'}`)
          .join(';');
        buildingCanvas.dataset.clusterCollapseDirectAnchors = clusterCollapseDemolitions
          .map((row) => `${row.name}@${row.position.x.toFixed(1)},${row.position.y.toFixed(1)}:${row.time.toFixed(3)}:${(row.directAnchorEvidence ?? []).join('|')}`)
          .join(';');
        buildingCanvas.dataset.clusterCollapseEpisodeAnchors = clusterCollapseDemolitions
          .map((row) => `${row.name}@${row.position.x.toFixed(1)},${row.position.y.toFixed(1)}:${row.time.toFixed(3)}:${(row.episodeAnchorEvidence ?? []).join('|')}`)
          .join(';');
        buildingCanvas.dataset.clusterCollapseControlSamples = clusterCollapseDemolitions
          .map((row) => `${row.name}@${row.position.x.toFixed(1)},${row.position.y.toFixed(1)}:${row.time.toFixed(3)}:${(row.controlSampleEvidence ?? []).join('|')}`)
          .join(';');
        buildingCanvas.dataset.estimatedInactiveFarms = estimatedInactiveFarms;
        buildingCanvas.dataset.estimatedInferredReseeds = estimatedInferredReseeds;
        buildingCanvas.dataset.targetedDemolitions = buildingState.targetedDemolitions;
        buildingCanvas.dataset.occupationDemolitions = buildingState.occupationDemolitions;
        buildingCanvas.dataset.occupationDemolitionEvidence = occupationDemolitions
          .map((row) => `${row.name}@${row.position.x.toFixed(1)},${row.position.y.toFixed(1)}:${row.time.toFixed(3)}:${row.selectedActors}`)
          .join(';');
        buildingCanvas.dataset.possiblePathBuildingEncounters = possiblePathBuildingEncounters.length;
        buildingCanvas.dataset.pathEncounterEvidence = possiblePathBuildingEncounters
          .map((row) => `${row.time.toFixed(3)}:${row.building}@${row.position.x.toFixed(1)},${row.position.y.toFixed(1)}:${row.selectedCount}`)
          .join(';');
        buildingCanvas.dataset.overlapDemolitions = buildingState.overlapDemolitions;
        buildingCanvas.dataset.inferredDemolitions = buildingState.targetedDemolitions
          + buildingState.overlapDemolitions;
      }

      if (typeof ResizeObserver !== 'undefined') {
        const observer = new ResizeObserver(() => {
          update(Number(timelineSlider.value || 0));
        });
        observer.observe(spriteOverlay);
      }

      update.activeMappedActorAssignments = activeMappedActorAssignments;
      return update;
    }

    function renderMap(map, gaia) {
      const cellSize = 6;
      const dimension = map.dimension;
      const context = mapCanvas.getContext('2d');
      const terrainIds = [...new Set(map.tiles.map((tile) => tile.terrain))].sort((a, b) => a - b);
      const terrainTypes = new Map([
        [3, { name: 'Dirt 3', role: 'starting areas', color: '#d7b56d' }],
        [11, { name: 'Dirt 2', role: 'walkable land', color: '#b98b58' }],
        [14, { name: 'Desert sand', role: 'walkable land', color: '#e3c27a' }],
        [48, { name: 'Dragon tree forest', role: 'trees', color: '#174d2b' }],
        [89, { name: 'Bush forest', role: 'trees', color: '#557b38' }],
        [112, { name: 'Palm grass forest', role: 'trees', color: '#2c683a' }],
      ]);
      const terrainType = (id) => terrainTypes.get(id) ?? { name: `Unknown terrain ${id}`, role: 'unknown', color: '#888' };

      const resourceStyles = new Map([
        ['Gold Mine', { label: 'Gold mine', color: '#ffd700' }],
        ['Stone Mine', { label: 'Stone mine', color: '#d8d8d8' }],
      ]);
      const animalStyles = new Map([
        ['Sheep', { category: 'controllable', color: '#fff' }],
        ['Wild Boar', { category: 'non-controllable', color: '#6b3f22' }],
        ['Ibex', { category: 'non-controllable', color: '#6b3f22' }],
        ['Forage Bush', { category: 'non-controllable', color: '#6b3f22' }],
        ['Fruit Bush', { category: 'non-controllable', color: '#6b3f22' }],
      ]);
      const animalNames = new Set(['Sheep', 'Wild Boar', 'Ibex']);
      const resources = gaia.filter((object) => resourceStyles.has(object.name) || animalStyles.has(object.name));

      mapCanvas.width = dimension * cellSize;
      mapCanvas.height = dimension * cellSize;
      mapCanvas.dataset.tiles = map.tiles.length;
      context.imageSmoothingEnabled = false;

      map.tiles.forEach((tile) => {
        const left = tile.position.x * cellSize;
        const top = tile.position.y * cellSize;
        context.fillStyle = terrainType(tile.terrain).color;
        context.fillRect(left, top, cellSize, cellSize);
        if (tile.elevation > 0) {
          const strength = Math.min(.42, tile.elevation * .18);
          context.fillStyle = `rgba(255, 255, 255, ${strength})`;
          context.fillRect(left, top, cellSize, cellSize);
          context.fillStyle = 'rgba(255, 255, 255, .28)';
          context.fillRect(left, top, cellSize, 1);
          context.fillStyle = 'rgba(0, 0, 0, .18)';
          context.fillRect(left, top + cellSize - 1, cellSize, 1);
        }
      });

      context.strokeStyle = 'rgba(0, 0, 0, .25)';
      context.lineWidth = 1;
      for (let point = 0; point <= dimension; point += 10) {
        const offset = point * cellSize + .5;
        context.beginPath();
        context.moveTo(offset, 0);
        context.lineTo(offset, mapCanvas.height);
        context.stroke();
        context.beginPath();
        context.moveTo(0, offset);
        context.lineTo(mapCanvas.width, offset);
        context.stroke();
      }

      mapLegend.replaceChildren();
      function createLegendGroup(title) {
        const group = document.createElement('section');
        group.className = 'legend-group';
        const heading = document.createElement('strong');
        heading.className = 'legend-group-title';
        heading.textContent = title;
        group.append(heading);
        return group;
      }
      const legendGroups = {
        map: createLegendGroup('Map & Gaia objects'),
        timeline: createLegendGroup('Timeline'),
      };
      mapLegend.append(legendGroups.timeline, legendGroups.map);
      terrainIds.forEach((id) => {
        const item = document.createElement('span');
        item.className = 'legend-item';
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        const terrain = terrainType(id);
        swatch.style.backgroundColor = terrain.color;
        item.append(swatch, terrain.name);
        legendGroups.map.append(item);
      });
      resourceStyles.forEach((style) => {
        const item = document.createElement('span');
        item.className = 'legend-item';
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.backgroundColor = style.color;
        item.append(swatch, style.label);
        legendGroups.map.append(item);
      });
      [
        { label: 'Controllable food', color: '#fff' },
        { label: 'Non-controllable food', color: '#6b3f22' },
      ].forEach((style) => {
        const item = document.createElement('span');
        item.className = 'legend-item';
        const icon = document.createElement('span');
        icon.className = 'animal-symbol';
        icon.style.backgroundColor = style.color;
        item.append(icon, style.label);
        legendGroups.map.append(item);
      });

      const forestTerrainIds = new Set(
        [...terrainTypes.entries()].filter(([, terrain]) => terrain.role === 'trees').map(([id]) => id),
      );
      return { resources, resourceStyles, animalStyles, animalNames, forestTerrainIds, legendGroups };
    }

    function renderChat(game) {
      const players = new Map(game.match.players.map((player) => [player.number, player]));
      if (game.match.chat.length === 0) {
        const item = document.createElement('li');
        item.textContent = 'No chat messages.';
        chat.append(item);
        return;
      }
      game.match.chat.forEach((message) => {
        const player = players.get(message.player);
        const item = document.createElement('li');
        const timestamp = document.createElement('time');
        const speaker = document.createElement('strong');
        item.style.setProperty('--player-color', player?.color.toLowerCase() ?? '#888');
        timestamp.textContent = formatDuration(timestampSeconds(message.timestamp));
        speaker.textContent = `${player?.name ?? `Player ${message.player}`}: `;
        item.append(timestamp, ' — ', speaker, message.message);
        item.title = `${message.origination}; audience: ${message.audience}`;
        chat.append(item);
      });
    }

    function setViewerNotice(text, state = 'ready') {
      viewerNotice.textContent = text;
      viewerNotice.dataset.state = state;
      viewerNotice.setAttribute('role', state === 'error' ? 'alert' : 'status');
    }

    function parseViewerHandshake() {
      const params = new URLSearchParams(location.hash.slice(1));
      const requestId = params.get('requestId') ?? '';
      const nonce = params.get('nonce') ?? '';
      if (!isViewerHandshakeToken(requestId) || !isViewerHandshakeToken(nonce)) return null;
      return { requestId, nonce };
    }

    function isViewerHandshakeToken(value) {
      return /^[A-Za-z0-9._:-]{1,240}$/.test(value);
    }

    function postViewerReady() {
      if (!viewerHandshake) {
        setViewerNotice('Viewer handshake is missing or malformed.', 'error');
        return;
      }
      window.parent.postMessage({
        type: viewerReadyType,
        requestId: viewerHandshake.requestId,
        nonce: viewerHandshake.nonce,
      }, window.location.origin);
    }

    function handleShellScrollState(event) {
      const message = event.data;
      if (
        event.origin !== window.location.origin ||
        event.source !== window.parent ||
        !viewerHandshake ||
        !message ||
        message.type !== viewerShellScrollStateType ||
        message.requestId !== viewerHandshake.requestId ||
        message.nonce !== viewerHandshake.nonce ||
        !Number.isFinite(message.scrollTop) ||
        !Number.isFinite(message.scrollMax)
      ) {
        return false;
      }
      shellScrollTop = Math.max(0, message.scrollTop);
      shellScrollMax = Math.max(0, message.scrollMax);
      return true;
    }

    function relayBoundaryWheel(event) {
      if (event.ctrlKey || !viewerHandshake || event.deltaY === 0) return;
      const viewerScrollTop = document.scrollingElement?.scrollTop ?? window.scrollY;
      const scrollingShellDown = event.deltaY > 0 && shellScrollTop < shellScrollMax - 0.5;
      const scrollingShellUp = event.deltaY < 0 && viewerScrollTop <= 0.5 && shellScrollTop > 0.5;
      if (!scrollingShellDown && !scrollingShellUp) return;
      event.preventDefault();
      window.parent.postMessage({
        type: viewerShellScrollRequestType,
        requestId: viewerHandshake.requestId,
        nonce: viewerHandshake.nonce,
        deltaY: event.deltaY,
      }, window.location.origin);
    }

    function validateViewerPayload(payload, event) {
      if (event.origin !== window.location.origin || event.source !== window.parent) {
        return null;
      }
      if (!viewerHandshake) {
        throw new Error('Viewer handshake is missing or malformed.');
      }
      if (!payload || payload.type !== viewerPayloadType) {
        throw new Error('Viewer payload type is invalid.');
      }
      if (payload.requestId !== viewerHandshake.requestId || payload.viewerNonce !== viewerHandshake.nonce) {
        throw new Error('Viewer payload does not match this viewer request.');
      }
      if (!Array.isArray(payload.outputs)) {
        throw new Error('Viewer payload outputs must be an array.');
      }
      const allowedNames = new Set(viewerOutputNames);
      const outputNames = new Set();
      let totalBytes = 0;
      payload.outputs.forEach((entry) => {
        if (!entry || !allowedNames.has(entry.name)) {
          throw new Error('Viewer payload contains an unexpected output name.');
        }
        if (outputNames.has(entry.name)) {
          throw new Error(`Viewer payload contains duplicate ${entry.name}.`);
        }
        if (!(entry.buffer instanceof ArrayBuffer)) {
          throw new Error(`${entry.name} is missing its transferred ArrayBuffer.`);
        }
        if (!Number.isSafeInteger(entry.sizeBytes) || entry.sizeBytes < 0 || entry.sizeBytes > maxViewerJsonBytes) {
          throw new Error(`${entry.name} has an invalid byte size.`);
        }
        if (entry.sizeBytes !== entry.buffer.byteLength) {
          throw new Error(`${entry.name} byte size does not match its buffer.`);
        }
        if (!/^[a-f0-9]{64}$/.test(String(entry.sha256 ?? ''))) {
          throw new Error(`${entry.name} is missing a SHA-256 digest.`);
        }
        totalBytes += entry.sizeBytes;
        outputNames.add(entry.name);
      });
      viewerRequiredOutputNames.forEach((name) => {
        if (!outputNames.has(name)) throw new Error(`Viewer payload is missing ${name}.`);
      });
      if (totalBytes > maxViewerTotalJsonBytes) {
        throw new Error('Viewer payload is larger than the standalone dataview limit.');
      }
      return payload;
    }

    function parseOutput(output) {
      const text = new TextDecoder('utf-8', { fatal: true }).decode(output.buffer);
      const escapePattern = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const viewerUrl = new URL(location.href);
      const slash = viewerUrl.pathname.slice(0, 1);
      const colon = viewerUrl.protocol.slice(-1);
      const localHomePattern = slash + ['home', 'carlos'].join(slash);
      const localTempPattern = slash + 'tmp';
      const fileUrlPattern = ['file', colon, slash, slash].join('');
      const urlAuthorityPattern = colon + slash + slash;
      const forbidden = [
        new RegExp(escapePattern(localHomePattern)),
        new RegExp(`${escapePattern(localTempPattern)}(?:/|\\b)`),
        /\/work(?:\/|\b)/,
        new RegExp(escapePattern(fileUrlPattern)),
        /[A-Za-z]:\\/,
        new RegExp(`${escapePattern(urlAuthorityPattern)}[^\\s/:@]+:[^\\s/@]+@`),
      ];
      const match = forbidden.find((pattern) => pattern.test(text));
      if (match) throw new Error(`${output.name} contains a forbidden local path or credential pattern.`);
      return JSON.parse(text);
    }

    function outputMap(payload) {
      return new Map(payload.outputs.map((entry) => [entry.name, entry]));
    }

    function renderPayload(payload) {
      const byName = outputMap(payload);
      const game = parseOutput(byName.get('game.json'));
      const lifetimes = parseOutput(byName.get('lifetimes.json'));
      const economy = parseOutput(byName.get('economy.json'));
      const resourceEstimates = parseOutput(byName.get('resource_estimates.json'));
      const unitStatsOutput = byName.get('unit_stats.json');
      const unitStats = unitStatsOutput ? parseOutput(unitStatsOutput) : null;
      const estimates = resourceEstimates?.schema === 'aoe2-resource-reconstruction/v1'
        ? resourceEstimates
        : null;
      const stats = unitStats?.schema === 'aoe2-unit-stats/v1'
        ? unitStats
        : null;
      const mapResources = renderMap(game.match.map, game.match.gaia);
      const updateGameplay = renderGameplay(game, lifetimes, economy, mapResources, estimates, stats);
      renderTimeline(game, lifetimes, economy, estimates, stats, updateGameplay);
      renderChat(game);
      document.title = `${game.summary.map.name}: ${game.summary.players.map((player) => player.name).join(' vs ')}`;
      setViewerNotice(`${payload.replay.fileName} rendered from generated browser-local data. ${payload.unitStatsNotice}`);
    }

    function handleViewerMessage(event) {
      try {
        if (handleShellScrollState(event)) return;
        const payload = validateViewerPayload(event.data, event);
        if (!payload) return;
        renderPayload(payload);
      } catch (error) {
        setViewerNotice(`Could not render viewer data: ${error.message}`, 'error');
      }
    }

    window.addEventListener('message', handleViewerMessage);
    window.addEventListener('wheel', relayBoundaryWheel, { passive: false });
    postViewerReady();
  </script>
</body>
</html>
