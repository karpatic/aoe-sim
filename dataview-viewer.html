<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AoE II single-game data</title>
  <style>
    :root {
      --map-column-width: min(100dvh, calc(100vw - 24rem));
      --detail-column-width: calc(100vw - var(--map-column-width));
      --timeline-height: 3.35rem;
      --mobile-bottom-gap: 0px;
      --shell-controls-height: 0px;
      --map-zoom: 1;
      --map-pan-x: 0px;
      --map-pan-y: 0px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    main { display: grid; grid-template-columns: var(--map-column-width) minmax(24rem, 1fr); width: 100%; height: 100dvh; max-width: 100%; overflow: hidden; }
    body { margin: 0; overflow-wrap: anywhere; }
    details, summary, code { max-width: 100%; overflow-wrap: anywhere; }
    summary { cursor: pointer; }
    .tree { width: 100%; overflow: auto; border: 1px solid; padding: .5rem; }
    .node, .primitive { margin-left: 1rem; }
    code, .schema-object { white-space: pre-wrap; overflow-wrap: anywhere; }
    #map-column { display: grid; place-items: start center; width: 100%; height: 100dvh; min-width: 0; min-height: 0; overflow: hidden; background: #101214; }
    #detail-column { display: grid; align-content: start; gap: .5rem; min-width: 0; min-height: 0; height: 100dvh; margin: 0; padding: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
    #timeline-section, #timeline-players, #map-legend-details, #chat-section, #viewer-notice { width: 100%; max-width: none; }
    #map-stack { position: relative; width: 100%; height: 100dvh; overflow: hidden; touch-action: none; cursor: grab; }
    #map-stack[data-map-zoom="1"] { cursor: default; }
    #map-stack.is-panning { cursor: grabbing; }
    #map-viewport { position: absolute; inset: 0; transform: translate(var(--map-pan-x), var(--map-pan-y)) scale(var(--map-zoom)); transform-origin: 0 0; will-change: transform; }
    #map-canvas { display: block; width: 100%; height: 100%; border: 1px solid; object-fit: contain; image-rendering: pixelated; }
    #resource-canvas, #building-canvas, #gameplay-canvas, #sprite-overlay { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; }
    #sprite-overlay { overflow: visible; }
    .chat-panel { min-width: 0; margin: 0; border: 1px solid; }
    .chat-panel-heading { margin: 0; padding: .5rem; border-bottom: 1px solid; background: #eee; font-size: .92rem; line-height: 1.2; }
    #map-chat-overlay { display: flex; flex-direction: column; align-items: flex-start; gap: .22rem; min-height: 2.75rem; max-height: 11rem; padding: .5rem; overflow: auto; }
    .map-chat-message { max-width: 100%; padding: .18rem .38rem; color: #fff; background: rgba(8, 10, 12, .72); border-left: .3rem solid var(--player-color, #888); font: 700 .86rem/1.25 system-ui, sans-serif; text-shadow: 0 1px 2px #000, 1px 0 2px #000; overflow-wrap: anywhere; animation: map-chat-lifetime 6s linear forwards; }
    .map-chat-speaker { color: var(--player-color, #fff); }
    @keyframes map-chat-lifetime { 0%, 82% { opacity: 1; } 100% { opacity: 0; } }
    .unit-marker { position: absolute; display: grid; place-items: center; width: var(--unit-marker-size, 18px); height: var(--unit-marker-size, 18px); padding: 0; border: 0; color: #fff; background: transparent; image-rendering: pixelated; overflow: visible; transform: translate(-50%, -50%); will-change: left, top; }
    .unit-marker-image { display: block; width: var(--unit-marker-size, 18px); height: var(--unit-marker-size, 18px); object-fit: contain; image-rendering: pixelated; filter: var(--team-sprite-filter, grayscale(1) sepia(1) saturate(1.15) brightness(1.02) contrast(1.08)) drop-shadow(0 0 1px #101214) drop-shadow(0 0 2px var(--player-color, #fff)); pointer-events: none; }
    .unit-marker[data-reconciliation-status^="anonymous"] { border-style: dashed; }
    .unit-marker[data-reconciliation-status^="ambiguous"] { border-style: dotted; }
    .unit-marker-count { position: absolute; top: 50%; left: calc(100% + 1px); display: none; min-width: max(1.1em, calc(var(--unit-marker-count-digits, 1) * .66em + .42em)); padding: .06em .2em; border: 1px solid var(--player-color, #fff); border-radius: 999px; color: #fff; background: rgba(12, 14, 15, .9); font: 850 var(--unit-marker-count-font-size, 9px)/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; text-align: center; text-shadow: 0 1px 0 #111, 1px 0 0 #111; transform: translateY(-50%); white-space: nowrap; overflow-wrap: normal; }
    .unit-marker[data-stack-count]:not([data-stack-count="1"]) .unit-marker-count { display: inline-block; }
    .party-sprite-strip { position: absolute; display: none; align-items: center; gap: var(--strip-gap); height: var(--strip-height); padding: 0 var(--strip-padding-x); color: #fff; opacity: .96; font: bold var(--strip-font-size) sans-serif; line-height: 1; white-space: nowrap; image-rendering: pixelated; }
    .party-sprite-item { position: relative; display: inline-grid; place-items: center; width: var(--party-entry-width); height: var(--strip-height); }
    .party-sprite-image { justify-self: center; display: block; width: var(--sprite-size); height: var(--sprite-size); object-fit: contain; image-rendering: pixelated; filter: var(--team-sprite-filter, grayscale(1) sepia(1) saturate(1.15) brightness(1.02) contrast(1.08)) drop-shadow(0 0 1px #111) drop-shadow(0 0 2px var(--player-color)); }
    .party-sprite-count { position: absolute; top: 0; right: 0; display: inline-block; min-width: .9em; padding: .05em .16em; border: 1px solid var(--player-color); border-radius: 999px; color: #fff; background: rgba(12, 14, 15, .88); font-size: var(--badge-font-size); font-variant-numeric: tabular-nums; line-height: .95; text-align: center; text-shadow: 0 1px 0 #111, 1px 0 0 #111; transform: translate(30%, -18%); }
    #map-legend { margin: .5rem 0; }
    .legend-group { display: flex; flex-wrap: wrap; gap: .55rem .75rem; padding: .25rem 0; }
    .legend-group + .legend-group { margin-top: .35rem; padding-top: .55rem; border-top: 1px solid #bbb; }
    .legend-group-title { flex-basis: 100%; margin: 0; font-size: .82rem; }
    .legend-item { display: inline-flex; flex: 0 1 auto; min-width: 0; max-width: 100%; align-items: flex-start; white-space: normal; overflow-wrap: anywhere; }
    .legend-note { flex-basis: 100%; margin: 0; }
    .swatch { display: inline-block; flex: 0 0 auto; width: 1rem; height: 1rem; margin-right: .25rem; border: 1px solid; vertical-align: text-bottom; }
    .command-symbol { display: inline-block; flex: 0 0 auto; width: 1rem; margin-right: .25rem; text-align: center; font-weight: bold; line-height: 1rem; white-space: nowrap; overflow-wrap: normal; vertical-align: text-bottom; }
    .outlined-command-symbol { -webkit-text-stroke: 1.5px var(--command-outline); paint-order: stroke fill; text-shadow: 0 0 1px #111; }
    .animal-symbol { display: inline-block; flex: 0 0 auto; width: .75rem; height: .75rem; margin: 0 .5rem 0 .125rem; border: 1px solid #111; border-radius: 50%; vertical-align: -.05rem; }
    #timeline-section { position: fixed; z-index: 20; right: auto; bottom: 0; left: 0; width: var(--map-column-width); min-width: 0; min-height: 3.35rem; margin: 0; padding: .55rem; border-top: 1px solid #333; border-right: 1px solid #333; background: rgba(255, 255, 255, .97); box-shadow: 0 -.25rem .75rem rgba(0, 0, 0, .16); }
    #timeline-controls { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; width: 100%; margin: 0; padding: 0; }
    #timeline-slider { flex: 1 1 18rem; min-width: 0; }
    #timeline-map-size { flex: 0 0 auto; padding-inline: .65rem; white-space: nowrap; }
    #timeline-players { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(15.5rem, 100%), 1fr)); align-items: start; gap: .35rem; margin-bottom: .35rem; }
    .legend-category-icon { display: inline-block; flex: 0 0 auto; width: 1rem; height: 1rem; margin-right: .25rem; image-rendering: pixelated; vertical-align: text-bottom; }
    .panel-details { width: 100%; margin: 0; border: 1px solid; }
    .panel-details > summary { padding: .5rem; font-weight: bold; background: #eee; }
    .panel-details[open] > summary { border-bottom: 1px solid; }
    #map-legend-details > #map-legend { padding: 0 .5rem .5rem; }

    .player-state { border: 1px solid #2f2f2f; border-left: .45rem solid var(--player-color); background: #17191b; color: #f4f0dc; }
    .player-header { min-height: 1.9rem; padding: .32rem .45rem; overflow-x: auto; background: linear-gradient(#303438, #202326); }
    .player-summary { display: flex; align-items: baseline; gap: .38rem; margin: 0; white-space: nowrap; font-size: .92rem; line-height: 1.15; }
    .player-name { color: #fff; font-weight: 750; }
    .player-meta { color: #d1cbb6; font-size: .78rem; font-weight: 500; }
    .player-separator { color: #817d70; font-size: .75rem; font-weight: 400; }
    .economy-hud { width: 100%; table-layout: fixed; border-collapse: collapse; color: inherit; font-variant-numeric: tabular-nums; }
    .economy-hud caption { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .economy-hud th, .economy-hud td { height: 1.38rem; padding: .08rem .18rem; border-top: 1px solid #3b3e40; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .economy-hud thead th { height: 1.12rem; color: #d7d1bb; background: #222527; font-size: .68rem; font-weight: 600; letter-spacing: .02em; }
    .economy-hud thead th:first-child, .economy-hud tbody th { width: 3.8rem; text-align: left; }
    .economy-hud tbody th { color: #bdb7a3; background: #202326; font-size: .7rem; font-weight: 600; }
    .economy-hud td { background: #101214; font-size: .88rem; font-weight: 700; }
    .economy-hud .worker-total-cell { height: auto; min-height: 1.38rem; white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.05; }
    .economy-hud .worker-total-cell .worker-total-current,
    .economy-hud .worker-total-cell .worker-total-other { display: block; overflow: visible; text-overflow: clip; white-space: nowrap; }
    .economy-hud .worker-total-cell .worker-total-current { font-size: .88rem; line-height: 1; }
    .economy-hud .worker-total-cell .worker-total-other { margin-top: .04rem; color: #d7d1bb; font-size: .58rem; font-weight: 700; line-height: 1; }
    .economy-hud .worker-total-cell .worker-total-other[hidden] { display: none; }
    .economy-hud .resource-food { box-shadow: inset 0 .16rem #a75b3d; }
    .economy-hud .resource-wood { box-shadow: inset 0 .16rem #567b35; }
    .economy-hud .resource-gold { box-shadow: inset 0 .16rem #c49525; }
    .economy-hud .resource-stone { box-shadow: inset 0 .16rem #7a8188; }
    .player-details { min-width: 0; border-top: 1px solid #3b3e40; background: #202326; color: #f4f0dc; font-size: .76rem; }
    .player-details-body { padding: .35rem .5rem; }
    .player-icon-body { display: grid; grid-template-columns: 1.35rem minmax(0, 1fr); gap: .28rem; max-height: none; padding: .18rem .38rem .18rem .3rem; overflow: visible; }
    .player-side-heading { display: grid; place-items: center; align-self: stretch; min-width: 0; min-height: 0; margin: 0; padding: .08rem .1rem; border-right: 1px solid #3b3e40; color: #d7d1bb; background: #292d30; font-size: .6rem; font-weight: 700; line-height: 1; letter-spacing: 0; text-align: center; white-space: nowrap; writing-mode: vertical-rl; transform: rotate(180deg); }
    .player-icon-host { min-width: 0; min-height: 0; overflow: visible; line-height: 1.35; }
    .player-icon-host > .sprite-grid { min-width: 0; }
    .player-units-summary { margin: 0; line-height: 1.35; }
    .sprite-grid { display: flex; flex-wrap: wrap; gap: .18rem; margin: 0; padding: 0; list-style: none; overflow: visible; }
    .sprite-tile { position: relative; display: inline-grid; place-items: center; width: 1.85rem; height: 1.85rem; padding: .06rem; border: 1px solid #363a3c; border-radius: 3px; background: #101214; image-rendering: pixelated; cursor: pointer; }
    .sprite-tile:hover { border-color: #c9b66b; background: #171b1d; }
    .sprite-tile:focus { outline: 2px solid #f2d46f; outline-offset: 2px; }
    .sprite-tile:focus:not(:focus-visible) { outline: 0; }
    .sprite-tile img { display: block; max-width: 1.55rem; max-height: 1.55rem; object-fit: contain; image-rendering: pixelated; }
    .sprite-count { position: absolute; top: -.3rem; right: -.25rem; min-width: .95rem; padding: .02rem .13rem; border: 1px solid var(--player-color, #505456); border-radius: 999px; color: #fff; background: rgba(12, 14, 15, .92); font-size: .58rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: .95; text-align: center; text-shadow: 0 1px 0 #111; }
    .unit-stat-list { gap: .16rem; align-items: flex-start; overflow: visible; }
    .unit-count-tile { grid-template-columns: 2rem minmax(1.25rem, auto); align-items: center; justify-content: start; flex: 0 1 auto; width: auto; min-width: 3.65rem; max-width: 100%; height: 2.55rem; min-height: 0; padding: .12rem .2rem .12rem .12rem; gap: .14rem; overflow: hidden; }
    .unit-count-tile img { justify-self: center; width: 1.9rem; height: 1.9rem; max-width: 1.9rem; max-height: 1.9rem; }
    .unit-count-metrics { display: grid; grid-template-rows: repeat(3, minmax(.62rem, auto)); align-content: center; gap: .03rem; min-width: 0; }
    .unit-count-metric { display: block; min-width: 0; padding: 0; font-variant-numeric: tabular-nums; line-height: 1; }
    .unit-count-value { display: block; min-width: 1.25rem; color: #fff; font-size: .68rem; font-weight: 800; line-height: 1; text-align: right; overflow-wrap: anywhere; }
    .unit-count-metric-queued .unit-count-value { color: #fff4bd; }
    .unit-count-metric-built .unit-count-value { color: #d8edff; }
    .unit-stat-caveat { margin: .35rem 0 0; color: #aaa38f; font-size: .7rem; line-height: 1.25; }
    .sprite-name-label { position: fixed; z-index: 1000; max-width: min(16rem, calc(100vw - 1rem)); padding: .2rem .38rem; border: 1px solid #5c5642; border-radius: 3px; color: #fff8d7; background: rgba(13, 15, 16, .96); box-shadow: 0 2px 8px rgba(0, 0, 0, .35); font: 700 .72rem/1.15 sans-serif; text-align: center; overflow-wrap: anywhere; pointer-events: none; }
    #viewer-notice { margin: 0; padding: .45rem .6rem; border: 1px solid #777; background: #f7f7f7; }
    #viewer-notice[hidden] { display: none; }
    #viewer-notice[data-state="error"] { border-color: #7f1d1d; color: #7f1d1d; background: #fff7f7; }
    .hud-sprite-frame { display: grid; place-items: center; width: 1.55rem; height: 1.55rem; }
    .unit-count-tile .hud-sprite-frame { justify-self: center; width: 1.9rem; height: 1.9rem; }
    .hud-sprite-frame img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
    .hud-sprite-fallback, .generated-marker { display: inline-grid; place-items: center; width: 1.15rem; height: 1.15rem; border: 1px solid currentColor; border-radius: 3px; color: #f4f0dc; background: #101214; font: 800 .62rem/1 sans-serif; text-align: center; }
    .unit-count-tile .hud-sprite-fallback { width: 1.55rem; height: 1.55rem; }
    .legend-category-icon.generated-marker { margin-right: .25rem; color: #111; background: #eee; }
    .unit-marker .unit-marker-fallback { display: none; width: calc(var(--unit-marker-size, 18px) - 3px); height: calc(var(--unit-marker-size, 18px) - 3px); color: #fff; border-color: var(--player-color); background: rgba(12, 14, 15, .88); font-size: var(--unit-marker-font-size, 8px); text-shadow: 0 1px 0 #111; }
    .unit-marker[data-sprite-load-state="error"] .unit-marker-image { display: none; }
    .unit-marker[data-sprite-load-state="error"] .unit-marker-fallback { display: inline-grid; }
    .party-sprite-image.generated-marker { justify-self: center; width: var(--sprite-size); height: var(--sprite-size); color: #fff; border-color: var(--player-color); background: rgba(12, 14, 15, .88); text-shadow: 0 1px 0 #111; filter: drop-shadow(0 0 1px #111) drop-shadow(0 0 2px var(--player-color)); }
    @media (max-width: 50rem) {
      :root {
        --map-column-width: 0px;
        --detail-column-width: 100vw;
        --mobile-bottom-gap: max(.45rem, env(safe-area-inset-bottom));
      }
      main { grid-template: minmax(0, 48dvh) minmax(0, 1fr) / 100%; }
      #map-column { grid-row: 1; height: 100%; min-height: 0; }
      #map-stack { width: auto; max-width: none; height: 100%; aspect-ratio: 1; }
      #detail-column { grid-row: 2; height: 100%; min-height: 0; padding: 0; }
      #timeline-section { bottom: var(--mobile-bottom-gap); left: 0; width: 100vw; border-right: 0; }
      #map-chat-overlay { max-height: 8rem; }
      .node, .primitive { margin-left: .6rem; }
      dd { margin-left: 1rem; }
      .player-header { min-height: 2.25rem; }
      .economy-hud thead th:first-child, .economy-hud tbody th { width: 3.8rem; }
      .economy-hud th, .economy-hud td { padding-inline: .12rem; }
    }
  </style>
</head>
<body>
  <main>
    <section id="map-column" aria-label="Map">
      <div id="map-stack">
        <div id="map-viewport">
          <canvas id="map-canvas" aria-label="Terrain and elevation map"></canvas>
          <canvas id="resource-canvas" aria-label="Resource layer"></canvas>
          <canvas id="building-canvas" aria-label="Persistent building placement layer"></canvas>
          <canvas id="gameplay-canvas" aria-label="Character and command evidence layer"></canvas>
          <div id="sprite-overlay" aria-hidden="true"></div>
        </div>
      </div>
    </section>
    <aside id="detail-column" aria-label="Replay details">
      <section id="timeline-section" aria-label="Timeline">
        <div id="timeline-controls">
          <button id="timeline-play" type="button">Play</button>
          <button id="timeline-speed" type="button" aria-label="Playback speed: 30×. Activate for 4×.">30×</button>
          <button id="timeline-map-size" type="button" aria-label="Map zoom: fit. Activate for 2×.">Zoom</button>
          <input id="timeline-slider" type="range" min="0" value="0" step="any" aria-label="Match time">
          <output id="timeline-time" for="timeline-slider"></output>
        </div>
      </section>
      <div id="timeline-players" aria-label="Player statistics"></div>
      <details id="map-legend-details" class="panel-details">
        <summary>Map legend</summary>
        <div id="map-legend" aria-label="Map legend"></div>
      </details>
      <details id="chat-section" class="panel-details chat-panel" aria-label="Replay chat">
        <summary>Chat</summary>
        <div id="map-chat-overlay" role="log" aria-live="polite" aria-label="Replay chat"></div>
      </details>
      <p id="viewer-notice" role="alert" hidden></p>
    </aside>
  </main>
  <noscript>This viewer requires JavaScript and a same-origin upload page data payload.</noscript>
  <script>
    const main = document.querySelector('main');
    const viewerNotice = document.querySelector('#viewer-notice');
    const timelineSection = document.querySelector('#timeline-section');
    const timelinePlay = document.querySelector('#timeline-play');
    const timelineSpeed = document.querySelector('#timeline-speed');
    const timelineMapSize = document.querySelector('#timeline-map-size');
    const timelineSlider = document.querySelector('#timeline-slider');
    const timelineTime = document.querySelector('#timeline-time');
    const timelinePlayers = document.querySelector('#timeline-players');
    const detailColumn = document.querySelector('#detail-column');

    const mapStack = document.querySelector('#map-stack');
    const mapViewport = document.querySelector('#map-viewport');
    const mapCanvas = document.querySelector('#map-canvas');
    const resourceCanvas = document.querySelector('#resource-canvas');
    const buildingCanvas = document.querySelector('#building-canvas');
    const gameplayCanvas = document.querySelector('#gameplay-canvas');
    const spriteOverlay = document.querySelector('#sprite-overlay');
    const mapLegendDetails = document.querySelector('#map-legend-details');
    const mapLegend = document.querySelector('#map-legend');

    const mapChatOverlay = document.querySelector('#map-chat-overlay');
    const mapPanThresholdPx = 6;
    const mapViewState = {
      scale: 1,
      panX: 0,
      panY: 0,
      pointer: null,
    };
    let timelineResizeObserver = null;
    let mapViewResizeObserver = null;

    function clampNumber(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, value));
    }

    function clampedMapPan(panX, panY, scale = mapViewState.scale) {
      const bounds = mapStack.getBoundingClientRect();
      const width = Math.max(1, bounds.width);
      const height = Math.max(1, bounds.height);
      return {
        x: scale <= 1 ? 0 : clampNumber(panX, width - width * scale, 0),
        y: scale <= 1 ? 0 : clampNumber(panY, height - height * scale, 0),
      };
    }

    function applyMapViewState() {
      const pan = clampedMapPan(mapViewState.panX, mapViewState.panY);
      mapViewState.panX = pan.x;
      mapViewState.panY = pan.y;
      document.documentElement.style.setProperty('--map-zoom', String(mapViewState.scale));
      document.documentElement.style.setProperty('--map-pan-x', `${pan.x}px`);
      document.documentElement.style.setProperty('--map-pan-y', `${pan.y}px`);
      mapViewport.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${mapViewState.scale})`;
      mapStack.classList.toggle('is-zoomed', mapViewState.scale > 1);
      mapStack.dataset.mapZoom = String(mapViewState.scale);
      mapStack.dataset.mapPan = `${pan.x.toFixed(1)},${pan.y.toFixed(1)}`;
      mapStack.dataset.mapPanThresholdPx = String(mapPanThresholdPx);
      mapViewport.dataset.mapZoom = String(mapViewState.scale);
      mapViewport.dataset.mapPan = mapStack.dataset.mapPan;
      [mapCanvas, resourceCanvas, buildingCanvas, gameplayCanvas, spriteOverlay].forEach((element) => {
        element.dataset.mapZoom = String(mapViewState.scale);
        element.dataset.mapPan = mapStack.dataset.mapPan;
      });
    }

    function setMapZoom(scale) {
      const nextScale = Number(scale) || 1;
      const bounds = mapStack.getBoundingClientRect();
      const oldScale = mapViewState.scale || 1;
      if (nextScale <= 1) {
        mapViewState.scale = 1;
        mapViewState.panX = 0;
        mapViewState.panY = 0;
        applyMapViewState();
        return;
      }
      const centerX = (bounds.width / 2 - mapViewState.panX) / oldScale;
      const centerY = (bounds.height / 2 - mapViewState.panY) / oldScale;
      mapViewState.scale = nextScale;
      mapViewState.panX = bounds.width / 2 - centerX * nextScale;
      mapViewState.panY = bounds.height / 2 - centerY * nextScale;
      applyMapViewState();
    }

    const spriteTileNameLabel = (() => {

      const gap = 6;

      let hoveredTile = null;
      let focusedTile = null;
      let pinnedTile = null;

        return event.relatedTarget instanceof Node ? event.relatedTarget : null;

        if (!isUsableTile(focusedTile)) {
          focusedTile = null;
          focusedAt = 0;

        if (!isUsableTile(pinnedTile)) {
          pinnedTile = null;
          pinnedAt = 0;

        if (!isUsableTile(tile)) {
          hideLabel();
          return;

        const node = ensureLabel();
        const rect = tile.getBoundingClientRect();
        node.textContent = tile.dataset.itemName;
        node.hidden = false;
        node.style.left = '0px';
        node.style.top = '0px';
        node.style.visibility = 'hidden';

        const labelRect = node.getBoundingClientRect();
        const maxLeft = Math.max(margin, window.innerWidth - labelRect.width - margin);
        const maxTop = Math.max(margin, window.innerHeight - labelRect.height - margin);
        const preferredTop = rect.top - labelRect.height - gap;
        const fallbackTop = rect.bottom + gap;
        const unclampedTop = preferredTop >= margin ? preferredTop : fallbackTop;
        const left = Math.min(Math.max(rect.left + rect.width / 2 - labelRect.width / 2, margin), maxLeft);
        const top = Math.min(Math.max(unclampedTop, margin), maxTop);

        node.style.top = `${top}px`;

      const parts = [
        `${unit.name} (${unitIdentityText(unit)}).`,
        `Total built/produced estimate: ${unit.produced}; this is economy.unit_completions production intent and excludes starting units.`,
        `Queued estimate: ${unit.queued} active queue intent remaining after estimated completions and observed unqueue commands.`,
        `Current map-position estimate: ${unit.currentMapEstimate}; counted from active, deduplicated individual map markers for this line.`,
        unit.currentMapEvidenceTitle,
        unit.title,
        unit.mapPositionNote,
        unitSpriteTitle(unit),
      ];
      if (stats && baseStats) {
        const statParts = [
          ['HP', formatStatNumber(statScalar(stats, 'hp')), formatStatNumber(statScalar(baseStats, 'hp')), statChanged(baseStats, stats, 'hp'), ''],
          ['Atk', formatStatNumber(statScalar(stats, 'attack')), formatStatNumber(statScalar(baseStats, 'attack')), statChanged(baseStats, stats, 'attack'), stats.attack?.kind ? `${stats.attack.kind} class ${stats.attack.class}` : ''],
          ['Arm', armorText(stats), armorText(baseStats), statChanged(baseStats, stats, 'armor'), 'melee/pierce'],
          ['Range', rangeText(stats), rangeText(baseStats), statChanged(baseStats, stats, 'range'), 'min-max when a minimum range exists'],
          ['Spd', formatStatNumber(statScalar(stats, 'speed')), formatStatNumber(statScalar(baseStats, 'speed')), statChanged(baseStats, stats, 'speed'), ''],
          ['LoS', formatStatNumber(statScalar(stats, 'line_of_sight')), formatStatNumber(statScalar(baseStats, 'line_of_sight')), statChanged(baseStats, stats, 'line_of_sight'), ''],
          ['Rld', formatStatNumber(statScalar(stats, 'reload_time')), formatStatNumber(statScalar(baseStats, 'reload_time')), statChanged(baseStats, stats, 'reload_time'), ''],
        ].map(([label, value, baseValue, changed, detail]) =>
          changed
            ? `${label}: base ${baseValue}, effective ${value}${detail ? ` (${detail})` : ''}`
            : `${label}: ${value}${detail ? ` (${detail})` : ''}`);
        parts.push(`Current stats: ${statParts.join('; ')}.`);
      }
      parts.push(caveat);
      return parts.filter(Boolean).join(' ');
    }

    function unitMetricElement(kind, value) {
      const metric = document.createElement('span');
      metric.className = `unit-count-metric unit-count-metric-${kind}`;
      const valueElement = document.createElement('span');
      valueElement.className = 'unit-count-value';

    function renderUnitStatsList(container, visibleUnits, playerUnitStats, snapshot, caveat, fallbackTitle, imageCache) {
      spriteTileNameLabel.dismissWithin(container);

    function unitRemainderClassificationText(inventory) {
      if (!inventory) return '';
      return [
        `side produced+queued ${inventory.sidePanelAggregate}`,
        `map-visible positioned ${inventory.mapVisiblePositioned}`,
        `position-known hidden ${inventory.positionKnown}`,
        `position-unknown ${inventory.positionUnknown}`,
        `queued-only ${inventory.queuedOnly}`,
        `unresolved actor ${inventory.unresolvedActor}`,
        `lifecycle-filtered ${inventory.lifecycleFiltered}`,
      ].join(', ');
    }

    function unitSummaryAccessibleDescription(producedTotal, queuedTotal, currentMapTotal, inventory = null) {
      const classification = unitRemainderClassificationText(inventory);
      return `Total built/produced ${producedTotal}, queued ${queuedTotal}, current map-position estimate ${currentMapTotal}. Units show estimated queue births, queued intent, and current individual map markers. Total built/produced excludes starting units. Current map-position counts only classified individual units visible from observed, simulated, or reconciled timeline rows; absent or stale positions are position-unknown, not confirmed dead, and this is not a complete army population.${classification ? ` Current side/map classification: ${classification}.` : ''}`;
    }

    const technologyLinePatterns = Object.freeze([
      ['age', /\b(feudal age|castle age|imperial age)\b/],
      ['eco:lumber', /\b(double bit axe|bow saw|two man saw)\b/],
      ['eco:farm', /\b(horse collar|heavy plow|crop rotation)\b/],
      ['eco:cart', /\b(wheelbarrow|hand cart)\b/],
      ['eco:gold', /\b(gold mining|gold shaft mining)\b/],
      ['eco:stone', /\b(stone mining|stone shaft mining)\b/],
      ['vision:town', /\b(town watch|town patrol)\b/],
      ['blacksmith:ranged-attack', /\b(fletching|bodkin arrow|bracer)\b/],
      ['blacksmith:ranged-armor', /\b(padded archer armor|leather archer armor|ring archer armor)\b/],
      ['blacksmith:melee-attack', /\b(forging|iron casting|blast furnace)\b/],
      ['blacksmith:infantry-armor', /\b(scale mail armor|chain mail armor|plate mail armor)\b/],
      ['blacksmith:cavalry-armor', /\b(scale barding armor|chain barding armor|plate barding armor)\b/],
      ['unit:militia', /\b(man at arms|long swordsman|two handed swordsman|champion)\b/],
      ['unit:spear', /\b(pikeman|halberdier)\b/],
      ['unit:scout', /\b(light cavalry|hussar|magyar huszar)\b/],
      ['unit:knight', /\b(cavalier|paladin)\b/],
      ['unit:mangonel', /\b(onager|siege onager)\b/],
      ['unit:ram', /\b(capped ram|siege ram)\b/],
      ['unit:skirmisher', /\b(skirmisher|imperial skirmisher)\b/],
      ['unit:genoese-crossbowman', /\bgenoese crossbowman\b/],
    ]);

    function technologyLineKey(technology) {
      const normalized = normalizedLookupName(technology?.name);
      const matched = technologyLinePatterns.find(([, pattern]) => pattern.test(normalized));
      if (matched) return matched[0];
      const upgradeTarget = technology?.unit_upgrades?.[0]?.target_unit_id;
      if (Number.isInteger(upgradeTarget)) return `unit-upgrade:${upgradeTarget}`;
      return Number.isInteger(technology?.technology_id)
        ? `tech:${technology.technology_id}`
        : `tech-name:${normalized}`;
    }

    function topTechnologyLines(technologies) {
      const byLine = new Map();
      technologies
        .filter((technology) => technology.name && !technology.source?.startsWith('civilization_hidden'))
        .forEach((technology) => {
          const key = technologyLineKey(technology);
          const prior = byLine.get(key);
          if (!prior || technology.time >= prior.time) byLine.set(key, technology);
        });
      return [...byLine.values()].sort((a, b) => a.time - b.time || a.name.localeCompare(b.name));
    }

    function renderTechnologyGrid(container, technologies, imageCache) {
      spriteTileNameLabel.dismissWithin(container);
      container.replaceChildren();
      if (!technologies.length) {
        container.textContent = 'None yet';
        container.title = 'No visible completed technologies yet.';
        return;
      }
      const list = document.createElement('ul');
      list.className = 'sprite-grid technology-list';
      const imageClaims = new Map();
      technologies.forEach((technology) => {
        const item = document.createElement('li');
        item.className = 'sprite-tile';
        spriteTileNameLabel.configure(item, technology.name);
        const cacheKey = `tech:${technology.technology_id ?? technologyLineKey(technology)}:${technology.name}:${technology.time}`;
        const image = cachedHudSpriteImage(imageCache, imageClaims, cacheKey, () =>
          createHudSpriteImage(resolveTechnologyHudSprite(technology)));
        item.title = `${technology.name}: completed by ${formatDuration(technology.time)}.`;
        item.setAttribute('aria-label', `${technology.name}, completed by ${formatDuration(technology.time)}.`);
        item.append(image);
        list.append(item);
      });
      container.append(list);
      container.title = 'Showing only the highest completed technology in each conservative upgrade line.';
    }

    function dedupeAdjacentInputRows(rows, identityForRow) {
      const sortedRows = rows
        .map((row) => ({ ...row, time: timestampSeconds(row.timestamp) }))
        .sort((a, b) => a.time - b.time || (a.payload?.sequence ?? 0) - (b.payload?.sequence ?? 0));
      const deduped = [];
      const lastByIdentity = new Map();
      sortedRows.forEach((row) => {
        const identity = identityForRow(row);
        const prior = lastByIdentity.get(identity);
        if (prior && row.time - prior.time <= 1) return;
        deduped.push(row);
        lastByIdentity.set(identity, row);
      });
      return deduped;
    }

    function inputSourceIds(row) {
      return uniqueNormalizedIds(row.payload?.object_ids).sort((a, b) => a - b);
    }

    function resolveUnitLineIdentity(row, statSnapshot, playerUnitStats) {
      const sourceValue = row.unitId ?? row.unit_id ?? row.object_id;
      const sourceUnitId = Number(sourceValue);
      const resolvedUnitId = Number(statSnapshot?.resolved_unit_ids?.[String(sourceUnitId)] ?? sourceUnitId);
      const resolvedUnit = Number.isInteger(resolvedUnitId) ? snapshotUnit(statSnapshot, resolvedUnitId) : null;
      const unitRecord = Number.isInteger(resolvedUnitId)
        ? playerUnitStats?.units?.[String(resolvedUnitId)]
        : null;
      const sourceRecord = Number.isInteger(sourceUnitId)
        ? playerUnitStats?.units?.[String(sourceUnitId)]
        : null;
      const name = resolvedUnit?.name ?? unitRecord?.name ?? sourceRecord?.name ?? row.name ?? 'Unit';
      const stats = resolvedUnit?.stats ?? unitRecord?.base_stats ?? sourceRecord?.base_stats ?? null;
      const classId = unitRecord?.class_id ?? sourceRecord?.class_id ?? null;
      const category = classifyUnitCategory({ name, stats, classId, worker: name === 'Villager' });
      return {
        key: Number.isInteger(resolvedUnitId) ? `unit:${resolvedUnitId}` : `unit-name:${name}`,
        unit_id: Number.isInteger(resolvedUnitId) ? resolvedUnitId : null,
        sourceUnitId: Number.isInteger(sourceUnitId) ? sourceUnitId : null,
        name,
        category,
      };
    }

    function categorySortValue(category) {
      const index = categoryDefinitions.findIndex((definition) => definition.key === category);
      return index === -1 ? categoryDefinitions.length : index;
    }

    function createProductionTracker(game, economy, gameplayTimeline = null) {
      function queueIdentity(row) {
        const payload = row.payload ?? {};
        return [
          row.player,
          row.type,
          payload.unit_id ?? '',
          payload.unit ?? row.param ?? '',
          payload.amount ?? 1,
          inputSourceIds(row).join(','),
        ].join(':');
      }

      function unqueueIdentity(row) {
        const payload = row.payload ?? {};
        return [
          row.player,
          row.type,
          payload.order_id ?? '',
          payload.slot_id ?? '',
          inputSourceIds(row).join(','),
        ].join(':');
      }

      const queueEvents = dedupeAdjacentInputRows(
        game.match.inputs.filter((row) => row.type === 'Queue'),
        queueIdentity,
      ).map((row) => {
        const sourceIds = inputSourceIds(row);
        const payload = row.payload ?? {};
        return {
          time: row.time,
          player: row.player,
          sourceIds,
          unitId: Number.isInteger(payload.unit_id) ? payload.unit_id : null,
          name: payload.unit ?? row.param ?? 'Unit',
          amount: Math.max(1, Number(payload.amount) || 1),
        };
      });

      const unqueueEvents = dedupeAdjacentInputRows(
        game.match.inputs.filter((row) => row.type === 'Unqueue'),
        unqueueIdentity,
      ).map((row) => ({
        time: row.time,
        player: row.player,
        sourceIds: inputSourceIds(row),
      }));

      function sourceIdsIntersect(first, second) {
        if (!first.length || !second.length) return true;
        const lookup = new Set(first);
        return second.some((id) => lookup.has(id));
      }

      function decrementEntry(entries, count, predicate, preferLatest = false) {
        let remaining = count;
        const candidates = entries
          .map((entry, index) => ({ entry, index }))
          .filter(({ entry }) => entry.remaining > 0 && predicate(entry))
          .sort((a, b) => preferLatest
            ? b.entry.time - a.entry.time || b.index - a.index
            : a.entry.time - b.entry.time || a.index - b.index);
        for (const { entry } of candidates) {
          if (remaining <= 0) break;
          const deduction = Math.min(entry.remaining, remaining);
          entry.remaining -= deduction;
          remaining -= deduction;
        }
        return count - remaining;
      }

      function sourceUnitLabel(item, playerUnitStats) {
        if (!Number.isInteger(item.sourceUnitId)) return item.name;
        const sourceName = playerUnitStats?.units?.[String(item.sourceUnitId)]?.name ?? item.name;
        return `${sourceName} #${item.sourceUnitId}`;
      }

      function addUnitRow(rowMap, item, playerUnitStats, produced = 0, queued = 0, note = '') {
        const key = item.key;
        const row = rowMap.get(key) ?? {
          itemKey: item.key,
          unit_id: item.unit_id,
          name: item.name,
          category: item.category,
          produced: 0,
          queued: 0,
          starting: 0,
          sourceCounts: new Map(),
          queueSourceIds: new Set(),
          notes: new Set(),
        };
        row.produced += produced;
        row.queued += queued;
        if (produced > 0) {
          const sourceLabel = sourceUnitLabel(item, playerUnitStats);
          row.sourceCounts.set(sourceLabel, (row.sourceCounts.get(sourceLabel) ?? 0) + produced);
        }
        if (queued > 0 && Number.isInteger(item.sourceUnitId)) row.queueSourceIds.add(item.sourceUnitId);
        if (note) row.notes.add(note);
        rowMap.set(key, row);
      }

      function activeQueueRows(player, seconds, statSnapshot, playerUnitStats) {
        const entries = [];
        const timeline = [
          ...queueEvents
            .filter((event) => event.player === player && event.time <= seconds)
            .map((event) => ({ phase: 0, type: 'queue', event })),
          ...unqueueEvents
            .filter((event) => event.player === player && event.time <= seconds)
            .map((event) => ({ phase: 1, type: 'unqueue', event })),
          ...economy.unit_completions
            .filter((event) => event.player === player && event.time <= seconds)
            .map((event) => ({ phase: 2, type: 'completion', event })),
        ].sort((a, b) => a.event.time - b.event.time || a.phase - b.phase);

        let conservativeUnqueueDeductions = 0;
        timeline.forEach(({ type, event }) => {
          if (type === 'queue') {
            const item = resolveUnitLineIdentity(event, statSnapshot, playerUnitStats);
            entries.push({
              time: event.time,
              remaining: event.amount,
              sourceIds: event.sourceIds,
              sourceUnitId: item.sourceUnitId,
              item,
            });
            return;
          }
          if (type === 'completion') {
            const item = resolveUnitLineIdentity(event, statSnapshot, playerUnitStats);
            const producerId = normalizedObjectId(event.producer_id);
            for (let index = 0; index < event.count; index += 1) {
              const exact = decrementEntry(entries, 1, (entry) =>
                entry.sourceUnitId === item.sourceUnitId
                  && (producerId === null || !entry.sourceIds.length || entry.sourceIds.includes(producerId)));
              if (exact) continue;
              decrementEntry(entries, 1, (entry) => entry.item.key === item.key);
            }
            return;
          }
          const deducted = decrementEntry(entries, 1, (entry) =>
            sourceIdsIntersect(entry.sourceIds, event.sourceIds), true);
          conservativeUnqueueDeductions += deducted;
        });

        return {
          entries: entries.filter((entry) => entry.remaining > 0),
          conservativeUnqueueDeductions,
        };
      }

      function gameplayUnitRowsForPlayer(player, seconds, playerUnitStats) {
        if (gameplayTimeline?.schema !== 'aoe-sim.dataview-gameplay-timeline/v1') return null;
        const rowMap = new Map();
        (gameplayTimeline.units ?? [])
          .filter((unit) =>
            unit.player === player
            && unit.birth_kind === 'queue_estimate'
            && Number(unit.birth_time) <= seconds)
          .forEach((unit) => {
            const item = {
              key: Number.isInteger(unit.resolved_unit_id)
                ? `unit:${unit.resolved_unit_id}`
                : `unit-name:${unit.name}`,
              unit_id: Number.isInteger(unit.resolved_unit_id) ? unit.resolved_unit_id : null,
              sourceUnitId: Number.isInteger(unit.unit_id) ? unit.unit_id : null,
              name: unit.name,
              category: unit.category,
            };
            const note = unit.reconciliation?.status === 'matched'
              ? 'Produced count is an estimated queue birth reconciled to a later observed actor ID.'
              : 'Produced count is an estimated queue birth; it is not a confirmed spawn observation.';
            addUnitRow(rowMap, item, playerUnitStats, 1, 0, note);
          });
        (gameplayTimeline.queue_timeline ?? [])
          .filter((row) =>
            row.player === player
            && row.status === 'estimated_birth'
            && Number(row.queued_time) <= seconds
            && seconds < Number(row.estimated_completion_time))
          .forEach((row) => {
            const item = {
              key: Number.isInteger(row.resolved_unit_id)
                ? `unit:${row.resolved_unit_id}`
                : `unit-name:${row.name}`,
              unit_id: Number.isInteger(row.resolved_unit_id) ? row.resolved_unit_id : null,
              sourceUnitId: Number.isInteger(row.unit_id) ? row.unit_id : null,
              name: row.name,
              category: row.category,
            };
            addUnitRow(
              rowMap,
              item,
              playerUnitStats,
              0,
              1,
              'Queued count is observed queue intent gated by producer completion and sequential train time.',
            );
          });
        const rows = [...rowMap.values()]
          .filter((row) => row.produced > 0 || row.queued > 0)
          .map((row) => {
            const sources = [...row.sourceCounts.entries()]
              .sort((a, b) => a[0].localeCompare(b[0]))
              .map(([name, count]) => `${name}: ${count}`)
              .join(', ');
            const queueSourceIds = [...row.queueSourceIds].sort((a, b) => a - b).join(', ');
            return {
              ...row,
              title: [
                sources ? `Estimated production source IDs before current line resolution: ${sources}.` : '',
                queueSourceIds ? `Active queue source unit IDs before current line resolution: ${queueSourceIds}.` : '',
                ...row.notes,
              ].filter(Boolean).join(' '),
            };
          })
          .sort((a, b) =>
            categorySortValue(a.category) - categorySortValue(b.category)
              || a.name.localeCompare(b.name)
              || (a.unit_id ?? 0) - (b.unit_id ?? 0)
              || a.itemKey.localeCompare(b.itemKey));
        const cancelled = (gameplayTimeline.queue_timeline ?? [])
          .filter((row) => row.player === player && row.status === 'cancelled' && Number(row.cancellation_time) <= seconds)
          .length;
        return {
          rows,
          queueEstimateNote: cancelled
            ? `${cancelled} observed unqueue cancellation(s) have removed queue estimates.`
            : 'Queued values are observed intent estimates; produced values are estimated births, not confirmed spawns.',
        };
      }

      function unitSummaryForPlayer(player, seconds, statSnapshot, playerUnitStats) {
        const gameplayRows = gameplayUnitRowsForPlayer(player, seconds, playerUnitStats);
        if (gameplayRows) return gameplayRows;
        const rowMap = new Map();
        economy.unit_completions
          .filter((event) => event.player === player && event.time <= seconds)
          .forEach((event) => {
            const item = resolveUnitLineIdentity(event, statSnapshot, playerUnitStats);
            addUnitRow(rowMap, item, playerUnitStats, event.count, 0, 'Built count is the existing production-intent estimate.');
          });

        const queueState = activeQueueRows(player, seconds, statSnapshot, playerUnitStats);
        queueState.entries.forEach((entry) => {
          addUnitRow(
            rowMap,
            entry.item,
            playerUnitStats,
            0,
            entry.remaining,
            'Queued count is evidence-based and reduced by estimated completions and observed unqueue commands.',
          );
        });

        const rows = [...rowMap.values()]
          .filter((row) => row.produced > 0 || row.queued > 0)
          .map((row) => {
            const sources = [...row.sourceCounts.entries()]
              .sort((a, b) => a[0].localeCompare(b[0]))
              .map(([name, count]) => `${name}: ${count}`)
              .join(', ');
            const queueSourceIds = [...row.queueSourceIds].sort((a, b) => a - b).join(', ');
            return {
              ...row,
              title: [
                sources ? `Production source IDs before current line resolution: ${sources}.` : '',
                queueSourceIds ? `Active queue source unit IDs before current line resolution: ${queueSourceIds}.` : '',
                ...row.notes,
              ].filter(Boolean).join(' '),
            };
          })
          .sort((a, b) =>
            categorySortValue(a.category) - categorySortValue(b.category)
              || a.name.localeCompare(b.name)
              || (a.unit_id ?? 0) - (b.unit_id ?? 0)
              || a.itemKey.localeCompare(b.itemKey));

        return {
          rows,
          queueEstimateNote: queueState.conservativeUnqueueDeductions
            ? `${queueState.conservativeUnqueueDeductions} unidentified unqueue event(s) conservatively deducted from queued estimates.`
            : 'Queued values are evidence estimates.',
        };
      }

      return {
        queueEvents,
        unqueueEvents,
        unitSummaryForPlayer,
      };
    }

    function renderTimeline(game, lifetimes, economy, resourceEstimates, unitStats, gameplayTimeline, updateGameplay) {
      const duration = Number(game.summary.duration_seconds);
      const chatPlayers = new Map(game.match.players.map((player) => [player.number, player]));
      const chatRows = game.match.chat
        .map((message) => ({ ...message, time: timestampSeconds(message.timestamp) }))
        .sort((a, b) => a.time - b.time);
      let previousTimelineSeconds = 0;

      function showCrossedChatMessages(fromSeconds, toSeconds) {
        chatRows
          .filter((message) => message.time > fromSeconds && message.time <= toSeconds)
          .forEach((message) => {
            const player = chatPlayers.get(message.player);
            const item = document.createElement('div');
            const speaker = document.createElement('strong');
            item.className = 'map-chat-message';
            item.style.setProperty('--player-color', player?.color.toLowerCase() ?? '#aaa');
            item.title = `${message.origination}; audience: ${message.audience}`;
            speaker.className = 'map-chat-speaker';
            speaker.textContent = `${player?.name ?? `Player ${message.player}`}: `;
            item.append(speaker, message.message);
            item.addEventListener('animationend', () => item.remove(), { once: true });
            mapChatOverlay.append(item);
            while (mapChatOverlay.children.length > 6) mapChatOverlay.firstElementChild?.remove();
          });
      }
      const uptimeRows = game.match.uptimes.map((row) => ({ ...row, seconds: timestampSeconds(row.timestamp) }));
      const estimatePlayers = resourceEstimates?.players ?? {};
      const unitStatPlayers = unitStats?.schema === 'aoe2-unit-stats/v1' ? (unitStats.players ?? {}) : {};
      const productionTracker = createProductionTracker(game, economy, gameplayTimeline);
      const unitStatsCaveat = unitStats?.caveats?.[0]
        ?? 'Unit stats are unavailable for this replay; counts still show production intent, queue intent, and current map-position estimates.';
      const gameplayUnits = gameplayTimeline?.schema === 'aoe-sim.dataview-gameplay-timeline/v1'
        ? (gameplayTimeline.units ?? [])
        : [];
      const observationNote = resourceEstimates?.methodology?.observation_semantics?.limitation ?? 'Resource composition is inferred.';
      const resourceOrder = ['Food', 'Wood', 'Gold', 'Stone'];
      const workerResourceAssignmentKeys = Object.freeze({
        food: 'Food',
        wood: 'Wood',
        gold: 'Gold',
        stone: 'Stone',
      });
      const startingVillagersByPlayer = new Map(game.match.players.map((player) => [
        player.number,
        lifetimes.objects.filter((object) =>
          object.owner === player.number && object.initial === true && object.name === 'Villager'
        ).length,
      ]));

      function emptyMappedWorkerCounts() {
        return {
          Food: 0,
          Wood: 0,
          Gold: 0,
          Stone: 0,
          Other: 0,
        };
      }

      function compactCountSummary(values) {
        const counts = new Map();
        values.filter(Boolean).forEach((value) => {
          counts.set(value, (counts.get(value) ?? 0) + 1);
        });
        return [...counts.entries()]
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([value, count]) => `${value}:${count}`)
          .join(',');
      }

      function currentMappedWorkerSummaryForPlayer(assignments) {
        const counts = emptyMappedWorkerCounts();
        const mappedWorkers = assignments.filter((assignment) =>
          assignment.mapRendered && assignment.worker);
        mappedWorkers.forEach((assignment) => {
          const resource = workerResourceAssignmentKeys[assignment.villagerTaskAssignment];
          counts[resource ?? 'Other'] += 1;
        });
        const resourceTotal = resourceOrder.reduce((sum, resource) => sum + counts[resource], 0);
        return {
          counts,
          resourceTotal,
          total: mappedWorkers.length,
          other: counts.Other,
          equationMatchesTotal: resourceTotal + counts.Other === mappedWorkers.length,
          taskAssignments: compactCountSummary(mappedWorkers.map((assignment) =>
            assignment.villagerTaskAssignment ?? 'unresolved')),
        };
      }

      function mappedWorkerEquation(summary) {
        return `${resourceOrder.map((resource) =>
          `${resource} ${summary.counts[resource]}`).join(' + ')} + Other ${summary.other} = Total ${summary.total}`;
      }

      function mappedWorkerTitle(summary, availableVillagers, startingVillagers, trainedVillagers) {
        return [
          `Current map-position worker estimate: ${mappedWorkerEquation(summary)}.`,
          'Food, Wood, Gold, and Stone count only currently mapped Villagers whose effective assignment is exactly that resource.',
          'Other counts currently mapped Villagers assigned to build, repair, attack, generic gather, move, unresolved, or any non-resource task.',
          `Available Villager upper-bound evidence: ${availableVillagers} (${startingVillagers} starting + ${trainedVillagers} trained); this is not displayed as current field state.`,
          'Counts come from activeIndividualUnitAssignments(seconds) with map-rendered filtering, so sparse replay positions can be incomplete and missing positions are position-unknown, not confirmed dead.',
          summary.taskAssignments ? `Effective worker assignments: ${summary.taskAssignments}.` : '',
        ].filter(Boolean).join(' ');
      }

      function applyMappedWorkerDatasets(element, summary, availableVillagers, startingVillagers, trainedVillagers) {
        element.dataset.mappedWorkerTotal = String(summary.total);
        resourceOrder.forEach((resource) => {
          element.dataset[`mappedWorker${resource}`] = String(summary.counts[resource]);
        });
        element.dataset.mappedWorkerOther = String(summary.other);
        element.dataset.mappedWorkerResourceTotal = String(summary.resourceTotal);
        element.dataset.mappedWorkerEquationParity = String(summary.equationMatchesTotal);
        element.dataset.availableWorkerUpperBound = String(availableVillagers);
        element.dataset.availableStartingVillagers = String(startingVillagers);
        element.dataset.availableTrainedVillagers = String(trainedVillagers);
        element.dataset.mappedWorkerAssignments = summary.taskAssignments;
      }

      function addVisibleUnitLine(rowMap, item, values = {}) {
        const row = rowMap.get(item.itemKey ?? item.key) ?? {
          itemKey: item.itemKey ?? item.key,
          unit_id: item.unit_id,
          name: item.name,
          category: item.category,
          produced: 0,
          queued: 0,
          currentMapEstimate: 0,
          starting: 0,
          titleParts: [],
          startingSourceCounts: new Map(),
          currentMapEvidenceCounts: new Map(),
          currentMapMemberIds: new Set(),
          currentMapEvidenceParts: [],
        };
        row.produced += values.produced ?? 0;
        row.queued += values.queued ?? 0;
        row.currentMapEstimate += values.currentMapEstimate ?? 0;
        row.starting += values.starting ?? 0;
        if (values.title) row.titleParts.push(values.title);
        if (values.startingSource) {
          row.startingSourceCounts.set(
            values.startingSource,
            (row.startingSourceCounts.get(values.startingSource) ?? 0) + (values.starting ?? 0),
          );
        }
        values.currentMapEvidenceCounts?.forEach((count, quality) => {
          row.currentMapEvidenceCounts.set(
            quality,
            (row.currentMapEvidenceCounts.get(quality) ?? 0) + count,
          );
        });
        (values.currentMapMemberIds ?? []).forEach((id) => row.currentMapMemberIds.add(id));
        if (values.currentMapEvidenceParts) row.currentMapEvidenceParts.push(...values.currentMapEvidenceParts);
        rowMap.set(row.itemKey, row);
      }

      function mapPositionEvidenceNote(rows) {
        const explicitDeletes = rows
          .filter((row) => row.kind === 'delete')
          .reduce((sum, row) => sum + Math.max(1, row.object_ids?.length ?? 0), 0);
        const possibleLosses = rows
          .filter((row) => row.kind === 'possible_loss')
          .reduce((sum, row) => sum + Math.max(1, row.object_ids?.length ?? 0), 0);
        if (!explicitDeletes && !possibleLosses) {
          return 'No explicit delete or possible-loss rows have elapsed for this player; current map-position counts still require active unexpired position evidence.';
        }
        return `${explicitDeletes} explicit delete object(s) and ${possibleLosses} possible-loss object(s) have elapsed for this player. The current map-position estimate follows active individual timeline markers; stale or absent positions are treated as position-unknown, not confirmed dead.`;
      }

      function representedStartingUnits(player, playerUnitStats) {
        const representedIds = new Set([
          ...(playerUnitStats?.included_unit_ids ?? []),
          ...(playerUnitStats?.queued_unit_ids ?? []),
        ]);
        const rows = new Map();
        (player.objects ?? [])
          .filter((object) =>
            object.name
            && object.class_id === 70
            && Number.isInteger(object.object_id)
            && (representedIds.has(object.object_id) || unitNameMatches(object.name, /\bvillager\b/)))
          .forEach((object) => {
            const key = `${object.object_id}:${object.name}`;
            const row = rows.get(key) ?? {
              unit_id: object.object_id,
              name: object.name,
              count: 0,
            };
            row.count += 1;
            rows.set(key, row);
          });
        return [...rows.values()];
      }

      function incrementCount(counts, key, amount = 1) {
        counts.set(key, (counts.get(key) ?? 0) + amount);
      }

      function evidenceCountText(counts) {
        const labels = {
          direct: 'direct',
          'production-inferred': 'production-inferred',
          'sprite-category': 'sprite/category fallback',
          observed: 'observed',
          simulated: 'simulated',
          reconciled: 'reconciled',
          anonymous: 'anonymous',
          ambiguous: 'ambiguous',
          unclassified: 'unclassified',
        };
        const parts = ['observed', 'reconciled', 'simulated', 'anonymous', 'ambiguous', 'direct', 'production-inferred', 'sprite-category', 'unclassified']
          .map((quality) => [quality, counts.get(quality) ?? 0])
          .filter(([, count]) => count > 0)
          .map(([quality, count]) => `${labels[quality]} ${count}`);
        return parts.length ? parts.join(', ') : 'none';
      }

      function evidenceCountDataText(counts) {
        return ['observed', 'reconciled', 'simulated', 'anonymous', 'ambiguous', 'direct', 'production-inferred', 'sprite-category', 'unclassified']
          .map((quality) => `${quality}:${counts.get(quality) ?? 0}`)
          .join(',');
      }

      function activeMappedAssignmentsByPlayer(assignments) {
        const byPlayer = new Map();
        assignments.forEach((assignment) => {
          const rows = byPlayer.get(assignment.player) ?? [];
          rows.push(assignment);
          byPlayer.set(assignment.player, rows);
        });
        return byPlayer;
      }

      function gameplayUnitPoint(value) {
        const x = Number(value?.x);
        const y = Number(value?.y);
        return Number.isFinite(x) && Number.isFinite(y) ? { x, y } : null;
      }

      function sidePanelUnitPositionInventory(player, seconds, producedTotal, queuedTotal, currentMapTotal) {
        const sidePanelAggregate = producedTotal + queuedTotal;
        if (!gameplayUnits.length) {
          return {
            sidePanelAggregate,
            mapVisiblePositioned: currentMapTotal,
            sideMinusMap: sidePanelAggregate - currentMapTotal,
            positionKnown: 0,
            positionUnknown: 0,
            queuedOnly: queuedTotal,
            unresolvedActor: 0,
            lifecycleFiltered: 0,
          };
        }
        const playerUnits = gameplayUnits.filter((unit) => unit.player === player);
        const activeUnits = playerUnits.filter((unit) => {
          const birthTime = Number(unit.birth_time);
          const visibleUntil = Number(unit.visible_until ?? Infinity);
          return Number.isFinite(birthTime) && birthTime <= seconds && seconds <= visibleUntil;
        });
        const activePositionKnown = activeUnits.filter((unit) => gameplayUnitPoint(unit.birth_position)).length;
        const activePositionUnknown = activeUnits.length - activePositionKnown;
        const lifecycleFiltered = playerUnits.filter((unit) => {
          const birthTime = Number(unit.birth_time);
          const visibleUntil = Number(unit.visible_until ?? Infinity);
          return Number.isFinite(birthTime) && birthTime <= seconds && seconds > visibleUntil;
        }).length;
        const queuedOnly = (gameplayTimeline?.queue_timeline ?? [])
          .filter((row) =>
            row.player === player
            && row.status === 'estimated_birth'
            && Number(row.queued_time) <= seconds
            && seconds < Number(row.estimated_completion_time))
          .length;
        const unresolvedActor = (gameplayTimeline?.reconciliation?.unmatched_observed_actors ?? [])
          .filter((row) => row.player === player && Number(row.first_observed_time) <= seconds)
          .length;
        return {
          sidePanelAggregate,
          mapVisiblePositioned: currentMapTotal,
          sideMinusMap: sidePanelAggregate - currentMapTotal,
          positionKnown: Math.max(0, activePositionKnown - currentMapTotal),
          positionUnknown: activePositionUnknown,
          queuedOnly,
          unresolvedActor,
          lifecycleFiltered,
        };
      }

      function applyUnitPositionInventoryDatasets(element, inventory) {
        element.dataset.sidePanelAggregateUnits = String(inventory.sidePanelAggregate);
        element.dataset.sidePanelMapVisiblePositionedUnits = String(inventory.mapVisiblePositioned);
        element.dataset.sidePanelMapUnitDelta = String(inventory.sideMinusMap);
        element.dataset.sidePanelRemainderPositionKnown = String(inventory.positionKnown);
        element.dataset.sidePanelRemainderPositionUnknown = String(inventory.positionUnknown);
        element.dataset.sidePanelRemainderQueuedOnly = String(inventory.queuedOnly);
        element.dataset.sidePanelRemainderUnresolvedActor = String(inventory.unresolvedActor);
        element.dataset.sidePanelRemainderLifecycleFiltered = String(inventory.lifecycleFiltered);
        element.dataset.sidePanelRemainderClassification = unitRemainderClassificationText(inventory);
      }

      function currentMapIdentityItem(assignment, statSnapshot, playerUnitStats) {
        const identity = assignment.unitIdentity ?? {};
        const unitId = numericId(identity.unit_id ?? identity.unitId);
        const name = String(identity.name ?? assignment.referenceUnitName ?? '').trim();
        if (assignment.worker) {
          const villagerRecord = Object.values(playerUnitStats?.units ?? {})
            .find((unit) => unit.name === 'Villager');
          const villagerUnitId = unitId ?? numericId(villagerRecord?.unit_id);
          return resolveUnitLineIdentity({
            unit_id: villagerUnitId ?? undefined,
            unitId: villagerUnitId ?? undefined,
            object_id: villagerUnitId ?? undefined,
            name: name || 'Villager',
          }, statSnapshot, playerUnitStats);
        }
        if ((['direct', 'production-inferred', 'observed', 'simulated', 'reconciled', 'anonymous', 'ambiguous'].includes(identity.quality))
          && (unitId !== null || name)) {
          return resolveUnitLineIdentity({
            unit_id: unitId ?? undefined,
            unitId: unitId ?? undefined,
            object_id: unitId ?? undefined,
            name,
          }, statSnapshot, playerUnitStats);
        }
        const spriteKey = canonicalMapSpriteKey(assignment.spriteKey) ?? 'unknown';
        const definition = mapSpriteDefinitionForKey(spriteKey);
        const category = unitCategoryForMapSpriteKey(spriteKey, assignment.category);
        return {
          key: `map-sprite:${spriteKey}:${category ?? 'unknown'}`,
          unit_id: null,
          sourceUnitId: null,
          name: `Estimated ${definition?.label ?? 'mapped unit'}`,
          category,
        };
      }

      function currentMapUnitSummaryForPlayer(assignments, statSnapshot, playerUnitStats) {
        const rows = new Map();
        const diagnostics = {
          activeAssignments: assignments.length,
          mapRenderedCategorized: 0,
          mapRenderedWorkers: 0,
          evidenceCounts: new Map(),
        };
        assignments.forEach((assignment) => {
          const quality = assignment.evidenceQuality ?? 'unclassified';
          incrementCount(diagnostics.evidenceCounts, quality);
          if (!assignment.mapRendered) return;
          diagnostics.mapRenderedCategorized += 1;
          if (assignment.worker) diagnostics.mapRenderedWorkers += 1;
          const item = currentMapIdentityItem(assignment, statSnapshot, playerUnitStats);
          const row = rows.get(item.key) ?? {
            ...item,
            itemKey: item.key,
            currentMapEstimate: 0,
            currentMapEvidenceCounts: new Map(),
            currentMapMemberIds: new Set(),
            currentMapEvidenceParts: [],
          };
          row.currentMapEstimate += 1;
          incrementCount(row.currentMapEvidenceCounts, quality);
          row.currentMapMemberIds.add(assignment.instanceId);
          row.currentMapEvidenceParts.push([
            `id${assignment.instanceId}`,
            assignment.unitIdentity?.quality ?? quality,
            assignment.unitIdentity?.unit_id !== null && assignment.unitIdentity?.unit_id !== undefined
              ? `source#${assignment.unitIdentity.unit_id}`
              : '',
            assignment.unitIdentity?.name ?? '',
            `sprite=${assignment.spriteKey}`,
            assignment.worker ? 'worker' : '',
            `motion=${assignment.partyKind}`,
          ].filter(Boolean).join('/'));
          rows.set(item.key, row);
        });
        return {
          rows: [...rows.values()]
            .map((row) => ({
              ...row,
              title: [
                `Current map-position evidence: ${row.currentMapEstimate} active classified individual marker(s).`,
                `Evidence split: ${evidenceCountText(row.currentMapEvidenceCounts)}.`,
                row.currentMapMemberIds.size
                  ? `Unit assignments: ${[...row.currentMapMemberIds].map(String).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).join(', ')}.`
                  : '',
              ].filter(Boolean).join(' '),
            }))
            .sort((a, b) =>
              categorySortValue(a.category) - categorySortValue(b.category)
                || a.name.localeCompare(b.name)
                || (a.unit_id ?? 0) - (b.unit_id ?? 0)
                || a.itemKey.localeCompare(b.itemKey)),
          diagnostics,
        };
      }

      function currentMapLineEvidenceText(rows) {
        return rows
          .filter((row) => row.currentMapEstimate > 0)
          .map((row) => `${row.itemKey}=${row.currentMapEstimate}(${evidenceCountDataText(row.currentMapEvidenceCounts)})[${row.currentMapEvidenceParts.join('|')}]`)
          .join(';');
      }

      timelineSlider.max = String(duration);

      function updateTimeline(seconds) {
        const bounded = Math.max(0, Math.min(duration, seconds));
        const currentMappedAssignments = typeof updateGameplay.activeIndividualUnitAssignments === 'function'
          ? updateGameplay.activeIndividualUnitAssignments(bounded)
          : typeof updateGameplay.activeMappedActorAssignments === 'function'
            ? updateGameplay.activeMappedActorAssignments(bounded)
          : [];
        const currentMappedAssignmentsByPlayer = activeMappedAssignmentsByPlayer(currentMappedAssignments);
        timelineSlider.value = String(bounded);
        timelineTime.value = `${formatDuration(bounded)} / ${formatDuration(duration)}`;
        playerStates.forEach((state) => {
          const uptime = latestAt(state.uptimes, bounded);
          const row = latestAt(state.timeseries, bounded);
          const estimate = latestAt(state.estimateSamples, bounded);
          const age = uptime?.age ?? 'DARK_AGE';
          const ageText = displayHeaderAge(age);
          const ageTitle = uptime?.age
            ? `Replay age: ${displayAge(uptime.age)}.`
            : 'No replay age sample yet; showing starting Dark Age.';
          const objectsAvailable = Number.isFinite(Number(row?.total_objects));
          const objectsText = objectsAvailable ? formatResourceValue(row.total_objects) : 'n/a';
          const objectsTitle = objectsAvailable
            ? `Replay-observed total objects: ${objectsText}.`
            : 'Replay-observed total objects unavailable at this timeline point.';
          state.age.textContent = ageText;
          state.age.title = ageTitle;
          state.age.setAttribute('aria-label', `Age: ${ageText}. ${ageTitle}`);
          state.objects.textContent = objectsText;
          state.objects.title = objectsTitle;
          state.objects.setAttribute('aria-label', `Objects: ${objectsText}. ${objectsTitle}`);

    function schemaShape(schema) {
      if (!schema || typeof schema !== 'object') return null;
      if (schema.properties) {
        return Object.fromEntries(
          Object.entries(schema.properties).map(([key, value]) => [key, schemaShape(value)])
        );
      }
      if (schema.items) return [schemaShape(schema.items)];
      if (schema.anyOf) {
        const shapes = schema.anyOf.map(schemaShape);
        return shapes.find((shape) => shape !== null) ?? null;
      }
      return null;
    }

      object.className = 'schema-object';
      heading.textContent = entry.paths.join('; ');
      object.textContent = JSON.stringify(schemaShape(schema), null, 2);
      container.append(heading, object);
      return container;
    }

      function addOverlayLegend(color, text, borderStyle = 'solid', target = mapResources.legendGroups.map) {

      function addCategoryLegend(definition) {

      const buildingIconImageCache = new Map();
      let buildingIconRenderPending = false;

      function buildingIcon(name) {

      function requestBuildingIconRender() {

          ? requestAnimationFrame
          : (callback) => setTimeout(callback, 0);
