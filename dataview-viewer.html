        return unit.birth_evidence_class ?? 'unclassified';
      }

      function unitTimelineInterpolationState(unit, seconds) {
        const birthTime = Number(unit.birth_time);
        const visibleUntil = Number(unit.visible_until ?? Infinity);
        const birthPosition = timelinePoint(unit.birth_position);
        if (!birthPosition || !Number.isFinite(birthTime) || seconds + .001 < birthTime || seconds > visibleUntil) {
          return null;
        }
        let current = birthPosition;
        let destination = birthPosition;
        let status = 'at-birth-position';
        let progress = 1;
        let segmentEvidence = unit.birth_evidence_class ?? 'simulated';
        for (const segment of unit.motion_segments ?? []) {
          const from = timelinePoint(segment.from);
          const to = timelinePoint(segment.to);
          const fromTime = Number(segment.from_time);
          const toTime = Number(segment.to_time);
          if (!from || !to || !Number.isFinite(fromTime) || !Number.isFinite(toTime)) continue;
          if (seconds < fromTime) {
            destination = to;
            status = 'waiting-for-next-command';
            progress = 0;
            break;
          }
          current = to;
          destination = to;
          status = 'updated-at-command';
          progress = 1;
          segmentEvidence = segment.interpolation_evidence_class ?? segmentEvidence;
        }
        return {
          current,
          destination,
          status,
          progress,
          segmentEvidence,
        };
      }

      function activeIndividualUnitAssignments(seconds) {
        if (!gameplayTimelineUnits.length) return activeMappedActorAssignments(seconds);
        return Object.freeze(gameplayTimelineUnits.flatMap((unit) => {
          const interpolation = unitTimelineInterpolationState(unit, seconds);
          if (!interpolation) return [];
          const spriteKey = canonicalMapSpriteKey(unit.sprite_key ?? resolveMapSpriteKey({
            name: unit.name,
            category: unit.category,
          })) ?? 'unknown';
          const category = unit.category ?? unitCategoryForMapSpriteKey(spriteKey);
          const evidenceQuality = unitTimelineEvidenceQuality(unit);
          const markerKey = String(unit.id ?? unit.stable_id);
          const mapRendered = true;
          return [Object.freeze({
            player: unit.player,
            instanceId: unit.source_actor_id ?? markerKey,
            sourceActorId: unit.source_actor_id ?? null,
            stableId: unit.stable_id ?? markerKey,
            markerKey,
            worker: Boolean(unit.worker || category === 'villagers'),
            villager: Boolean(unit.worker || category === 'villagers'),
            partyId: unit.stable_id ?? markerKey,
            partyKind: unit.birth_kind === 'queue_estimate' ? 'queue-estimate' : 'starting-actor',
            partyTime: Number(unit.birth_time),
            villagerTaskAssignment: null,
            indexedVillagerTaskAssignment: null,
            villagerTaskPhase: '',
            position: Object.freeze({
              x: interpolation.current.x,
              y: interpolation.current.y,
            }),
            commandDestination: Object.freeze({
              x: interpolation.destination.x,
              y: interpolation.destination.y,
            }),
            unitIdentity: Object.freeze({
              quality: evidenceQuality,
              unit_id: unit.resolved_unit_id ?? unit.unit_id ?? null,
              name: unit.name ?? '',
              evidence: `${unit.birth_evidence_class ?? 'simulated'}:${unit.reconciliation?.status ?? 'unresolved'}`,
            }),
            resolvedUnitId: unit.resolved_unit_id ?? unit.unit_id ?? null,
            unitName: unit.name ?? '',
            referenceUnitName: unit.name ?? '',
            spriteKey,
            spriteCategory: spriteKey
              ? mapSpriteDefinitionForKey(spriteKey)?.label ?? ''
              : '',
            category,
            evidenceQuality,
            evidence: unit.reconciliation?.evidence ?? unit.birth_confirmation ?? '',
            outcome: unit.end_reason ?? unit.reconciliation?.status ?? '',
            endTime: Number(unit.visible_until ?? Infinity),
            mapRendered,
            interpolationStatus: interpolation.status,
            interpolationProgress: interpolation.progress,
            interpolationEvidenceClass: interpolation.segmentEvidence,
            birthTime: Number(unit.birth_time),
            birthEvidenceClass: unit.birth_evidence_class,
            birthConfirmation: unit.birth_confirmation,
            producerId: unit.producer_id ?? null,
            queueId: unit.queue_id ?? null,
            reconciliationStatus: unit.reconciliation?.status ?? '',
          })];
        }));
      }

      function partyComposition(members, villagerTaskAssignment = null, villagerTaskState = null) {
        const counts = Object.fromEntries(mapSpriteDefinitions.map((definition) => [definition.key, 0]));
        const evidenceCounts = Object.fromEntries(mapSpriteDefinitions.map((definition) => [
          definition.key,
          { direct: 0, productionInferred: 0 },
        ]));
        const categoryCounts = Object.fromEntries(mapSpriteDefinitions.map((definition) => [definition.key, {}]));
        const unclassifiedMembers = [];
        members.forEach((member) => {
          const spriteKey = canonicalMapSpriteKey(member.spriteKey);
          if (spriteKey && Object.prototype.hasOwnProperty.call(counts, spriteKey)) {
            counts[spriteKey] += 1;
            if (member.categoryEvidence.includes('production evidence')) {
              evidenceCounts[spriteKey].productionInferred += 1;
            } else {
              evidenceCounts[spriteKey].direct += 1;
            }
            const category = member.category ?? 'unknown';
            categoryCounts[spriteKey][category] = (categoryCounts[spriteKey][category] ?? 0) + 1;
          } else {
            unclassifiedMembers.push(member);
          }
        });
        const entries = mapSpriteDefinitions
          .map((definition) => {
            const evidence = evidenceCounts[definition.key];
            return {
              ...definition,
              count: counts[definition.key],
              direct: evidence.direct,
              productionInferred: evidence.productionInferred,
              estimated: evidence.productionInferred > 0,
              categoryCounts: categoryCounts[definition.key],
              villagerTaskAssignment: definition.key === 'villagers' ? villagerTaskAssignment : null,
              villagerTaskState: definition.key === 'villagers' ? villagerTaskState : null,
            };
          })
          .filter((entry) => entry.count > 0);
        return {
          counts,
          evidenceCounts,
          entries,
          categorized: entries.reduce((sum, entry) => sum + entry.count, 0),
          unclassified: unclassifiedMembers.length,
          unclassifiedMembers,
          total: members.length,
        };
      }

      function partyCompositionEvidence(composition) {
        return [
          ...composition.entries.map((entry) => {
            const taskEvidence = entry.villagerTaskAssignment
              ? `,task=${entry.villagerTaskAssignment.key}`
              : '';
            const phaseEvidence = entry.villagerTaskState?.phase
              ? `,phase=${entry.villagerTaskState.phase}`
              : '';
            return `${entry.key}=${entry.estimated ? '~' : ''}${entry.count}(direct=${entry.direct},production=${entry.productionInferred},categories=${Object.entries(entry.categoryCounts).map(([category, count]) => `${category}:${count}`).join('|') || 'none'}${taskEvidence}${phaseEvidence})`;
          }),
          `unclassified=${composition.unclassified}`,
          composition.unclassifiedMembers.length
            ? `unknown_ids=${composition.unclassifiedMembers.map((member) => member.instanceId).join(',')}`
            : '',
          `total=${composition.total}`,
        ].filter(Boolean).join(':');
      }

      function countSummary(values) {
        const counts = new Map();
        values.filter(Boolean).forEach((value) => {
          counts.set(value, (counts.get(value) ?? 0) + 1);
        });
        return [...counts.entries()]
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([value, count]) => `${value}:${count}`)
          .join(',');
      }

      function mappedActorTotalsByPlayer(assignments) {
        const counts = new Map(game.match.players.map((player) => [player.number, 0]));
        assignments.forEach((assignment) => {
          counts.set(assignment.player, (counts.get(assignment.player) ?? 0) + 1);
        });
        return [...counts.entries()]
          .sort((a, b) => a[0] - b[0])
          .map(([player, count]) => `${player}:${count}`)
          .join(',');
      }

      function mappedActorEvidenceSplitText(counts) {
        return ['observed', 'reconciled', 'simulated', 'anonymous', 'ambiguous', 'direct', 'production-inferred', 'sprite-category', 'unclassified']
          .map((quality) => `${quality}:${counts.get(quality) ?? 0}`)
          .join(',');
      }

      function mappedActorEvidenceSplits(assignments) {
        const counts = new Map();
        assignments.forEach((assignment) => {
          const key = assignment.evidenceQuality ?? 'unclassified';
          counts.set(key, (counts.get(key) ?? 0) + 1);
        });
        return mappedActorEvidenceSplitText(counts);
      }

      function mappedActorEvidenceSplitsByPlayer(assignments) {
        const byPlayer = new Map(game.match.players.map((player) => [player.number, new Map()]));
        assignments.forEach((assignment) => {
          const counts = byPlayer.get(assignment.player) ?? new Map();
          const key = assignment.evidenceQuality ?? 'unclassified';
          counts.set(key, (counts.get(key) ?? 0) + 1);
          byPlayer.set(assignment.player, counts);
        });
        return [...byPlayer.entries()]
          .sort((a, b) => a[0] - b[0])
          .map(([player, counts]) => `${player}:${mappedActorEvidenceSplitText(counts)}`)
          .join(';');
      }

      function mappedActorLineEvidence(assignments) {
        return assignments
          .map((assignment) => [
            `p${assignment.player}`,
            `id${assignment.instanceId}`,
            `quality=${assignment.evidenceQuality ?? 'unclassified'}`,
            `worker=${assignment.worker ? 'true' : 'false'}`,
            `sprite=${assignment.spriteKey ?? 'unclassified'}`,
            assignment.unitIdentity?.unit_id !== null && assignment.unitIdentity?.unit_id !== undefined
              ? `unit=${assignment.unitIdentity.unit_id}`
              : '',
            assignment.unitIdentity?.name ? `name=${assignment.unitIdentity.name}` : '',
            assignment.villagerTaskAssignment ? `task=${assignment.villagerTaskAssignment}` : '',
            assignment.villagerTaskPhase ? `phase=${assignment.villagerTaskPhase}` : '',
          ].filter(Boolean).join('/'))
          .join(';');
      }

      function formatMapPosition(position, digits = 2) {
        if (!position) return 'n/a';
        return `${Number(position.x).toFixed(digits)},${Number(position.y).toFixed(digits)}`;
      }

      function partyStripInterpolationState(party, seconds) {
        const profile = party.movementProfile;
        const destination = profile?.destination ?? party.position;
        const fallback = (status, reason) => ({
          source: profile?.source ?? null,
          current: destination,
          destination,
          distance: profile?.distance ?? 0,
          slowestSpeed: profile?.slowestSpeed ?? null,
          progress: 1,
          travelTime: profile?.travelTime ?? null,
          status,
          fallbackReason: reason,
          speedEvidence: profile?.speedEvidence ?? [],
          visibleMemberCount: profile?.visibleMemberCount ?? party.members.length,
          speedMemberCount: profile?.speedMemberCount ?? 0,
        });
        if (!profile) return fallback('fallback:no-profile', 'no interpolation profile; strip stays at destination');
        if (profile.status !== 'interpolated') return fallback(profile.status, profile.fallbackReason);
        const elapsed = Math.max(0, seconds - profile.time);
        const progress = Math.max(0, Math.min(1, elapsed * profile.slowestSpeed / profile.distance));
        const current = {
          x: profile.source.x + (profile.destination.x - profile.source.x) * progress,
          y: profile.source.y + (profile.destination.y - profile.source.y) * progress,
        };
        return {
          source: profile.source,
          current,
          destination: profile.destination,
          distance: profile.distance,
          slowestSpeed: profile.slowestSpeed,
          progress,
          travelTime: profile.travelTime,
          status: progress >= 1 ? 'arrived' : progress <= 0 ? 'pending' : 'moving',
          fallbackReason: '',
          speedEvidence: profile.speedEvidence,
          visibleMemberCount: profile.visibleMemberCount,
          speedMemberCount: profile.speedMemberCount,
        };
      }

      function partyStripInterpolationTitle(state) {
        if (state.fallbackReason) return `Strip anchor fallback: ${state.fallbackReason}.`;
        return `Strip anchor: straight command-segment interpolation from sparse command evidence, ${Math.round(state.progress * 100)}% at ${formatStatNumber(state.slowestSpeed)} tiles/s.`;
      }

      function partyStripInterpolationEvidence(party, state, taskState = null) {
        const task = taskState?.effectiveAssignment
          ? `/${taskState.effectiveAssignment.key}`
          : (party.villagerTaskAssignment ? `/${party.villagerTaskAssignment.key}` : '');
        return [
          `${party.kind}${task}:p${party.player}:id${party.id}:members=${party.members.length}`,
          taskState?.indexedAssignment && taskState.indexedAssignment !== taskState.effectiveAssignment
            ? `indexedTask=${taskState.indexedAssignment.key}`
            : '',
          taskState?.phase ? `phase=${taskState.phase}` : '',
          `t=${party.latestTime.toFixed(3)}`,
          `src=${formatMapPosition(state.source)}`,
          `cur=${formatMapPosition(state.current)}`,
          `dst=${formatMapPosition(state.destination)}`,
          `dist=${formatStatNumber(state.distance)}`,
          `speed=${state.slowestSpeed === null ? 'n/a' : formatStatNumber(state.slowestSpeed)}`,
          `progress=${state.progress.toFixed(3)}`,
          `travel=${state.travelTime === null ? 'n/a' : formatStatNumber(state.travelTime)}`,
          `status=${state.status}`,
          state.fallbackReason ? `fallback=${state.fallbackReason}` : '',
          state.speedEvidence.length ? `speeds=${state.speedEvidence.join('|')}` : '',
        ].filter(Boolean).join(',');
      }

      const partySpriteNodes = new Map();
      let partySpriteNodesCreated = 0;
      let partySpriteSrcAssignments = 0;

      function partyStripLayout(anchorX, anchorY, composition, align = 'center') {
        const iconSize = 16;
        const gap = 1;
        const paddingX = 1;
        const height = 21;
        const fontSize = 9;
        const badgeFontSize = 8;
        const spriteCellSize = 18;
        const entryWidth = spriteCellSize;
        const width = paddingX * 2 + composition.entries.length * entryWidth
          + gap * Math.max(0, composition.entries.length - 1);
        const left = align === 'after' ? anchorX : anchorX - width / 2;
        const top = anchorY - height / 2;
        return { iconSize, gap, paddingX, height, fontSize, badgeFontSize, spriteCellSize, entryWidth, width, left, top };
      }

      function villagerWorkAnimationForAssignment(villagerTaskAssignment) {
        const assignmentKey = villagerTaskAssignment?.key;
        return Object.prototype.hasOwnProperty.call(villagerWorkAnimationDefinitions, assignmentKey)
          ? villagerWorkAnimationDefinitions[assignmentKey]
          : null;
      }

      function partySpriteAssetRecord(kind, spriteKey, villagerTaskAssignment = null) {
        const key = canonicalMapSpriteKey(spriteKey);
        if (!key) return null;
        if (key === 'villagers') {
          if (kind === 'attack') {
            const asset = partySpriteAssets.attack.villagers ?? null;
            return asset ? { key: 'attack:villagers', src: asset } : null;
          }
          const workAnimation = villagerWorkAnimationForAssignment(villagerTaskAssignment);
          if (workAnimation?.asset) return { key: `villagers:${workAnimation.key}`, src: workAnimation.asset };
        }
        const asset = partySpriteAssets[kind]?.[key] ?? partySpriteAssets.attack[key] ?? null;
        return asset ? { key: `${kind}:${key}`, src: asset } : null;
      }

      function teamSpriteFilter(teamColor) {
        const normalized = String(teamColor ?? '').toLowerCase().trim();
        if (normalized === 'blue') {
          return 'grayscale(1) sepia(1) saturate(8.5) hue-rotate(168deg) brightness(.92) contrast(1.24)';
        }
        if (normalized === 'orange') {
          return 'grayscale(1) sepia(1) saturate(8) hue-rotate(338deg) brightness(1.1) contrast(1.18)';
        }
        return 'grayscale(1) sepia(1) saturate(1.45) hue-rotate(0deg) brightness(1.04) contrast(1.08)';
      }

      function setDatasetValue(element, key, value) {
        if (value === null || value === undefined || value === '') {
          delete element.dataset[key];
          return;
        }
        element.dataset[key] = String(value);
      }

      function applyVillagerTaskStateDatasets(element, taskState) {
        const estimate = taskState?.estimate ?? null;
        setDatasetValue(element, 'indexedVillagerTaskAssignment', taskState?.indexedAssignment?.key ?? '');
        setDatasetValue(element, 'indexedVillagerTaskLabel', taskState?.indexedAssignment?.label ?? '');
        setDatasetValue(element, 'villagerTaskAssignment', taskState?.effectiveAssignment?.key ?? '');
        setDatasetValue(element, 'villagerTaskLabel', taskState?.effectiveAssignment?.label ?? '');
        setDatasetValue(element, 'villagerTaskPhase', taskState?.phase ?? '');
        setDatasetValue(element, 'villagerWorkAnimation', taskState?.workAnimation?.key ?? '');
        setDatasetValue(element, 'villagerWorkAnimationLabel', taskState?.workAnimation?.label ?? '');
        setDatasetValue(element, 'buildingTarget', estimate?.targetName ?? '');
        setDatasetValue(element, 'estimatedBuildArrival', Number.isFinite(estimate?.estimatedArrivalTime)
          ? estimate.estimatedArrivalTime.toFixed(3)
          : '');
        setDatasetValue(element, 'estimatedBuildCompletion', Number.isFinite(estimate?.estimatedCompletionTime)
          ? estimate.estimatedCompletionTime.toFixed(3)
          : '');
        setDatasetValue(element, 'builderCount', estimate?.builderCount ?? '');
        setDatasetValue(element, 'baseBuildSeconds', Number.isFinite(estimate?.baseBuildSeconds)
          ? formatStatNumber(estimate.baseBuildSeconds)
          : '');
        setDatasetValue(element, 'estimatedConstructionSeconds', Number.isFinite(estimate?.constructionSeconds)
          ? formatStatNumber(estimate.constructionSeconds)
          : '');
        setDatasetValue(element, 'buildArrivalStatus', estimate?.arrivalStatus ?? '');
        setDatasetValue(element, 'buildArrivalEvidence', estimate?.arrivalEvidence ?? '');
        setDatasetValue(element, 'postBuildResourceAssignment', estimate?.postBuildAssignment?.key ?? '');
        setDatasetValue(element, 'postBuildResourceStatus', estimate?.postBuildResourceStatus ?? '');
        setDatasetValue(element, 'postBuildResourceFamily', estimate?.postBuildResourceFamily ?? '');
        setDatasetValue(element, 'postBuildResourceEvidence', estimate?.postBuildResourceEvidence ?? '');
      }

      function villagerAnimationTitle(entry, kind) {
        if (entry.key !== 'villagers') return '';
        if (kind === 'attack') return 'Villager animation: fighting';
        const workAnimation = entry.villagerTaskState?.workAnimation
          ?? villagerWorkAnimationForAssignment(entry.villagerTaskAssignment);
        if (workAnimation) return `Villager animation: ${workAnimation.label}`;
        return 'Villager animation: generic';
      }

      function partySpriteEntryTitle(entry, kind) {
        const categorySummary = Object.entries(entry.categoryCounts)
          .map(([category, count]) => `${category}: ${count}`)
          .join(', ');
        return [
          `${entry.label}: ${entry.count}`,
          villagerAnimationTitle(entry, kind),
          entry.villagerTaskAssignment ? `Villager assignment: ${entry.villagerTaskAssignment.label}` : '',
          entry.villagerTaskState?.phase ? `Task phase: ${entry.villagerTaskState.phase}` : '',
          entry.villagerTaskState ? buildTransitionEvidenceTitle(entry.villagerTaskState) : '',
          `${entry.direct} direct`,
          `${entry.productionInferred} production-inferred`,
          categorySummary ? `broad categories: ${categorySummary}` : '',
        ].filter(Boolean).join(' | ');
      }

      function createPartySpriteImageElement(party, entry) {
        const record = partySpriteAssetRecord(party.kind, entry.key, entry.villagerTaskAssignment);
        if (!record) {
          const marker = generatedMarker(
            'party-sprite-image',
            mapSpriteSymbols.get(entry.key) ?? entry.key,
            entry.label,
          );
          marker.setAttribute('aria-hidden', 'true');
          return marker;
        }
        const image = document.createElement('img');
        image.className = 'party-sprite-image';
        image.alt = '';
        image.decoding = 'async';
        image.loading = 'eager';
        image.dataset.generatedMapSprite = 'true';
        image.dataset.spriteAsset = record.key;
        image.dataset.spriteAssetSourceCommit = mapSpriteAssetSource.commit;
        image.dataset.spriteAssetSourcePath = mapSpriteAssetSource.path;
        image.dataset.spriteAssetSourcePack = mapSpriteAssetSource.pack;
        image.dataset.spriteAssetSourcePatchSha256 = mapSpriteAssetSource.absorbedPatchSha256;
        image.dataset.spriteAssetSourceNote = mapSpriteAssetSource.note;
        image.src = record.src;
        partySpriteSrcAssignments += 1;
        return image;
      }

      function createPartySpriteItem(party, entry) {
        const item = document.createElement('span');
        item.className = 'party-sprite-item';
        item.dataset.spriteKey = entry.key;
        item.dataset.count = String(entry.count);
        item.title = partySpriteEntryTitle(entry, party.kind);
        const image = createPartySpriteImageElement(party, entry);
        image.setAttribute('aria-hidden', 'true');
        const count = document.createElement('span');
        count.className = 'party-sprite-count';
        item.append(image, count);
        applyPartySpriteImageAsset(item, image, party, entry);
        return item;
      }

      function applyPartySpriteImageAsset(item, image, party, entry) {
        const record = partySpriteAssetRecord(party.kind, entry.key, entry.villagerTaskAssignment);
        const spriteAsset = record?.src ?? null;
        let spriteImage = image;
        const workAnimation = entry.key === 'villagers' && party.kind !== 'attack'
          ? (entry.villagerTaskState?.workAnimation
            ?? villagerWorkAnimationForAssignment(entry.villagerTaskAssignment))
          : null;
        if (record && spriteImage.tagName !== 'IMG') {
          const replacement = createPartySpriteImageElement(party, entry);
          spriteImage.replaceWith(replacement);
          spriteImage = replacement;
        } else if (!record && spriteImage.tagName === 'IMG') {
          const replacement = generatedMarker(
            'party-sprite-image',
            mapSpriteSymbols.get(entry.key) ?? entry.key,
            entry.label,
          );
          replacement.setAttribute('aria-hidden', 'true');
          spriteImage.replaceWith(replacement);
          spriteImage = replacement;
        } else if (record && spriteImage.dataset.spriteAsset !== record.key) {
          spriteImage.src = spriteAsset;
          partySpriteSrcAssignments += 1;
        } else if (!record && spriteImage.dataset.spriteAsset) {
          spriteImage.removeAttribute('src');
        }
        item.dataset.spriteAsset = record?.key ?? '';
        item.dataset.spriteAssetSourceCommit = record ? mapSpriteAssetSource.commit : '';
        item.dataset.spriteAssetSourcePath = record ? mapSpriteAssetSource.path : '';
        item.dataset.spriteAssetSourcePack = record ? mapSpriteAssetSource.pack : '';
        item.dataset.spriteAssetSourcePatchSha256 = record ? mapSpriteAssetSource.absorbedPatchSha256 : '';
        item.dataset.spriteAssetSourceNote = record ? mapSpriteAssetSource.note : '';
        spriteImage.dataset.spriteAsset = record?.key ?? '';
        spriteImage.dataset.generatedMapSprite = record ? 'true' : '';
        spriteImage.dataset.spriteAssetSourceCommit = record ? mapSpriteAssetSource.commit : '';
        spriteImage.dataset.spriteAssetSourcePath = record ? mapSpriteAssetSource.path : '';
        spriteImage.dataset.spriteAssetSourcePack = record ? mapSpriteAssetSource.pack : '';
        spriteImage.dataset.spriteAssetSourcePatchSha256 = record ? mapSpriteAssetSource.absorbedPatchSha256 : '';
        spriteImage.dataset.spriteAssetSourceNote = record ? mapSpriteAssetSource.note : '';
        if (entry.key === 'villagers') {
          applyVillagerTaskStateDatasets(item, entry.villagerTaskState ?? {
            indexedAssignment: entry.villagerTaskAssignment,
            effectiveAssignment: entry.villagerTaskAssignment,
            phase: '',
            estimate: null,
            workAnimation,
          });
          applyVillagerTaskStateDatasets(spriteImage, entry.villagerTaskState ?? {
            indexedAssignment: entry.villagerTaskAssignment,
            effectiveAssignment: entry.villagerTaskAssignment,
            phase: '',
            estimate: null,
            workAnimation,
          });
        }
        return spriteImage;
      }

      function movementPartyKey(party) {
        const parts = [
          party.kind,
          party.player,
          `party=${party.id}`,
        ];
        if (party.villagerTaskAssignment) parts.push(`task=${party.villagerTaskAssignment.key}`);
        return parts.join(':');
      }

      function createPartySpriteNode(party, composition, teamColor, layout, key) {
        const strip = document.createElement('div');
        strip.className = 'party-sprite-strip';
        strip.dataset.key = key;
        strip.dataset.teamColor = teamColor;
        strip.style.setProperty('--player-color', teamColor);
        strip.style.setProperty('--team-sprite-filter', teamSpriteFilter(teamColor));
        composition.entries.forEach((entry) => {
          strip.append(createPartySpriteItem(party, entry));
        });
        spriteOverlay.append(strip);
        partySpriteNodes.set(key, strip);
        partySpriteNodesCreated += 1;
        return strip;
      }

      function spriteOverlayScale() {
        const bounds = {
          width: spriteOverlay.clientWidth || spriteOverlay.offsetWidth || spriteOverlay.getBoundingClientRect().width,
          height: spriteOverlay.clientHeight || spriteOverlay.offsetHeight || spriteOverlay.getBoundingClientRect().height,
        };
        return {
          x: bounds.width / Math.max(1, gameplayCanvas.width),
          y: bounds.height / Math.max(1, gameplayCanvas.height),
        };
      }

      const individualUnitMarkerNodes = new Map();
      let individualUnitMarkerNodesCreated = 0;

      function individualUnitMarkerAssetRecord(assignment) {
        const spriteKey = canonicalMapSpriteKey(assignment.spriteKey) ?? 'unknown';
        if (spriteKey === 'villagers' && assignment.partyKind !== 'attack') {
          const task = villagerTaskDefinitions[assignment.villagerTaskAssignment] ?? null;
          const workAnimation = villagerWorkAnimationForAssignment(task);
          if (workAnimation?.asset) return { key: `villagers:${workAnimation.key}`, src: workAnimation.asset };
        }
        const kind = assignment.partyKind === 'attack' ? 'attack' : 'move';
        const asset = partySpriteAssets[kind]?.[spriteKey]
          ?? partySpriteAssets.move[spriteKey]
          ?? partySpriteAssets.attack[spriteKey]
          ?? null;
        return asset ? { key: `${kind}:${spriteKey}`, src: asset } : null;
      }

      function setGeneratedMapSpriteDatasets(element, record) {
        element.dataset.generatedMapSprite = record ? 'true' : '';
        element.dataset.spriteAsset = record?.key ?? '';
        element.dataset.spriteAssetSourceCommit = record ? mapSpriteAssetSource.commit : '';
        element.dataset.spriteAssetSourcePath = record ? mapSpriteAssetSource.path : '';
        element.dataset.spriteAssetSourcePack = record ? mapSpriteAssetSource.pack : '';
        element.dataset.spriteAssetSourcePatchSha256 = record ? mapSpriteAssetSource.absorbedPatchSha256 : '';
        element.dataset.spriteAssetSourceNote = record ? mapSpriteAssetSource.note : '';
      }

      function unitMarkerTitle(assignment) {
        const stackCount = Number(assignment.stackCount ?? 1);
        const stackTitle = stackCount > 1
          ? `Stack: ${stackCount} same-category ${assignment.spriteCategory || assignment.category || 'unit'} markers at this position; members ${assignment.stackMemberIds.join(', ')}; evidence ${assignment.stackEvidenceSplit}.`
          : '';
        return [
          `Player ${assignment.player} ${assignment.unitName || 'unit'} ${assignment.instanceId}.`,
          stackTitle,
          `Evidence: ${assignment.evidenceQuality}; reconciliation: ${assignment.reconciliationStatus || 'none'}.`,
          `Birth: ${formatDuration(assignment.birthTime)} (${assignment.birthConfirmation}).`,
          assignment.producerId === null ? '' : `Producer: ${assignment.producerId}.`,
          `Position: ${formatMapPosition(assignment.position)}; destination: ${formatMapPosition(assignment.commandDestination)}.`,
          `Position update: ${assignment.interpolationStatus}, ${Math.round((assignment.interpolationProgress ?? 1) * 100)}%, ${assignment.interpolationEvidenceClass}; terrain avoidance false.`,
          'Static DOM marker; no animated GIF/WebP bytes or animated sprite frames.',
        ].filter(Boolean).join(' ');
      }

      function createIndividualUnitMarker(assignment) {
        const marker = document.createElement('span');
        marker.className = 'unit-marker';
        marker.dataset.markerKey = assignment.markerKey;
        marker.setAttribute('aria-hidden', 'true');
        const image = document.createElement('img');
        image.className = 'unit-marker-image';
        image.alt = '';
        image.decoding = 'async';
        image.loading = 'eager';
        image.setAttribute('aria-hidden', 'true');
        image.addEventListener('load', () => {
          marker.dataset.spriteLoadState = 'loaded';
        });
        image.addEventListener('error', () => {
          marker.dataset.spriteLoadState = 'error';
        });
        const fallback = generatedMarker(
          'unit-marker-fallback',
          mapSpriteSymbols.get(assignment.spriteKey) ?? assignment.unitName ?? '?',
          '',
        );
        fallback.setAttribute('aria-hidden', 'true');
        const count = document.createElement('span');
        count.className = 'unit-marker-count';
        count.setAttribute('aria-hidden', 'true');
        marker.append(image, fallback, count);
        spriteOverlay.append(marker);
        individualUnitMarkerNodes.set(assignment.markerKey, marker);
        individualUnitMarkerNodesCreated += 1;
        return marker;
      }

      function updateIndividualUnitMarker(marker, assignment, scale) {
        const uniformScale = Math.min(scale.x, scale.y) || 1;
        const teamColor = playerColors.get(assignment.player) ?? '#888';
        marker.style.left = `${assignment.position.x * cellSize * scale.x}px`;
        marker.style.top = `${assignment.position.y * cellSize * scale.y}px`;
        marker.style.setProperty('--player-color', teamColor);
        marker.style.setProperty('--team-sprite-filter', teamSpriteFilter(teamColor));
        marker.style.setProperty('--unit-marker-size', `${Math.max(12, 18 * uniformScale)}px`);
        marker.style.setProperty('--unit-marker-font-size', `${Math.max(6, 8 * uniformScale)}px`);
        marker.dataset.player = String(assignment.player);
        marker.dataset.unitName = assignment.unitName ?? '';
        marker.dataset.instanceId = String(assignment.instanceId);
        marker.dataset.sourceActorId = assignment.sourceActorId === null ? '' : String(assignment.sourceActorId);
        marker.dataset.stableId = assignment.stableId;
        marker.dataset.spriteKey = assignment.spriteKey ?? '';
        marker.dataset.category = assignment.category ?? '';
        marker.dataset.evidenceClass = assignment.evidenceQuality ?? 'unclassified';
        marker.dataset.reconciliationStatus = assignment.reconciliationStatus ?? '';
        marker.dataset.birthTime = formatStatNumber(assignment.birthTime, 3);
        marker.dataset.birthEvidenceClass = assignment.birthEvidenceClass ?? '';
        marker.dataset.producerId = assignment.producerId === null ? '' : String(assignment.producerId);
        marker.dataset.queueId = assignment.queueId ?? '';
        marker.dataset.position = formatMapPosition(assignment.position);
        marker.dataset.commandDestination = formatMapPosition(assignment.commandDestination);
        marker.dataset.commandInterpolationStatus = assignment.interpolationStatus;
        marker.dataset.commandInterpolationProgress = formatStatNumber(assignment.interpolationProgress ?? 1, 3);
        marker.dataset.commandInterpolationEvidenceClass = assignment.interpolationEvidenceClass;
        marker.dataset.commandPositionUpdateStatus = assignment.interpolationStatus;
        marker.dataset.commandPositionUpdateProgress = formatStatNumber(assignment.interpolationProgress ?? 1, 3);
        marker.dataset.commandPositionUpdateEvidenceClass = assignment.interpolationEvidenceClass;
        marker.dataset.terrainAvoidance = 'false';
        marker.dataset.staticMapMarker = 'true';
        marker.dataset.animatedSpriteFrames = 'false';
        marker.dataset.stackCount = String(assignment.stackCount ?? 1);
        marker.dataset.stackMemberIds = assignment.stackMemberIds.join(',');
        marker.dataset.stackMemberKeys = assignment.stackMemberKeys.join(',');
        marker.dataset.stackEvidenceSplit = assignment.stackEvidenceSplit;
        const stackCountText = String(assignment.stackCount ?? 1);
        marker.style.setProperty('--unit-marker-count-digits', String(stackCountText.length));
        marker.style.setProperty('--unit-marker-count-font-size', `${Math.max(7, 9 * uniformScale)}px`);
        const record = individualUnitMarkerAssetRecord(assignment);
        const image = marker.querySelector('.unit-marker-image');
        const fallback = marker.querySelector('.unit-marker-fallback');
        const count = marker.querySelector('.unit-marker-count');
        if (fallback) fallback.textContent = (mapSpriteSymbols.get(assignment.spriteKey) ?? assignment.unitName ?? '?').slice(0, 3);
        if (count) count.textContent = (assignment.stackCount ?? 1) > 1 ? stackCountText : '';
        setGeneratedMapSpriteDatasets(marker, record);
        if (image) {
          const previousAsset = image.dataset.spriteAsset;
          setGeneratedMapSpriteDatasets(image, record);
          if (record && previousAsset !== record.key) {
            marker.dataset.spriteLoadState = 'pending';
            image.src = record.src;
          } else if (record && image.complete && image.naturalWidth > 0) {
            marker.dataset.spriteLoadState = 'loaded';
          } else if (!record) {
            marker.dataset.spriteLoadState = 'error';
            image.removeAttribute('src');
          }
        } else {
          marker.dataset.spriteLoadState = record ? 'loaded' : 'error';
        }
        marker.title = unitMarkerTitle(assignment);
      }

      function individualUnitStackPositionKey(position) {
        return `${Number(position.x).toFixed(2)}:${Number(position.y).toFixed(2)}`;
      }

      function individualUnitMarkerIdentityKey(assignment) {
        return String(
          assignment.markerKey
            ?? assignment.stableId
            ?? `${assignment.player}:${assignment.instanceId}:${assignment.partyId ?? ''}`,
        );
      }

      function individualUnitStackSort(left, right) {
        return individualUnitMarkerIdentityKey(left).localeCompare(individualUnitMarkerIdentityKey(right))
          || String(left.stableId).localeCompare(String(right.stableId))
          || String(left.instanceId).localeCompare(String(right.instanceId));
      }

      function individualUnitStackGroups(assignments) {
        const groups = new Map();
        assignments.filter((assignment) => assignment.mapRendered).forEach((assignment) => {
          const spriteKey = canonicalMapSpriteKey(assignment.spriteKey) ?? 'unknown';
          const category = assignment.category ?? unitCategoryForMapSpriteKey(spriteKey) ?? 'unknown';
          const key = [
            assignment.player,
            category,
            spriteKey,
            assignment.villagerTaskAssignment ?? '',
            individualUnitStackPositionKey(assignment.position),
          ].join(':');
          const group = groups.get(key) ?? [];
          group.push(assignment);
          groups.set(key, group);
        });
        return [...groups.values()].map((group) => {
          const members = [...group].sort(individualUnitStackSort);
          const representative = members[0];
          const stackMemberKeys = members.map(individualUnitMarkerIdentityKey);
          const stackMemberIds = members.map((member) => String(member.instanceId));
          const evidenceCounts = new Map();
          members.forEach((member) => {
            const evidence = member.evidenceQuality ?? 'unclassified';
            evidenceCounts.set(evidence, (evidenceCounts.get(evidence) ?? 0) + 1);
          });
          return Object.freeze({
            ...representative,
            markerKey: members.length === 1 ? individualUnitMarkerIdentityKey(representative) : `stack:${stackMemberKeys.join('|')}`,
            stackCount: members.length,
            stackMemberKeys,
            stackMemberIds,
            stackEvidenceSplit: [...evidenceCounts.entries()]
              .sort((a, b) => a[0].localeCompare(b[0]))
              .map(([evidence, count]) => `${evidence}:${count}`)
              .join(','),
          });
        });
      }

      function renderIndividualUnitMarkers(assignments) {
        const renderedAssignments = assignments.filter((assignment) => assignment.mapRendered);
        const markerAssignments = individualUnitStackGroups(renderedAssignments);
        const visibleKeys = new Set();
        const scale = spriteOverlayScale();
        let reusedNodes = 0;
        markerAssignments.forEach((assignment) => {
          visibleKeys.add(assignment.markerKey);
          const existing = individualUnitMarkerNodes.get(assignment.markerKey);
          const marker = existing ?? createIndividualUnitMarker(assignment);
          if (existing) reusedNodes += 1;
          updateIndividualUnitMarker(marker, assignment, scale);
        });
        individualUnitMarkerNodes.forEach((marker, key) => {
          if (visibleKeys.has(key)) return;
          marker.remove();
          individualUnitMarkerNodes.delete(key);
        });
        gameplayCanvas.dataset.individualUnitMarkersActive = String(individualUnitMarkerNodes.size);
        gameplayCanvas.dataset.individualUnitMarkersCreated = String(individualUnitMarkerNodesCreated);
        gameplayCanvas.dataset.individualUnitMarkersReusedThisRender = String(reusedNodes);
        gameplayCanvas.dataset.individualUnitMarkerKeys = [...visibleKeys].sort().join(',');
        gameplayCanvas.dataset.individualUnitMarkerUnitsRepresented = String(renderedAssignments.length);
        gameplayCanvas.dataset.individualUnitMarkerStacks = String(
          markerAssignments.filter((assignment) => (assignment.stackCount ?? 1) > 1).length,
        );
        gameplayCanvas.dataset.individualUnitMarkerStackedUnits = String(
          markerAssignments.reduce((sum, assignment) => sum + Math.max(0, (assignment.stackCount ?? 1) - 1), 0),
        );
        gameplayCanvas.dataset.individualUnitMarkerStackEvidence = markerAssignments
          .filter((assignment) => (assignment.stackCount ?? 1) > 1)
          .map((assignment) => `${assignment.markerKey}:${assignment.stackCount}:${assignment.stackMemberIds.join('|')}`)
          .join(';');
        gameplayCanvas.dataset.partySpriteNodesActive = '0';
        gameplayCanvas.dataset.partySpriteNodesCreated = '0';
        gameplayCanvas.dataset.partySpriteNodesReusedThisRender = '0';
        gameplayCanvas.dataset.partySpriteSrcAssignments = '0';
        return renderedAssignments
          .map((assignment) => ({
            assignment,
            interpolation: {
              status: assignment.interpolationStatus,
              progress: assignment.interpolationProgress,
              evidenceClass: assignment.interpolationEvidenceClass,
              current: assignment.position,
              destination: assignment.commandDestination,
            },
          }));
      }

      function updatePartySpriteNode(strip, party, composition, teamColor, layout, interpolation, taskState) {
        const scale = spriteOverlayScale();
        const uniformScale = Math.min(scale.x, scale.y) || 1;
        strip.style.left = `${layout.left * scale.x}px`;
        strip.style.top = `${layout.top * scale.y}px`;
        strip.style.width = `${layout.width * scale.x}px`;
        strip.style.height = `${layout.height * scale.y}px`;
        strip.style.setProperty('--player-color', teamColor);
        strip.style.setProperty('--team-sprite-filter', teamSpriteFilter(teamColor));
        strip.style.setProperty('--strip-gap', `${layout.gap * uniformScale}px`);
        strip.style.setProperty('--strip-padding-x', `${layout.paddingX * uniformScale}px`);
        strip.style.setProperty('--strip-height', `${layout.height * uniformScale}px`);
        strip.style.setProperty('--strip-font-size', `${layout.fontSize * uniformScale}px`);
        strip.style.setProperty('--badge-font-size', `${layout.badgeFontSize * uniformScale}px`);
        strip.style.setProperty('--sprite-cell-size', `${layout.spriteCellSize * uniformScale}px`);
        strip.style.setProperty('--party-entry-width', `${layout.entryWidth * uniformScale}px`);
        strip.style.setProperty('--sprite-size', `${layout.iconSize * uniformScale}px`);
        strip.dataset.kind = party.kind;
        strip.dataset.player = String(party.player);
        strip.dataset.teamColor = teamColor;
        strip.dataset.latestTime = party.latestTime.toFixed(3);
        strip.dataset.position = `${party.position.x.toFixed(2)},${party.position.y.toFixed(2)}`;
        strip.dataset.commandSource = formatMapPosition(interpolation.source);
        strip.dataset.commandCurrent = formatMapPosition(interpolation.current);
        strip.dataset.commandDestination = formatMapPosition(interpolation.destination);
        strip.dataset.commandSegmentDistance = formatStatNumber(interpolation.distance);
        strip.dataset.commandSlowestSpeed = interpolation.slowestSpeed === null
          ? ''
          : formatStatNumber(interpolation.slowestSpeed);
        strip.dataset.commandProgress = interpolation.progress.toFixed(3);
        strip.dataset.commandTravelTime = interpolation.travelTime === null
          ? ''
          : formatStatNumber(interpolation.travelTime);
        strip.dataset.commandInterpolationStatus = interpolation.status;
        strip.dataset.commandInterpolationFallback = interpolation.fallbackReason;
        strip.dataset.commandSpeedMembers = `${interpolation.speedMemberCount}/${interpolation.visibleMemberCount}`;
        strip.dataset.commandSpeedEvidence = interpolation.speedEvidence.join('|');
        applyVillagerTaskStateDatasets(strip, taskState);
        strip.dataset.composition = partyCompositionEvidence(composition);
        const taskTitle = taskState?.effectiveAssignment
          ? ` Active Villager assignment: ${taskState.effectiveAssignment.label}; indexed command assignment: ${taskState.indexedAssignment?.label ?? 'none'}; Villager animation: ${taskState.workAnimation?.label ?? 'generic'}.`
          : '';
        const buildTitle = taskState ? buildTransitionEvidenceTitle(taskState) : '';
        strip.title = `Player ${party.player} ${teamColor} ${party.kind} party: ${composition.entries.map((entry) => partySpriteEntryTitle(entry, party.kind)).join('; ')}.${taskTitle} ${buildTitle} Unclassified selected actors: ${composition.unclassified}. ${partyStripInterpolationTitle(interpolation)}`;
        strip.setAttribute('aria-label', strip.title);
        const activeEntryKeys = new Set(composition.entries.map((entry) => entry.key));
        strip.querySelectorAll('.party-sprite-item').forEach((item) => {
          if (!activeEntryKeys.has(item.dataset.spriteKey)) item.remove();
        });
        composition.entries.forEach((entry) => {
          let item = strip.querySelector(`[data-sprite-key="${entry.key}"]`);
          if (!item) {
            item = createPartySpriteItem(party, entry);
            strip.append(item);
          }
          item.dataset.count = String(entry.count);
          item.title = partySpriteEntryTitle(entry, party.kind);
          item.setAttribute('aria-label', item.title);
          const image = item.querySelector('.party-sprite-image');
          if (image) applyPartySpriteImageAsset(item, image, party, entry);
          const count = item.querySelector('.party-sprite-count');
          count.textContent = String(entry.count);
          count.dataset.estimated = String(entry.estimated);
        });
      }

      function renderPartySpriteStrips() {
        partySpriteNodes.forEach((strip, key) => {
          strip.remove();
          partySpriteNodes.delete(key);
        });
        gameplayCanvas.dataset.partySpriteNodesActive = '0';
        gameplayCanvas.dataset.partySpriteNodesCreated = String(partySpriteNodesCreated);
        gameplayCanvas.dataset.partySpriteNodesReusedThisRender = '0';
        gameplayCanvas.dataset.partySpriteSrcAssignments = String(partySpriteSrcAssignments);
        return [];
      }

      function drawMovementParty(party) {
        const x = party.position.x * cellSize;
        const y = party.position.y * cellSize;
        if (party.kind === 'attack') {
          const teamColor = playerColors.get(party.player) ?? '#888';
          context.save();
          context.globalAlpha = .95;
          context.lineCap = 'round';
          [[4, '#111'], [2.2, teamColor]].forEach(([width, color]) => {
            context.strokeStyle = color;
            context.lineWidth = width;
            context.beginPath();
            context.moveTo(x - 5, y - 5);
            context.lineTo(x + 5, y + 5);
            context.moveTo(x + 5, y - 5);
            context.lineTo(x - 5, y + 5);
            context.stroke();
          });
          context.restore();
        }
      }

      function update(seconds) {
        context.clearRect(0, 0, gameplayCanvas.width, gameplayCanvas.height);
        resourceContext.clearRect(0, 0, resourceCanvas.width, resourceCanvas.height);
        buildingContext.clearRect(0, 0, buildingCanvas.width, buildingCanvas.height);

        const depletionRows = depletions.slice(0, upperBound(depletions, seconds));
        const depletedIds = new Set(depletionRows.map((row) => row.resource_id));
        const activeConstructionClearances = constructionClearances.slice(0, upperBound(constructionClearances, seconds));
        const constructionDepletedIds = new Set(activeConstructionClearances.flatMap((row) => row.resourceIds));
        const activeConstructionDepletionPositions = [...new Map(
          activeConstructionClearances.flatMap((row) => row.depletionPositions)
            .map((position) => [`${position.x.toFixed(3)}:${position.y.toFixed(3)}`, position]),
        ).values()];
        const estimatedDepletedNodes = estimateNodes.filter((node) =>
          node.depleted_time !== null && Number(node.depleted_time) <= seconds,
        );
        const finalAllocationRows = finalCapacityAllocations.slice(0, upperBound(finalCapacityAllocations, seconds));
        const estimatedDepletedIds = new Set(estimatedDepletedNodes.map((node) => node.instance_id));
        const treeResources = [];
        const nonTreeResources = [];
        mapResources.resources.forEach((resource) => {
          (isMapTreeResource(resource) ? treeResources : nonTreeResources).push(resource);
        });
        let visibleTrees = 0;
        let depletedTrees = 0;
        let treeResourceDrawPixels = 0;
        let visibleAnimals = 0;
        let consumedAnimals = 0;
        let visibleGaiaFood = 0;
        let consumedGaiaFood = 0;
        treeResources.forEach((resource) => {
          const currentPosition = resourcePositionAt(resource, seconds);
          const centerX = currentPosition.x * cellSize;
          const centerY = currentPosition.y * cellSize;
          const depleted = depletedIds.has(resource.instance_id) || estimatedDepletedIds.has(resource.instance_id)
            || constructionDepletedIds.has(resource.instance_id);
          const style = mapResources.treeResourceStyles.get(resource.name)
            ?? { color: '#1f6f3a', shadow: '#123c25' };
          const size = Math.max(4, Math.round(cellSize * .72));
          const innerSize = Math.max(2, size - 2);
          const left = Math.round(centerX - size / 2);
          const top = Math.round(centerY - size / 2);
          resourceContext.globalAlpha = depleted ? .22 : .94;
          resourceContext.fillStyle = style.shadow;
          resourceContext.fillRect(left, top, size, size);
          resourceContext.fillStyle = style.color;
          resourceContext.fillRect(left + 1, top + 1, innerSize, innerSize);
          resourceContext.fillStyle = depleted ? '#3a3121' : '#6d5532';
          resourceContext.fillRect(Math.round(centerX), Math.round(centerY), 1, Math.max(1, Math.round(size / 2)));
          resourceContext.globalAlpha = 1;
          treeResourceDrawPixels += (size * size) + (innerSize * innerSize);
          if (depleted) depletedTrees += 1;
          else visibleTrees += 1;
        });
        nonTreeResources.forEach((resource) => {
          const currentPosition = resourcePositionAt(resource, seconds);
          const centerX = currentPosition.x * cellSize;
          const centerY = currentPosition.y * cellSize;
          const animalStyle = mapResources.animalStyles.get(resource.name);
          if (animalStyle) {
            const isAnimal = mapResources.animalNames.has(resource.name);
            const window = animalGatherWindows.get(resource.instance_id);
            if ((window && seconds >= window.end) || estimatedDepletedIds.has(resource.instance_id)
              || constructionDepletedIds.has(resource.instance_id)) {
              consumedGaiaFood += 1;
              if (isAnimal) consumedAnimals += 1;
              return;
            }
            visibleGaiaFood += 1;
            if (isAnimal) visibleAnimals += 1;
            resourceContext.globalAlpha = window && seconds >= window.start
              ? Math.max(0, 1 - (seconds - window.start) / 300)
              : 1;
            resourceContext.beginPath();
            resourceContext.arc(centerX, centerY, 3.5, 0, Math.PI * 2);
            resourceContext.fillStyle = animalStyle.color;
            resourceContext.fill();
            resourceContext.strokeStyle = animalStyle.color === '#111' ? '#fff' : '#111';
            resourceContext.lineWidth = 1;
            resourceContext.stroke();
            resourceContext.globalAlpha = 1;
            return;
          }
          const style = mapResources.resourceStyles.get(resource.name);
          resourceContext.globalAlpha = depletedIds.has(resource.instance_id) || estimatedDepletedIds.has(resource.instance_id)
            || constructionDepletedIds.has(resource.instance_id) ? .25 : 1;
          resourceContext.beginPath();
          resourceContext.arc(centerX, centerY, 2.4, 0, Math.PI * 2);
          resourceContext.fillStyle = style.color;
          resourceContext.fill();
          resourceContext.lineWidth = 1;
          resourceContext.strokeStyle = '#111';
          resourceContext.stroke();
        });
        estimatedDepletedNodes.forEach((node) => {
          if (!node.position || depletedIds.has(node.instance_id)) return;
          const x = node.position.x * cellSize;
          const y = node.position.y * cellSize;
          resourceContext.strokeStyle = '#111';
          resourceContext.lineWidth = 2;
          resourceContext.setLineDash([2, 2]);
          resourceContext.beginPath();
          resourceContext.moveTo(x - 4, y - 4);
          resourceContext.lineTo(x + 4, y + 4);
          resourceContext.moveTo(x + 4, y - 4);
          resourceContext.lineTo(x - 4, y + 4);
          resourceContext.stroke();
          resourceContext.setLineDash([]);
        });
        resourceContext.globalAlpha = 1;
        depletionRows.forEach((row) => {
          const x = row.position.x * cellSize;
          const y = row.position.y * cellSize;
          resourceContext.strokeStyle = '#111';
          resourceContext.lineWidth = 2;
          resourceContext.setLineDash([2, 2]);
          resourceContext.beginPath();
          resourceContext.moveTo(x - 4, y - 4);
          resourceContext.lineTo(x + 4, y + 4);
          resourceContext.moveTo(x + 4, y - 4);
          resourceContext.lineTo(x - 4, y + 4);
          resourceContext.stroke();
          resourceContext.setLineDash([]);

        });
        activeConstructionDepletionPositions.forEach((position) => {
          const x = position.x * cellSize;
          const y = position.y * cellSize;
          resourceContext.strokeStyle = '#111';
          resourceContext.lineWidth = 2;
          resourceContext.setLineDash([2, 2]);
          resourceContext.beginPath();
          resourceContext.moveTo(x - 4, y - 4);
          resourceContext.lineTo(x + 4, y + 4);
          resourceContext.moveTo(x + 4, y - 4);
          resourceContext.lineTo(x - 4, y + 4);
          resourceContext.stroke();
          resourceContext.setLineDash([]);
        });

        const snapshotIndex = Math.max(0, upperBound(buildingSnapshots, seconds) - 1);
        const buildingState = buildingSnapshots[snapshotIndex];
        let estimatedInactiveFarms = 0;
        let estimatedInferredReseeds = 0;
        buildingIconRenderStats = { visibleMapped: 0, loadedVisibleMapped: 0, missingVisibleMapped: 0 };
        const rangeBuildings = buildingState.buildings.filter((row) => buildingAttackRange(buildingName(row)) > 0);
        rangeBuildings.forEach(drawBuildingRange);
        buildingState.buildings.forEach((row) => {
          const farmStatus = farmEstimateStatus(row, seconds);
          if (farmStatus && !farmStatus.active) estimatedInactiveFarms += 1;
          if (farmStatus?.inferred) estimatedInferredReseeds += 1;
          drawBuilding(row, seconds);
        });

        const visibleViewlocks = currentViewlocks(seconds);
        visibleViewlocks.forEach(drawViewlock);

        lifetimes.players.forEach((player) => {
          const x = player.start_position.x * cellSize;
          const y = player.start_position.y * cellSize;
          context.strokeStyle = playerColors.get(player.number) ?? '#fff';
          context.lineWidth = 2;
          context.beginPath();
          context.arc(x, y, 7, 0, Math.PI * 2);
          context.stroke();
        });

        const recentEnd = upperBound(nonGatherMapEvents, seconds);
        const recentStart = upperBound(nonGatherMapEvents, Math.max(0, seconds - maxCommandTravelLifetime));
        const recentRows = nonGatherMapEvents
          .slice(recentStart, recentEnd)
          .filter((row) => seconds - row.time < (row.commandDisplayLifetime ?? 60));
        const arrowEnd = upperBound(commandArrows, seconds);
        const arrowStart = upperBound(commandArrows, Math.max(0, seconds - maxCommandTravelLifetime));
        const visibleCommandArrows = commandArrows
          .slice(arrowStart, arrowEnd)
          .filter((row) => seconds - row.time < row.lifetime);
        const gatherEnd = upperBound(gatherEvents, seconds);
        const gatherStart = upperBound(gatherEvents, Math.max(0, seconds - 1200));
        const visibleGatherByDestination = new Map();
        gatherEvents.slice(gatherStart, gatherEnd).forEach((row) => {
          if (seconds - row.time > (row.commandDisplayLifetime ?? gatherEventLifetime(row))) return;
          if (clearedByBuilding(row, seconds)) return;
          const key = row.target_id ?? `${row.player}:${row.position.x.toFixed(2)}:${row.position.y.toFixed(2)}`;
          visibleGatherByDestination.set(key, row);

    function renderMap(map, gaia) {
      const cellSize = 6;
      const dimension = map.dimension;
      const context = mapCanvas.getContext('2d');
      const terrainIds = [...new Set(map.tiles.map((tile) => tile.terrain))].sort((a, b) => a - b);
      const terrainTypes = new Map([
        [3, { name: 'Dirt 3', role: 'starting areas', color: '#d7b56d' }],
        [11, { name: 'Dirt 2', role: 'walkable land', color: '#b98b58' }],
        [14, { name: 'Desert sand', role: 'walkable land', color: '#e3c27a' }],
        [48, { name: 'Dragon tree forest', role: 'trees', color: '#1d5a36' }],
        [89, { name: 'Bush forest', role: 'trees', color: '#5f8543' }],
        [112, { name: 'Palm grass forest', role: 'trees', color: '#327844' }],
      ]);
      const terrainType = (id) => terrainTypes.get(id) ?? { name: `Unknown terrain ${id}`, role: 'unknown', color: '#888' };

      const resourceStyles = new Map([
        ['Gold Mine', { label: 'Gold mine', color: '#ffd700' }],
        ['Stone Mine', { label: 'Stone mine', color: '#d8d8d8' }],
      ]);
      const treeResourceStyles = new Map([
        ['Tree (Palm Forest)', { label: 'Palm forest tree', color: '#1f6f3a', shadow: '#123c25' }],
        ['Tree (Dragon)', { label: 'Dragon tree', color: '#2a6748', shadow: '#15392d' }],
        ['Palm Forest', { label: 'Palm forest tree', color: '#1f6f3a', shadow: '#123c25' }],
        ['Dragon Tree', { label: 'Dragon tree', color: '#2a6748', shadow: '#15392d' }],
        ['Bush B', { label: 'Bush forest wood', color: '#5d843b', shadow: '#2c3f21' }],
      ]);
      const treeResourceNames = new Set(treeResourceStyles.keys());
      const animalStyles = new Map([
        ['Sheep', { category: 'controllable', color: '#fff' }],
        ['Wild Boar', { category: 'non-controllable', color: '#6b3f22' }],
        ['Ibex', { category: 'non-controllable', color: '#6b3f22' }],
        ['Forage Bush', { category: 'non-controllable', color: '#6b3f22' }],
        ['Fruit Bush', { category: 'non-controllable', color: '#6b3f22' }],
      ]);
      const animalNames = new Set(['Sheep', 'Wild Boar', 'Ibex']);
      const isTreeResource = (object) => {
        const name = String(object?.name ?? '');
        return name.startsWith('Tree (') || treeResourceNames.has(name);
      };
      const resources = gaia.filter((object) =>
        resourceStyles.has(object.name) || animalStyles.has(object.name) || isTreeResource(object));

      mapCanvas.width = dimension * cellSize;
      mapCanvas.height = dimension * cellSize;
      mapCanvas.dataset.tiles = map.tiles.length;
      context.imageSmoothingEnabled = false;

      map.tiles.forEach((tile) => {
        const left = tile.position.x * cellSize;
        const top = tile.position.y * cellSize;
        context.fillStyle = terrainType(tile.terrain).color;
        context.fillRect(left, top, cellSize, cellSize);
        if (tile.elevation > 0) {
          const strength = Math.min(.42, tile.elevation * .18);
          context.fillStyle = `rgba(255, 255, 255, ${strength})`;
          context.fillRect(left, top, cellSize, cellSize);
          context.fillStyle = 'rgba(255, 255, 255, .28)';
          context.fillRect(left, top, cellSize, 1);
          context.fillStyle = 'rgba(0, 0, 0, .18)';
          context.fillRect(left, top + cellSize - 1, cellSize, 1);
        }
      });

      context.strokeStyle = 'rgba(0, 0, 0, .25)';
      context.lineWidth = 1;
      for (let point = 0; point <= dimension; point += 10) {
        const offset = point * cellSize + .5;
        context.beginPath();
        context.moveTo(offset, 0);
        context.lineTo(offset, mapCanvas.height);

        context.beginPath();
        context.moveTo(0, offset);

    function setViewerNotice(text, state = 'ready') {
      viewerNotice.textContent = text;
      viewerNotice.hidden = !text;
      viewerNotice.dataset.state = state;
      viewerNotice.setAttribute('role', state === 'error' ? 'alert' : 'status');
    }

    function parseViewerHandshake() {
      const params = new URLSearchParams(location.hash.slice(1));
      const requestId = params.get('requestId') ?? '';
      const nonce = params.get('nonce') ?? '';
      if (!isViewerHandshakeToken(requestId) || !isViewerHandshakeToken(nonce)) return null;
      return { requestId, nonce };
    }

    function isViewerHandshakeToken(value) {
      return /^[A-Za-z0-9._:-]{1,240}$/.test(value);
    }

    function postViewerReady() {
      if (!viewerHandshake) {
        setViewerNotice('Viewer handshake is missing or malformed.', 'error');
        return;
      }
      window.parent.postMessage({
        type: viewerReadyType,
        requestId: viewerHandshake.requestId,
        nonce: viewerHandshake.nonce,
      }, window.location.origin);
    }

    function handleShellScrollState(event) {
      const message = event.data;
      if (
        event.origin !== window.location.origin ||
        event.source !== window.parent ||
        !viewerHandshake ||
        !message ||
        message.type !== viewerShellScrollStateType ||
        message.requestId !== viewerHandshake.requestId ||
        message.nonce !== viewerHandshake.nonce ||
        !Number.isFinite(message.scrollTop) ||
        !Number.isFinite(message.scrollMax)
      ) {
        return false;
      }
      shellScrollTop = Math.max(0, message.scrollTop);
      shellScrollMax = Math.max(0, message.scrollMax);
      if (Number.isFinite(message.shellControlsHeight)) {
        setShellControlsHeight(message.shellControlsHeight);
      }
      return true;
    }

    function relayBoundaryWheel(event) {
      if (event.ctrlKey || !viewerHandshake || event.deltaY === 0) return;
      const fromDetailColumn = event.target instanceof Node && detailColumn.contains(event.target);
      if (!fromDetailColumn) return;
      const detailScrollTop = detailColumn.scrollTop;
      const detailScrollMax = Math.max(0, detailColumn.scrollHeight - detailColumn.clientHeight);
      const detailAtBottom = detailScrollTop >= detailScrollMax - 0.5;
      const scrollingShellDown = event.deltaY > 0 && detailAtBottom && shellScrollTop < shellScrollMax - 0.5;
      const scrollingShellUp = event.deltaY < 0 && shellScrollTop > 0.5;
      if (!scrollingShellDown && !scrollingShellUp) return;
      event.preventDefault();
      window.parent.postMessage({
        type: viewerShellScrollRequestType,
        requestId: viewerHandshake.requestId,
        nonce: viewerHandshake.nonce,
        deltaY: event.deltaY,
      }, window.location.origin);
    }

    function validateViewerPayload(payload, event) {
      if (event.origin !== window.location.origin || event.source !== window.parent) {
        return null;
      }
      if (!viewerHandshake) {
        throw new Error('Viewer handshake is missing or malformed.');
      }
      if (!payload || payload.type !== viewerPayloadType) {
        throw new Error('Viewer payload type is invalid.');
      }
      if (payload.requestId !== viewerHandshake.requestId || payload.viewerNonce !== viewerHandshake.nonce) {
        throw new Error('Viewer payload does not match this viewer request.');
      }
      if (!Array.isArray(payload.outputs)) {
        throw new Error('Viewer payload outputs must be an array.');
      }
      const allowedNames = new Set(viewerOutputNames);
      const outputNames = new Set();
      let totalBytes = 0;
      payload.outputs.forEach((entry) => {
        if (!entry || !allowedNames.has(entry.name)) {
          throw new Error('Viewer payload contains an unexpected output name.');
        }
        if (outputNames.has(entry.name)) {
          throw new Error(`Viewer payload contains duplicate ${entry.name}.`);
        }
        if (!(entry.buffer instanceof ArrayBuffer)) {
          throw new Error(`${entry.name} is missing its transferred ArrayBuffer.`);
        }
        if (!Number.isSafeInteger(entry.sizeBytes) || entry.sizeBytes < 0 || entry.sizeBytes > maxViewerJsonBytes) {
          throw new Error(`${entry.name} has an invalid byte size.`);
        }
        if (entry.sizeBytes !== entry.buffer.byteLength) {
          throw new Error(`${entry.name} byte size does not match its buffer.`);
        }
        if (!/^[a-f0-9]{64}$/.test(String(entry.sha256 ?? ''))) {
          throw new Error(`${entry.name} is missing a SHA-256 digest.`);
        }
        totalBytes += entry.sizeBytes;
        outputNames.add(entry.name);
      });
      viewerRequiredOutputNames.forEach((name) => {
        if (!outputNames.has(name)) throw new Error(`Viewer payload is missing ${name}.`);
      });
      if (totalBytes > maxViewerTotalJsonBytes) {
        throw new Error('Viewer payload is larger than the standalone dataview limit.');
      }
      return payload;
    }

    function parseOutput(output) {
      const text = new TextDecoder('utf-8', { fatal: true }).decode(output.buffer);
      const escapePattern = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const viewerUrl = new URL(location.href);
      const slash = viewerUrl.pathname.slice(0, 1);
      const colon = viewerUrl.protocol.slice(-1);
      const localHomePattern = slash + ['home', 'carlos'].join(slash);
      const localTempPattern = slash + 'tmp';
      const fileUrlPattern = ['file', colon, slash, slash].join('');
      const urlAuthorityPattern = colon + slash + slash;
      const forbidden = [
        new RegExp(escapePattern(localHomePattern)),
        new RegExp(`${escapePattern(localTempPattern)}(?:/|\\b)`),
        /\/work(?:\/|\b)/,
        new RegExp(escapePattern(fileUrlPattern)),
        /[A-Za-z]:\\/,
        new RegExp(`${escapePattern(urlAuthorityPattern)}[^\\s/:@]+:[^\\s/@]+@`),
      ];
      const match = forbidden.find((pattern) => pattern.test(text));
      if (match) throw new Error(`${output.name} contains a forbidden local path or credential pattern.`);
      return JSON.parse(text);
    }

    function outputMap(payload) {
      return new Map(payload.outputs.map((entry) => [entry.name, entry]));
    }

    function renderPayload(payload) {
      const byName = outputMap(payload);
      const game = parseOutput(byName.get('game.json'));
      const lifetimes = parseOutput(byName.get('lifetimes.json'));
      const economy = parseOutput(byName.get('economy.json'));
      const resourceEstimates = parseOutput(byName.get('resource_estimates.json'));
      const unitStatsOutput = byName.get('unit_stats.json');
      const gameplayTimelineOutput = byName.get('gameplay_timeline.json');
      const unitStats = unitStatsOutput ? parseOutput(unitStatsOutput) : null;
      const gameplayTimeline = gameplayTimelineOutput ? parseOutput(gameplayTimelineOutput) : null;
      const estimates = resourceEstimates?.schema === 'aoe2-resource-reconstruction/v1'
        ? resourceEstimates
        : null;
      const stats = unitStats?.schema === 'aoe2-unit-stats/v1'
        ? unitStats
        : null;
      const gameplay = gameplayTimeline?.schema === 'aoe-sim.dataview-gameplay-timeline/v1'
        ? gameplayTimeline
        : null;
      const mapResources = renderMap(game.match.map, game.match.gaia);
      const updateGameplay = renderGameplay(game, lifetimes, economy, mapResources, estimates, stats, gameplay);
      renderTimeline(game, lifetimes, economy, estimates, stats, gameplay, updateGameplay);
      document.title = `${game.summary.map.name}: ${game.summary.players.map((player) => player.name).join(' vs ')}`;
      setViewerNotice('');
    }

    function handleViewerMessage(event) {
      try {
        if (handleShellScrollState(event)) return;
        const payload = validateViewerPayload(event.data, event);
        if (!payload) return;
        renderPayload(payload);
      } catch (error) {
        setViewerNotice(`Could not render viewer data: ${error.message}`, 'error');
      }
    }

    window.addEventListener('message', handleViewerMessage);
    window.addEventListener('wheel', relayBoundaryWheel, { passive: false });
    postViewerReady();
  </script>
</body>
</html>
