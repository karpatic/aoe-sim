      }
      function cachedBuildingIconImage(name) {
        const path = townCenterBuildingAssetPath(name);
        if (!path) return null;
        const id = townCenterBuildingIds.get(name);
        const key = `${id}:${path}`;
        let record = buildingIconImageCache.get(key);
        if (record) return record;
        const image = new Image();
        record = {
          image,
          id,
          path,
          loaded: false,
          failed: false,
          fallbackApplied: false,
        };
        image.decoding = 'async';
        image.onload = () => {
          record.loaded = true;
          record.failed = false;
          requestBuildingIconRender();
        };
        image.onerror = () => {
          record.failed = true;
          requestBuildingIconRender();
        };
        image.src = path;
        buildingIconImageCache.set(key, record);
        return record;
      }
      function buildingAttackRange(name) {
        if (name === 'Town Center') return 6;
        if (name === 'Castle' || (name.includes('Tower') && name !== 'Outpost')) return 8;
        return 0;
      }
      addCommandLegend('╳', 'Depleted resource node', '#111', mapResources.legendGroups.map);
      addViewlockLegend();
      addTeamCommandLegend('G', 'Gather command', true);
      addTeamCommandLegend('⚑', 'Building gather / rally point');
      addTeamCommandLegend('B', 'Build command', true);
      if (repairEventKeys.size) addTeamCommandLegend('R', 'Repair command', true);
      if (explicitGarrisonEvents.length) addCommandLegend('⌣◉', 'Un/garrison command', '#8b5a2b');
      addTeamCommandLegend('×', 'Attack command destination; individual unit markers remain static symbols');
      addTeamCommandLegend('○', 'Target / order command');
      addTeamCommandLegend('▣', 'Movement command destination; individual unit markers jump at observed command time');
      addTeamCommandLegend('→', 'Inferred command direction');
      const movementNote = document.createElement('p');
      movementNote.className = 'legend-note';
      movementNote.textContent = `Move, Attack, Gather, Build, and Repair selections share one actor position history; later commands replace prior visible command state. Individual unit markers are static generated silhouettes from the worker gameplay timeline; their positions update at replay command timestamps from observed or estimated birth positions to later command destinations. This is not engine pathfinding, terrain avoidance, or authoritative continuous position. Marker families include: ${mapSpriteDefinitions.map((definition) => definition.label).join(', ')}. Villager task labels remain evidence metadata for food, wood, gold, stone, build, and repair classifications. Estimated queue births, anonymous estimates, ambiguous actor matches, and reconciled parser IDs are retained in marker metadata and hover details. Unsupported last-known non-villager positions expire after six minutes in legacy command diagnostics; timeline units without explicit death remain survival-unresolved.`;
      mapResources.legendGroups.timeline.append(movementNote);
      const elevationNote = document.createElement('p');
      elevationNote.className = 'legend-note';
      elevationNote.textContent = 'Higher tiles are lighter and raised.';
      mapResources.legendGroups.map.append(elevationNote);

      function buildingName(label) {
        if (typeof label === 'object') return label.name ?? buildingName(label.label);
        return (label ?? 'Building').replace(/^(?:Build|Reseed):\s*/i, '');
      }

      function buildingFootprint(name) {
        const normalized = name.toLowerCase();
        if (normalized.includes('wonder') || normalized.includes('feitoria')) return [5, 5];
        if (normalized.includes('town center') || normalized.includes('castle') || normalized.includes('market')) return [4, 4];
        if (normalized.includes('gate')) return [4, 1];
        if (normalized.includes('house') || normalized.includes('donjon')) return [2, 2];
        if (normalized.includes('wall') || normalized.includes('tower') || normalized.includes('outpost')) return [1, 1];
        return [3, 3];
      }

      function buildingBounds(row) {
        if (row.end_position) return null;
        const [fallbackWide, fallbackHigh] = buildingFootprint(buildingName(row));
        const width = row.footprint?.tile_width ?? fallbackWide;
        const height = row.footprint?.tile_height ?? fallbackHigh;
        return {
          left: row.position.x - width / 2,
          right: row.position.x + width / 2,
          top: row.position.y - height / 2,
          bottom: row.position.y + height / 2,
        };
      }

      function pointInBounds(position, bounds) {
        return position && bounds
          && position.x > bounds.left && position.x < bounds.right
          && position.y > bounds.top && position.y < bounds.bottom;
      }

      function resourceOverlapsBounds(position, bounds) {
        return position && bounds
          && position.x + .5 > bounds.left && position.x - .5 < bounds.right
          && position.y + .5 > bounds.top && position.y - .5 < bounds.bottom;
      }

      function gatheringEvidenceOverlapsBounds(row, bounds) {
        const resource = String(row.resource ?? row.label ?? '').replace(/^Gather:\s*/, '');
        const isTree = resource.startsWith('Tree (') || treeGatherResources.has(resource);
        return isTree ? resourceOverlapsBounds(row.position, bounds) : pointInBounds(row.position, bounds);
      }

      const buildingClearances = buildingEvents
        .filter((row) => row.position && !row.end_position)
        .map((row) => ({ time: row.time, bounds: buildingBounds(row) }))
        .sort((a, b) => a.time - b.time);

      const constructionClearances = buildingEvents
        .filter((row) => row.position && !row.end_position)
        .map((row) => {
          const bounds = buildingBounds(row);
          const forestTiles = game.match.map.tiles.filter((tile) =>
            mapResources.forestTerrainIds.has(tile.terrain)
              && resourceOverlapsBounds({ x: tile.position.x + .5, y: tile.position.y + .5 }, bounds),
          );
          const gatherRows = gatherEvents.filter((gather) =>
            gather.time <= row.time && gatheringEvidenceOverlapsBounds(gather, bounds),
          );
          const gatherPointRows = gatherPointEvents.filter((point) =>
            point.time <= row.time && gatheringEvidenceOverlapsBounds(point, bounds),
          );
          const resources = mapResources.resources.filter((resource) => {
            const position = resourcePositionAt(resource, row.time);
            return isMapTreeResource(resource)
              ? resourceOverlapsBounds(position, bounds)
              : pointInBounds(position, bounds);
          });
          if (!forestTiles.length && !resources.length && !gatherRows.length && !gatherPointRows.length) return null;
          const depletionPositions = [
            ...forestTiles.map((tile) => ({ x: tile.position.x + .5, y: tile.position.y + .5 })),
            ...resources.map((resource) => resourcePositionAt(resource, row.time)),
            ...gatherRows.map((gather) => gather.position),
            ...gatherPointRows.map((point) => point.position),
          ];
          return {
            time: row.time,
            player: row.player,
            building: buildingName(row),
            bounds,
            resourceIds: resources.map((resource) => resource.instance_id),
            depletionPositions,
            forestTileCount: forestTiles.length,
            gatherCount: gatherRows.length + gatherPointRows.length,
          };
        })
        .filter(Boolean)
        .sort((a, b) => a.time - b.time);

      function clearedByBuilding(row, seconds) {
        return buildingClearances.some((clearance) =>
          clearance.time <= seconds && clearance.time >= row.time
            && gatheringEvidenceOverlapsBounds(row, clearance.bounds),
        );
      }

      function buildingsOverlap(first, second) {
        const a = buildingBounds(first);
        const b = buildingBounds(second);
        if (!a || !b) return false;
        const overlapWidth = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
        const overlapHeight = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
        const overlapArea = overlapWidth * overlapHeight;
        const firstArea = (a.right - a.left) * (a.bottom - a.top);
        const secondArea = (b.right - b.left) * (b.bottom - b.top);
        const overlapRatio = overlapArea / Math.min(firstArea, secondArea);
        if (buildingName(first).toLowerCase() === 'house' && first.player === second.player) return false;
        return overlapRatio >= .5;
      }

      function farmEstimateStatus(row, currentTime) {
        if (!hasResourceEstimates || buildingName(row).toLowerCase() !== 'farm') return null;
        const plot = estimateFarmByPosition.get(farmPositionKey(row.player, row.position));
        if (!plot) return null;
        const generations = Array.isArray(plot.generations) ? plot.generations : [];
        const active = generations
          .filter((generation) => Number(generation.seed_time) <= currentTime
            && (generation.disappearance_time === null || Number(generation.disappearance_time) > currentTime)
            && (generation.depleted_time === null || Number(generation.depleted_time) > currentTime || generation.disappearance_time === null))
          .sort((a, b) => Number(b.seed_time) - Number(a.seed_time))[0];
        if (active) {
          return {
            active: true,
            inferred: active.source === 'inferred_auto_reseed',
            confidence: active.confidence,
            generation: active,
          };
        }
        const seeded = generations.some((generation) => Number(generation.seed_time) <= currentTime);
        return seeded ? { active: false, inferred: false, confidence: 'possible' } : null;
      }

      function drawBuilding(row, currentTime) {
        const name = buildingName(row);
        if (row.end_position) {
          const startX = row.position.x * cellSize;
          const startY = row.position.y * cellSize;
          const endX = row.end_position.x * cellSize;
          const endY = row.end_position.y * cellSize;
          buildingContext.lineCap = 'square';
          buildingContext.strokeStyle = '#111';
          buildingContext.lineWidth = cellSize;
          buildingContext.beginPath();
          buildingContext.moveTo(startX, startY);
          buildingContext.lineTo(endX, endY);
          buildingContext.stroke();
          buildingContext.strokeStyle = playerColors.get(row.player) ?? '#888';
          buildingContext.lineWidth = Math.max(2, cellSize - 2);
          buildingContext.stroke();
          if (buildingNeedsIcon(name)) {
            drawBuildingIcon(
              name,
              (startX + endX) / 2,
              (startY + endY) / 2,
              Math.max(cellSize, Math.hypot(endX - startX, endY - startY)),
              cellSize * 2,
            );
          }
          return;
        }
        const [fallbackWide, fallbackHigh] = buildingFootprint(name);
        const tilesWide = row.footprint?.tile_width ?? fallbackWide;
        const tilesHigh = row.footprint?.tile_height ?? fallbackHigh;
        const width = tilesWide * cellSize;
        const height = tilesHigh * cellSize;
        const left = row.position.x * cellSize - width / 2;
        const top = row.position.y * cellSize - height / 2;

        if (farmStatus && !farmStatus.active) {
          buildingContext.globalAlpha = .35;
          buildingContext.fillStyle = 'rgba(120, 120, 120, .18)';
          buildingContext.fillRect(left, top, width, height);
          buildingContext.globalAlpha = 1;
          buildingContext.strokeStyle = '#333';

          buildingContext.strokeRect(left + .5, top + .5, Math.max(1, width - 1), Math.max(1, height - 1));
          buildingContext.setLineDash([]);

        buildingContext.fillRect(left, top, width, height);
        buildingContext.globalAlpha = 1;
        buildingContext.strokeStyle = '#111';
        buildingContext.lineWidth = 1;
        buildingContext.strokeRect(left + .5, top + .5, Math.max(1, width - 1), Math.max(1, height - 1));

      function drawBuildingRange(row) {

      function drawBuildingImage(image, x, y, availableWidth, availableHeight) {
        const padding = Math.min(2, Math.max(.75, Math.min(availableWidth, availableHeight) * .12));
        const maxWidth = Math.max(1, availableWidth - padding * 2);
        const maxHeight = Math.max(1, availableHeight - padding * 2);
        const naturalWidth = image.naturalWidth || image.width || maxWidth;
        const naturalHeight = image.naturalHeight || image.height || maxHeight;
        const scale = Math.min(maxWidth / naturalWidth, maxHeight / naturalHeight);
        const drawWidth = Math.max(1, naturalWidth * scale);
        const drawHeight = Math.max(1, naturalHeight * scale);
        buildingContext.save();
        buildingContext.imageSmoothingEnabled = false;
        buildingContext.drawImage(image, x - drawWidth / 2, y - drawHeight / 2, drawWidth, drawHeight);
        buildingContext.restore();
      }

      function drawBuildingIcon(name, x, y, availableWidth, availableHeight = availableWidth) {
        const imageRecord = cachedBuildingIconImage(name);
        if (imageRecord) {
          buildingIconRenderStats.visibleMapped += 1;
          if (imageRecord.failed) buildingIconRenderStats.missingVisibleMapped += 1;
          if (imageRecord.loaded) {
            buildingIconRenderStats.loadedVisibleMapped += 1;
            if (imageRecord.fallbackApplied) buildingIconRenderStats.missingVisibleMapped += 1;
            drawBuildingImage(imageRecord.image, x, y, availableWidth, availableHeight);
            return;
          }
        }
        const icon = buildingIcon(name);
        const availableSize = Math.min(availableWidth, availableHeight);

        buildingContext.textBaseline = 'middle';

        buildingContext.fillText(icon, x, y + .3);

      function drawRecentEvent(row, currentTime) {
        const position = row.position;
        if (!position) return;
        const x = position.x * cellSize;
        const y = position.y * cellSize;
        const age = currentTime - row.time;
        const fadeDuration = row.kind === 'gather'
          ? (row.commandDisplayLifetime ?? gatherEventLifetime(row))
          : (row.commandDisplayLifetime ?? 60);
        context.globalAlpha = Math.max(0, 1 - age / fadeDuration);
        context.strokeStyle = playerColors.get(row.player) ?? '#fff';
        context.fillStyle = playerColors.get(row.player) ?? '#fff';
        context.lineWidth = 2;
        context.beginPath();
        if (row.kind === 'build' || row.kind === 'repair' || row.kind === 'gather') {

          context.textBaseline = 'middle';

          context.lineWidth = 2;

          context.fillStyle = '#fff';
          context.fillText(letter, x, y + .5);
        } else if (row.kind === 'garrison' || row.kind === 'ungarrison') {
          const symbol = row.kind === 'garrison' ? '⌣' : '◉';
          context.font = 'bold 13px sans-serif';
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.strokeStyle = '#fff';
          context.lineWidth = 2;
          context.strokeText(symbol, x, y);
          context.fillStyle = '#8b5a2b';
          context.fillText(symbol, x, y);
        } else if (row.kind === 'attack') {
          context.moveTo(x - 4, y - 4);
          context.lineTo(x + 4, y + 4);
          context.moveTo(x + 4, y - 4);
          context.lineTo(x - 4, y + 4);
          context.stroke();
        } else if (row.kind === 'target' || row.kind === 'order') {
          context.arc(x, y, 6, 0, Math.PI * 2);
          context.stroke();
        } else {
          context.arc(x, y, 3.5, 0, Math.PI * 2);
          context.fill();
          context.strokeStyle = '#111';
          context.lineWidth = 1;
          context.stroke();
        }
        context.globalAlpha = 1;
      }

      function drawCommandArrow(row, currentTime) {
        const age = currentTime - row.time;
        if (age < 0 || age >= row.lifetime) return;
        const startX = row.from.x * cellSize;
        const startY = row.from.y * cellSize;
        const endX = row.to.x * cellSize;
        const endY = row.to.y * cellSize;
        const angle = Math.atan2(endY - startY, endX - startX);
        const length = Math.hypot(endX - startX, endY - startY);
        if (length < 2) return;
        const trimStart = Math.min(5, length / 4);
        const trimEnd = Math.min(7, length / 4);
        const fromX = startX + Math.cos(angle) * trimStart;
        const fromY = startY + Math.sin(angle) * trimStart;
        const toX = endX - Math.cos(angle) * trimEnd;
        const toY = endY - Math.sin(angle) * trimEnd;
        const opacity = Math.max(0, 1 - age / row.lifetime);
        context.save();
        context.globalAlpha = opacity;
        context.strokeStyle = playerColors.get(row.player) ?? '#fff';
        context.fillStyle = playerColors.get(row.player) ?? '#fff';
        context.lineWidth = 1.5;
        context.setLineDash([5, 3]);
        context.beginPath();
        context.moveTo(fromX, fromY);
        context.lineTo(toX, toY);
        context.stroke();
        context.setLineDash([]);
        context.beginPath();
        context.moveTo(toX, toY);
        context.lineTo(
          toX - Math.cos(angle - Math.PI / 6) * 6,
          toY - Math.sin(angle - Math.PI / 6) * 6,
        );
        context.lineTo(
          toX - Math.cos(angle + Math.PI / 6) * 6,
          toY - Math.sin(angle + Math.PI / 6) * 6,
        );
        context.closePath();
        context.fill();
        context.restore();
      }

      function drawGatherPoint(row) {
        const x = row.position.x * cellSize;
        const y = row.position.y * cellSize;
        const color = playerColors.get(row.player) ?? '#fff';
        context.globalAlpha = 1;
        context.strokeStyle = '#111';
        context.fillStyle = color;
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(x - 3, y + 6);
        context.lineTo(x - 3, y - 6);
        context.stroke();
        context.beginPath();
        context.moveTo(x - 2, y - 6);
        context.lineTo(x + 6, y - 3);
        context.lineTo(x - 2, y);
        context.closePath();
        context.fill();
        context.stroke();
      }

      function currentViewlocks(seconds) {
        return indexedViewlockPlayers.flatMap((player) => {
          const rows = indexedViewlocksByPlayer.get(player) ?? [];
          const index = upperBound(rows, seconds) - 1;
          return index >= 0 ? [rows[index]] : [];
        });
      }

      function viewlockEvidence(row) {
        return `p${row.player}:${row.time.toFixed(3)}@${row.position.x.toFixed(1)},${row.position.y.toFixed(1)}`;
      }

      function drawViewlock(row) {
        const size = viewlockSquareTiles * cellSize;
        const x = row.position.x * cellSize;
        const y = row.position.y * cellSize;
        context.save();
        context.globalAlpha = .46;
        context.strokeStyle = playerColors.get(row.player) ?? '#fff';
        context.lineWidth = 1.25;
        context.setLineDash([5, 4]);
        context.strokeRect(x - size / 2, y - size / 2, size, size);
        context.restore();
      }

      function placementKey(row) {
        const end = row.end_position ? `:${row.end_position.x}:${row.end_position.y}` : '';
        return `${row.player}:${row.position.x.toFixed(2)}:${row.position.y.toFixed(2)}:${buildingName(row)}${end}`;
      }

      function segmentIntersectsExpandedBounds(start, end, bounds, margin = 0) {
        const expanded = {
          left: bounds.left - margin,
          right: bounds.right + margin,
          top: bounds.top - margin,
          bottom: bounds.bottom + margin,
        };
        let minimum = 0;
        let maximum = 1;
        for (const [origin, delta, low, high] of [
          [start.x, end.x - start.x, expanded.left, expanded.right],
          [start.y, end.y - start.y, expanded.top, expanded.bottom],
        ]) {
          if (Math.abs(delta) < 1e-9) {
            if (origin < low || origin > high) return false;
            continue;
          }
          const first = (low - origin) / delta;
          const second = (high - origin) / delta;
          minimum = Math.max(minimum, Math.min(first, second));
          maximum = Math.min(maximum, Math.max(first, second));
          if (minimum > maximum) return false;
        }
        return true;
      }

      // A large hostile formation ending inside a low-durability structure's
      // footprint is useful control evidence. Short inferred routes and long
      // map-spanning crossings remain nonterminal encounter evidence; geometry
      // cannot create a terminal event without an exact-generation anchor.
      const occupationInferencePolicy = Object.freeze({
        minimumSelectedActors: 12,
        endpointMarginTiles: .5,
        maximumShortRouteTiles: 12,
        confirmationDelaySeconds: 30,
        eligibleBuildings: new Set(['House', 'Stable']),
      });
      const terminalCandidateBuildings = [...startingBuildings, ...buildingEvents];
      const buildingGenerationId = new Map();
      startingBuildings.forEach((building, index) => buildingGenerationId.set(building, `starting:${index}`));
      buildingEvents.forEach((building, index) => buildingGenerationId.set(building, `placement:${index}`));
      function generationIdFor(building) {
        return buildingGenerationId.get(building);
      }
      const observedPlacementLastActivity = new Map();
      targetEvents.forEach((rows, targetId) => {
        const actorActivity = lastActorTime.get(targetId);
        if (actorActivity === undefined) return;
        rows.forEach((row) => {
          const name = row.label.replace(/^Target:\s*/i, '');
          const building = terminalCandidateBuildings
            .filter((candidate) => candidate.time <= row.time
              && buildingName(candidate) === name
              && Math.hypot(
                candidate.position.x - row.position.x,
                candidate.position.y - row.position.y,
              ) <= .6)
            .sort((a, b) => (b.time ?? 0) - (a.time ?? 0))[0];
          if (!building) return;
          const key = generationIdFor(building);
          observedPlacementLastActivity.set(key, Math.max(
            observedPlacementLastActivity.get(key) ?? -1,
            actorActivity,
          ));
        });
      });
      const occupationDemolitionsByKey = new Map();
      const occupationEvidence = [];
      commandMapEvents
        .filter((row) => ['move', 'attack'].includes(row.kind) && row.position)
        .forEach((command) => {
          const selectedActors = new Set((command.object_ids ?? [])
            .filter((instanceId) => !controllableFoodActorIds.has(instanceId))).size;
          if (selectedActors < occupationInferencePolicy.minimumSelectedActors) return;
          terminalCandidateBuildings
            .filter((building) => building.player !== command.player
              && building.time <= command.time
              && occupationInferencePolicy.eligibleBuildings.has(buildingName(building)))
            .filter((building) => {
              const bounds = buildingBounds(building);
              const endpointOccupiesFootprint = segmentIntersectsExpandedBounds(
                command.position,
                command.position,
                bounds,
                occupationInferencePolicy.endpointMarginTiles,
              );
              const shortRouteCrossesFootprint = command.commandArrow
                && command.commandArrow.distance <= occupationInferencePolicy.maximumShortRouteTiles
                && segmentIntersectsExpandedBounds(
                  command.commandArrow.from,
                  command.commandArrow.to,
                  bounds,
                  0,
                );
              return endpointOccupiesFootprint || shortRouteCrossesFootprint;
            })
            .forEach((building) => {
              const key = generationIdFor(building);
              const inferredTime = command.time + occupationInferencePolicy.confirmationDelaySeconds;
              const bounds = buildingBounds(building);
              const endpointOccupiesFootprint = segmentIntersectsExpandedBounds(
                command.position,
                command.position,
                bounds,
                occupationInferencePolicy.endpointMarginTiles,
              );
              const evidence = {
                time: inferredTime,
                commandTime: command.time,
                player: command.player,
                owner: building.player,
                generationId: key,
                name: buildingName(building),
                position: building.position,
                selectedActors,
                endpointOccupiesFootprint,
                confidence: 'generic hostile-formation footprint evidence; nonterminal without anchored sustained control',
              };
              occupationEvidence.push(evidence);
              if ((occupationDemolitionsByKey.get(key)?.time ?? Infinity) <= inferredTime) return;
              occupationDemolitionsByKey.set(key, evidence);
            });
        });
      const occupationDemolitions = [...occupationDemolitionsByKey.values()];

      // Correlated terminal anchors can establish that a compact base area was
      // overrun even when sparse command telemetry omits direct target IDs for
      // every individual structure. Geometry never creates a collapse episode
      // by itself: every qualifying episode includes direct hostile terminal
      // evidence for at least one exact placement generation.
      const clusterCollapsePolicy = Object.freeze({
        maximumEpisodeSeconds: 360,
        maximumConsecutiveAnchorGapSeconds: 180,
        maximumAnchorDistanceTiles: 15,
        zoneMarginTiles: 6,
        maximumConnectedGapTiles: 2,
        maximumComponentDiameterTiles: 24,
        normalEndpointActors: 12,
        corroboratedEndpointActors: 10,
        assaultCohortEndpointActors: 8,
        minimumAssaultDirectAnchors: 4,
        minimumAssaultSequenceSeconds: 120,
        minimumAssaultComponentControlSamples: 2,
        maximumAssaultComponentDiameterTiles: 14,
        directAnchorPreControlSeconds: 30,
        minimumEndpointSeparationSeconds: 30,
        maximumPostAnchorControlSeconds: 120,
        confirmationDelaySeconds: 30,
        excludedBuildings: new Set(['Farm', 'Palisade Wall', 'Stone Wall', 'Gate']),
      });
      const hostileEndpointSamples = commandMapEvents
        .filter((command) => ['move', 'attack'].includes(command.kind) && command.position)
        .map((command) => ({
          time: command.time,
          kind: command.kind,
          player: command.player,
          position: command.position,
          selectedActors: new Set((command.object_ids ?? [])
            .filter((instanceId) => !controllableFoodActorIds.has(instanceId))).size,
        }))
        .filter((sample) => sample.selectedActors >= clusterCollapsePolicy.assaultCohortEndpointActors);
      function exactTerminalPlacement(evidence) {
        return terminalCandidateBuildings
          .filter((building) => building.player !== evidence.player
            && building.time <= evidence.time
            && buildingName(building) === evidence.name
            && Math.hypot(
              building.position.x - evidence.position.x,
              building.position.y - evidence.position.y,
            ) <= .6)
          .sort((a, b) => (b.time ?? 0) - (a.time ?? 0))[0] ?? null;
      }
      const terminalAnchorByKey = new Map();
      function registerTerminalAnchor(anchor) {
        const key = `${anchor.player}:${anchor.owner}:${anchor.generationId}`;
        const prior = terminalAnchorByKey.get(key);
        if (!prior) {
          terminalAnchorByKey.set(key, anchor);
          return;
        }
        prior.time = Math.min(prior.time, anchor.time);
        prior.direct ||= anchor.direct;
      }
      demolitionEvents.forEach((evidence) => {
        const building = exactTerminalPlacement(evidence);
        if (!building) return;
        const generationId = generationIdFor(building);
        evidence.generationId = generationId;
        registerTerminalAnchor({
          time: evidence.time,
          player: evidence.player,
          owner: building.player,
          generationId,
          building,
          direct: true,
        });
      });
      function aliveGenerationIdsAt(time) {
        const alive = new Map();
        startingBuildings.forEach((building) => alive.set(generationIdFor(building), building));
        const lifecycleEvents = [
          ...buildingEvents.map((building) => ({ type: 'placement', time: building.time, building })),
          ...demolitionEvents
            .filter((evidence) => evidence.generationId)
            .map((evidence) => ({ type: 'terminal', time: evidence.time, evidence })),
        ].filter((event) => event.time <= time)
          .sort((a, b) => a.time - b.time || (a.type === 'terminal' ? -1 : 1));
        lifecycleEvents.forEach((event) => {
          if (event.type === 'terminal') {
            alive.delete(event.evidence.generationId);
            return;
          }
          if (!event.building.end_position) {
            [...alive.entries()].forEach(([generationId, prior]) => {
              if (buildingsOverlap(prior, event.building)) alive.delete(generationId);
            });
          }
          alive.set(generationIdFor(event.building), event.building);
        });
        return new Set(alive.keys());
      }
      const clusterCollapseDemolitionsByKey = new Map();
      const anchorsByConflict = new Map();
      [...terminalAnchorByKey.values()]
        .filter((anchor) => anchor.building)
        .forEach((anchor) => {
          const key = `${anchor.player}:${anchor.owner}`;
          if (!anchorsByConflict.has(key)) anchorsByConflict.set(key, []);
          anchorsByConflict.get(key).push(anchor);
        });
      anchorsByConflict.forEach((conflictAnchors) => {
        const remaining = [...conflictAnchors].sort((a, b) => a.time - b.time);
        while (remaining.length) {
          const seed = remaining.shift();
          const episode = [seed];
          let changed = true;
          while (changed) {
            changed = false;
            for (let index = remaining.length - 1; index >= 0; index -= 1) {
              const candidate = remaining[index];
              if (candidate.time > seed.time + clusterCollapsePolicy.maximumEpisodeSeconds) continue;
              const temporalLink = episode.some((anchor) => Math.abs(candidate.time - anchor.time)
                <= clusterCollapsePolicy.maximumConsecutiveAnchorGapSeconds);
              const linked = temporalLink && episode.some((anchor) => Math.hypot(
                candidate.building.position.x - anchor.building.position.x,
                candidate.building.position.y - anchor.building.position.y,
              ) <= clusterCollapsePolicy.maximumAnchorDistanceTiles);
              if (!linked) continue;
              episode.push(candidate);
              remaining.splice(index, 1);
              changed = true;
            }
          }
          const directTimes = episode.map((anchor) => anchor.time).sort((a, b) => a - b);
          const minimumEndpointActors = episode.length >= 3
            ? clusterCollapsePolicy.corroboratedEndpointActors
            : clusterCollapsePolicy.normalEndpointActors;
          const episodeEndpointSamples = hostileEndpointSamples
            .filter((sample) => sample.player === seed.player
              && episode.some((anchor) => sample.time >= anchor.time - clusterCollapsePolicy.maximumConsecutiveAnchorGapSeconds
                && sample.time <= anchor.time + clusterCollapsePolicy.maximumEpisodeSeconds)
              && episode.some((anchor) => Math.hypot(
                sample.position.x - anchor.building.position.x,
                sample.position.y - anchor.building.position.y,
              ) <= clusterCollapsePolicy.maximumAnchorDistanceTiles))
            .sort((a, b) => a.time - b.time);
          const controlSamples = episodeEndpointSamples
            .filter((sample) => sample.selectedActors >= minimumEndpointActors);
          const hasBracketingControl = controlSamples.some((first, firstIndex) => controlSamples
            .slice(firstIndex + 1)
            .some((second) => second.time - first.time >= clusterCollapsePolicy.minimumEndpointSeparationSeconds
              && second.time - first.time <= clusterCollapsePolicy.maximumEpisodeSeconds
              && directTimes.some((time) => time >= first.time && time <= second.time)));
          const directSequenceSeconds = directTimes.at(-1) - directTimes[0];
          const hasPostAnchorControl = episode.length >= 3
            && directSequenceSeconds >= 60
            && controlSamples.some((sample) => sample.time >= directTimes.at(-1)
              && sample.time <= directTimes.at(-1) + clusterCollapsePolicy.maximumPostAnchorControlSeconds);
          if (!hasBracketingControl && !hasPostAnchorControl) continue;
          const endpointOccupationEvidence = occupationEvidence
            .filter((evidence) => evidence.endpointOccupiesFootprint
              && evidence.player === seed.player
              && evidence.owner === seed.owner
              && evidence.selectedActors >= minimumEndpointActors
              && controlSamples.some((sample) => Math.abs(sample.time - evidence.commandTime) < 1e-6));
          const occupiedBuildings = endpointOccupationEvidence
            .map((evidence) => terminalCandidateBuildings
              .find((building) => generationIdFor(building) === evidence.generationId))
            .filter(Boolean);
          const houseEvidenceIds = new Set([
            ...episode.filter((anchor) => buildingName(anchor.building) === 'House')
              .map((anchor) => anchor.generationId),
            ...endpointOccupationEvidence.filter((evidence) => evidence.name === 'House')
              .map((evidence) => evidence.generationId),
          ]);
          const baseCollapseBranch = episode.length >= 3;
          const houseOnlyBranch = houseEvidenceIds.size >= 3;
          if (!baseCollapseBranch && !houseOnlyBranch) continue;
          const finalAnchorTime = Math.max(...directTimes);
          const finalControlTime = Math.max(finalAnchorTime, ...controlSamples.map((sample) => sample.time));
          const aliveAtFinalControl = aliveGenerationIdsAt(finalControlTime);
          const directAnchorBuildings = episode.map((anchor) => anchor.building);
          const occupiedAliveBuildings = occupiedBuildings
            .filter((building) => aliveAtFinalControl.has(generationIdFor(building)));
          const evidenceBuildings = [...new Map([
            ...directAnchorBuildings,
            ...occupiedAliveBuildings,
          ].map((building) => [generationIdFor(building), building])).values()];
          const left = Math.min(...evidenceBuildings.map((building) => buildingBounds(building).left))
            - clusterCollapsePolicy.zoneMarginTiles;
          const right = Math.max(...evidenceBuildings.map((building) => buildingBounds(building).right))
            + clusterCollapsePolicy.zoneMarginTiles;
          const top = Math.min(...evidenceBuildings.map((building) => buildingBounds(building).top))
            - clusterCollapsePolicy.zoneMarginTiles;
          const bottom = Math.max(...evidenceBuildings.map((building) => buildingBounds(building).bottom))
            + clusterCollapsePolicy.zoneMarginTiles;
          const zoneCandidates = terminalCandidateBuildings
            .filter((building) => aliveAtFinalControl.has(generationIdFor(building))
              && building.player === seed.owner
              && building.time <= finalControlTime
              && !building.end_position
              && (baseCollapseBranch || buildingName(building) === 'House')
              && !clusterCollapsePolicy.excludedBuildings.has(buildingName(building)))
            .filter((building) => {
              const bounds = buildingBounds(building);
              return bounds.right >= left && bounds.left <= right
                && bounds.bottom >= top && bounds.top <= bottom;
            });
          const connectedKeys = new Set(evidenceBuildings.map((building) => generationIdFor(building)));
          function footprintGap(first, second) {
            const a = buildingBounds(first);
            const b = buildingBounds(second);
            const dx = Math.max(0, a.left - b.right, b.left - a.right);
              const dy = Math.max(0, a.top - b.bottom, b.top - a.bottom);
              return Math.hypot(dx, dy);
          }
          const connectionCandidates = [...new Map([
            ...evidenceBuildings,
            ...zoneCandidates,
          ].map((building) => [generationIdFor(building), building])).values()];
          let expanded = true;
          while (expanded) {
            expanded = false;
            zoneCandidates.forEach((candidate) => {
              const key = generationIdFor(candidate);
              if (connectedKeys.has(key)) return;
              const touchesEvidenceCluster = connectionCandidates.some((connected) => connectedKeys.has(generationIdFor(connected))
                && footprintGap(candidate, connected) <= clusterCollapsePolicy.maximumConnectedGapTiles);
              if (!touchesEvidenceCluster) return;
              connectedKeys.add(key);
              expanded = true;
            });
          }
          const connectedBuildings = connectionCandidates
            .filter((building) => connectedKeys.has(generationIdFor(building)));
          const componentPool = [...connectedBuildings];
          const components = [];
          while (componentPool.length) {
            const component = [componentPool.shift()];
            let componentExpanded = true;
            while (componentExpanded) {
              componentExpanded = false;
              for (let index = componentPool.length - 1; index >= 0; index -= 1) {
                if (!component.some((building) => footprintGap(building, componentPool[index])
                  <= clusterCollapsePolicy.maximumConnectedGapTiles)) continue;
                component.push(componentPool[index]);
                componentPool.splice(index, 1);
                componentExpanded = true;
              }
            }
            components.push(component);
          }
          components.forEach((component) => {
            const componentIds = new Set(component.map((building) => generationIdFor(building)));
            const componentDirectAnchors = episode
              .filter((anchor) => componentIds.has(anchor.generationId));
            const componentHouseEvidenceIds = new Set([
              ...componentDirectAnchors.filter((anchor) => buildingName(anchor.building) === 'House')
                .map((anchor) => anchor.generationId),
              ...endpointOccupationEvidence.filter((evidence) => evidence.name === 'House'
                && componentIds.has(evidence.generationId))
                .map((evidence) => evidence.generationId),
            ]);
            const componentBaseBranch = baseCollapseBranch && componentDirectAnchors.length >= 1;
            const componentHouseOnlyBranch = componentHouseEvidenceIds.size >= 3;
            if (!componentBaseBranch && !componentHouseOnlyBranch) return;
            const endpointTouchesComponent = (position, margin = 2) => component.some((building) =>
              segmentIntersectsExpandedBounds(position, position, buildingBounds(building), margin));
            const componentControlSamples = controlSamples
              .filter((sample) => endpointTouchesComponent(sample.position));
            const componentAssaultControlSamples = episodeEndpointSamples
              .filter((sample) => sample.selectedActors >= clusterCollapsePolicy.assaultCohortEndpointActors
                && endpointTouchesComponent(sample.position));
            const componentDirectTimes = componentDirectAnchors.map((anchor) => anchor.time)
              .sort((a, b) => a - b);
            const componentDiameter = Math.max(0, ...component.flatMap((first, index) =>
              component.slice(index + 1).map((second) => Math.hypot(
                first.position.x - second.position.x,
                first.position.y - second.position.y,
              ))));
            const componentDirectMembers = episode
              .filter((anchor) => componentIds.has(anchor.generationId));
            if (!componentDirectMembers.length
              || componentDiameter > clusterCollapsePolicy.maximumComponentDiameterTiles) return;
            const qualifyingPairs = [];
            componentControlSamples.forEach((first, firstIndex) => {
              componentControlSamples.slice(firstIndex + 1).forEach((second) => {
                if (second.time - first.time < clusterCollapsePolicy.minimumEndpointSeparationSeconds
                  || second.time - first.time > clusterCollapsePolicy.maximumEpisodeSeconds
                  || !componentDirectTimes.some((time) => time >= first.time && time <= second.time)) return;
                qualifyingPairs.push({ first, second });
              });
            });
            qualifyingPairs.sort((a, b) => b.second.time - a.second.time
              || (a.second.time - a.first.time) - (b.second.time - b.first.time));
            const postAnchorSample = componentBaseBranch
              && directSequenceSeconds >= 60
              ? componentControlSamples.find((sample) => sample.time >= directTimes.at(-1)
                && sample.time <= directTimes.at(-1)
                  + clusterCollapsePolicy.maximumPostAnchorControlSeconds)
              : null;
            const controlCandidates = [];
            if (qualifyingPairs.length) {
              const pair = qualifyingPairs[0];
              const samples = componentControlSamples
                .filter((sample) => sample.time >= pair.first.time && sample.time <= pair.second.time);
              let lastControlTime = pair.second.time;
              componentControlSamples
                .filter((sample) => sample.time > pair.second.time)
                .forEach((sample) => {
                  if (sample.time - lastControlTime
                    > clusterCollapsePolicy.maximumConsecutiveAnchorGapSeconds) return;
                  samples.push(sample);
                  lastControlTime = sample.time;
                });
              controlCandidates.push({ mode: 'standard', samples });
            }
            if (postAnchorSample) {
              controlCandidates.push({ mode: 'post-anchor', samples: [postAnchorSample] });
            }
            const assaultBranch = componentBaseBranch
              && episode.length >= clusterCollapsePolicy.minimumAssaultDirectAnchors
              && directSequenceSeconds >= clusterCollapsePolicy.minimumAssaultSequenceSeconds
              && componentDiameter <= clusterCollapsePolicy.maximumAssaultComponentDiameterTiles
              && componentAssaultControlSamples.length >= clusterCollapsePolicy.minimumAssaultComponentControlSamples
              && componentAssaultControlSamples.some((sample) => sample.selectedActors < minimumEndpointActors);
            if (assaultBranch) {
              const assaultPairs = [];
              componentAssaultControlSamples.forEach((first, firstIndex) => {
                componentAssaultControlSamples.slice(firstIndex + 1).forEach((second) => {
                  const pairedWithLocalAnchor = componentDirectTimes.some((time) =>
                    time >= first.time - clusterCollapsePolicy.directAnchorPreControlSeconds
                      && time <= second.time);
                  const pairedWithEpisodeAnchor = directTimes.some((time) =>
                    time >= first.time && time <= second.time);
                  const pairUsesLowerMassEvidence = first.selectedActors < minimumEndpointActors
                    || second.selectedActors < minimumEndpointActors;
                  if (second.time - first.time < clusterCollapsePolicy.minimumEndpointSeparationSeconds
                    || second.time - first.time > clusterCollapsePolicy.maximumEpisodeSeconds
                    || (!pairedWithLocalAnchor && !pairedWithEpisodeAnchor)
                    || !pairUsesLowerMassEvidence) return;
                  assaultPairs.push({ first, second });
                });
              });
              assaultPairs.sort((a, b) => a.second.time - b.second.time
                || (a.second.time - a.first.time) - (b.second.time - b.first.time));
              if (assaultPairs.length) {
                const pair = assaultPairs[0];
                controlCandidates.push({
                  mode: 'assault-cohort',
                  samples: componentAssaultControlSamples
                    .filter((sample) => sample.time >= pair.first.time && sample.time <= pair.second.time),
                });
              }
            }
            if (!controlCandidates.length) return;
            controlCandidates.sort((a, b) => Math.max(
              componentDirectTimes.at(-1),
              ...a.samples.map((sample) => sample.time),
            ) - Math.max(
              componentDirectTimes.at(-1),
              ...b.samples.map((sample) => sample.time),
            ));
            const selectedControlCandidate = controlCandidates[0];
            const qualifyingControlSamples = selectedControlCandidate.samples;
            const componentControlTime = Math.max(
              componentDirectTimes.at(-1),
              ...qualifyingControlSamples.map((sample) => sample.time),
            );
            const componentInferredTime = componentControlTime
              + clusterCollapsePolicy.confirmationDelaySeconds;
            const ownerMassReentry = hostileEndpointSamples.some((sample) => sample.player === seed.owner
              && sample.selectedActors >= clusterCollapsePolicy.normalEndpointActors
              && sample.time > componentInferredTime
              && sample.time <= componentInferredTime
                + clusterCollapsePolicy.maximumConsecutiveAnchorGapSeconds
              && endpointTouchesComponent(sample.position));
            const ownerRepair = commandMapEvents.some((command) => command.kind === 'repair'
              && command.player === seed.owner
              && command.position
              && command.time > componentInferredTime
              && command.time <= componentInferredTime
                + clusterCollapsePolicy.maximumConsecutiveAnchorGapSeconds
              && endpointTouchesComponent(command.position));
            if (ownerMassReentry || ownerRepair) return;
            component
              .filter((building) => componentBaseBranch || buildingName(building) === 'House')
              .filter((building) => (observedPlacementLastActivity.get(generationIdFor(building)) ?? -1)
                <= componentInferredTime)
              .forEach((building) => {
                const key = generationIdFor(building);
                if ((clusterCollapseDemolitionsByKey.get(key)?.time ?? Infinity)
                  <= componentInferredTime) return;
                clusterCollapseDemolitionsByKey.set(key, {
                  time: componentInferredTime,
                  player: seed.player,
                  owner: seed.owner,
                  generationId: key,
                  name: buildingName(building),
                  position: building.position,
                  anchorCount: componentDirectAnchors.length + componentHouseEvidenceIds.size,
                  directAnchorCount: componentDirectAnchors.length,
                  episodeAnchorCount: episode.length,
                  standardControlSampleCount: componentControlSamples.length,
                  assaultControlSampleCount: componentAssaultControlSamples.length,
                  controlSampleCount: qualifyingControlSamples.length,
                  controlMode: selectedControlCandidate.mode,
                  directAnchorEvidence: componentDirectAnchors.map((anchor) =>
                    `${buildingName(anchor.building)}@${anchor.building.position.x.toFixed(1)},${anchor.building.position.y.toFixed(1)}:${anchor.time.toFixed(3)}`),
                  episodeAnchorEvidence: episode.map((anchor) =>
                    `${buildingName(anchor.building)}@${anchor.building.position.x.toFixed(1)},${anchor.building.position.y.toFixed(1)}:${anchor.time.toFixed(3)}`),
                  controlSampleEvidence: qualifyingControlSamples.map((sample) =>
                    `${sample.kind}:${sample.selectedActors}:${sample.time.toFixed(3)}@${sample.position.x.toFixed(1)},${sample.position.y.toFixed(1)}`),
                  confidence: 'probable: exact-generation anchored sustained hostile control',
                });
              });
          });
        }
      });
      const clusterCollapseDemolitions = [...clusterCollapseDemolitionsByKey.values()];

      const indexedBuildings = new Map();
      startingBuildings.forEach((row, index) => indexedBuildings.set(`starting:${index}`, row));
      let indexedTargetedDemolitions = 0;
      let indexedOccupationDemolitions = 0;
      let indexedClusterCollapseDemolitions = 0;
      let indexedOverlapDemolitions = 0;
      const buildingSnapshots = [{
        time: 0,
        buildings: [...indexedBuildings.values()],
        targetedDemolitions: 0,
        occupationDemolitions: 0,
        clusterCollapseDemolitions: 0,
        overlapDemolitions: 0,
      }];
      const structureEvents = [
        ...buildingEvents.map((row) => ({ type: 'placement', time: row.time, row })),
        ...demolitionEvents.map((row) => ({ type: 'demolition', time: row.time, row })),
        ...clusterCollapseDemolitions.map((row) => ({ type: 'cluster_collapse', time: row.time, row })),
      ];
      const structureEventPhase = Object.freeze({ demolition: 0, cluster_collapse: 1, placement: 3 });
      structureEvents.sort((a, b) => a.time - b.time
        || structureEventPhase[a.type] - structureEventPhase[b.type]
        || (a.row.generationId ?? generationIdFor(a.row) ?? '').localeCompare(
          b.row.generationId ?? generationIdFor(b.row) ?? '',
        ));
      structureEvents.forEach((entry) => {
        if (entry.type === 'placement') {
          const row = entry.row;
          if (!row.position) return;
          const key = generationIdFor(row);
          if (!row.end_position) {
            [...indexedBuildings.entries()].forEach(([priorKey, prior]) => {
              if (buildingsOverlap(prior, row)) {
                indexedBuildings.delete(priorKey);
                indexedOverlapDemolitions += 1;
              }
            });
          }
          indexedBuildings.set(key, row);
        } else {
          const demolition = entry.row;
          if (demolition.generationId && indexedBuildings.has(demolition.generationId)) {
