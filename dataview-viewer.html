<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AoE II single-game data</title>
  <style>
    :root { --timeline-height: 3.35rem; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    main { display: grid; grid-template-columns: min(100vh, calc(100vw - 24rem)) minmax(24rem, 1fr); width: 100%; height: 100vh; max-width: 100%; overflow: hidden; }
    body { margin: 0; overflow-wrap: anywhere; }
    details, summary, code { max-width: 100%; overflow-wrap: anywhere; }
    summary { cursor: pointer; }
    .tree { width: 100%; overflow: auto; border: 1px solid; padding: .5rem; }
    .node, .primitive { margin-left: 1rem; }
    code, .schema-object { white-space: pre-wrap; overflow-wrap: anywhere; }
    #map-column { display: grid; place-items: start center; width: 100%; height: 100vh; min-width: 0; overflow: hidden; background: #101214; }
    #detail-column { min-width: 0; height: 100vh; padding: .65rem .75rem calc(var(--timeline-height) + 1rem); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
    #timeline-players, #map-legend-details { width: 100%; max-width: none; }
    #map-stack { position: relative; width: 100%; height: 100vh; }
    #map-canvas { display: block; width: 100%; height: 100%; border: 1px solid; object-fit: contain; image-rendering: pixelated; }
    #resource-canvas, #building-canvas, #gameplay-canvas, #sprite-overlay { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; }
    #sprite-overlay { overflow: visible; }
    .party-sprite-strip { position: absolute; display: flex; align-items: center; gap: var(--strip-gap); height: var(--strip-height); padding: 0 var(--strip-padding-x); color: #fff; opacity: .96; font: bold var(--strip-font-size) sans-serif; line-height: 1; white-space: nowrap; image-rendering: pixelated; }
    .party-sprite-item { position: relative; display: inline-grid; grid-template-columns: var(--sprite-cell-size) var(--badge-slot-size); align-items: center; width: var(--party-entry-width); height: var(--strip-height); }
    .party-sprite-image { grid-column: 1; justify-self: center; display: block; width: var(--sprite-size); height: var(--sprite-size); object-fit: contain; image-rendering: pixelated; filter: var(--team-sprite-filter, grayscale(1) sepia(1) saturate(1.15) brightness(1.02) contrast(1.08)) drop-shadow(0 0 1px #111) drop-shadow(0 0 2px var(--player-color)); }
    .party-sprite-count { position: absolute; top: 0; left: var(--sprite-cell-size); display: inline-block; min-width: .9em; padding: .05em .16em; border: 1px solid var(--player-color); border-radius: 999px; color: #fff; background: rgba(12, 14, 15, .88); font-size: var(--badge-font-size); font-variant-numeric: tabular-nums; line-height: .95; text-align: center; text-shadow: 0 1px 0 #111, 1px 0 0 #111; transform: translateY(-18%); }
    .party-sprite-task-marker { position: absolute; left: calc(var(--sprite-cell-size) + var(--task-marker-inset)); bottom: var(--task-marker-inset); display: block; width: var(--task-marker-size); height: var(--task-marker-size); object-fit: contain; image-rendering: pixelated; }
    #map-legend { margin: .5rem 0; }
    .legend-group { display: flex; flex-wrap: wrap; gap: .55rem .75rem; padding: .25rem 0; }
    .legend-group + .legend-group { margin-top: .35rem; padding-top: .55rem; border-top: 1px solid #bbb; }
    .legend-group-title { flex-basis: 100%; margin: 0; font-size: .82rem; }
    .legend-item { display: inline-flex; flex: 0 1 auto; min-width: 0; max-width: 100%; align-items: flex-start; white-space: normal; overflow-wrap: anywhere; }
    .legend-note { flex-basis: 100%; margin: 0; }
    .swatch { display: inline-block; flex: 0 0 auto; width: 1rem; height: 1rem; margin-right: .25rem; border: 1px solid; vertical-align: text-bottom; }
    .command-symbol { display: inline-block; flex: 0 0 auto; width: 1rem; margin-right: .25rem; text-align: center; font-weight: bold; line-height: 1rem; white-space: nowrap; overflow-wrap: normal; vertical-align: text-bottom; }
    .outlined-command-symbol { -webkit-text-stroke: 1.5px var(--command-outline); paint-order: stroke fill; text-shadow: 0 0 1px #111; }
    .animal-symbol { display: inline-block; flex: 0 0 auto; width: .75rem; height: .75rem; margin: 0 .5rem 0 .125rem; border: 1px solid #111; border-radius: 50%; vertical-align: -.05rem; }
    #timeline-section { position: fixed; z-index: 20; right: 0; bottom: 0; left: 0; width: 100vw; min-height: var(--timeline-height); margin: 0; padding: .55rem; border-top: 1px solid #333; background: rgba(255, 255, 255, .97); box-shadow: 0 -.25rem .75rem rgba(0, 0, 0, .16); }
    #timeline-controls { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; width: 100%; margin: 0; padding: 0; }
    #timeline-slider { flex: 1 1 18rem; min-width: 0; }
    #timeline-map-size { display: none; }
    #timeline-players { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(20rem, 100%), 1fr)); align-items: start; gap: .5rem; margin-bottom: .5rem; }
    .legend-category-icon { display: inline-block; flex: 0 0 auto; width: 1rem; height: 1rem; margin-right: .25rem; image-rendering: pixelated; vertical-align: text-bottom; }
    .panel-details { width: 100%; margin: .75rem 0; border: 1px solid; }
    .panel-details > summary { padding: .5rem; font-weight: bold; background: #eee; }
    .panel-details[open] > summary { border-bottom: 1px solid; }
    #map-legend-details > #map-legend { padding: 0 .5rem .5rem; }

    .player-state { border: 1px solid #2f2f2f; border-left: .45rem solid var(--player-color); background: #17191b; color: #f4f0dc; }
    .player-header { min-height: 2.25rem; padding: .48rem .55rem; overflow-x: auto; background: linear-gradient(#303438, #202326); }
    .player-summary { display: flex; align-items: baseline; gap: .38rem; margin: 0; white-space: nowrap; font-size: .92rem; line-height: 1.15; }
    .player-name { color: #fff; font-weight: 750; }
    .player-meta { color: #d1cbb6; font-size: .78rem; font-weight: 500; }
    .player-separator { color: #817d70; font-size: .75rem; font-weight: 400; }
    .economy-hud { width: 100%; table-layout: fixed; border-collapse: collapse; color: inherit; font-variant-numeric: tabular-nums; }
    .economy-hud caption { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .economy-hud th, .economy-hud td { height: 1.65rem; padding: .12rem .25rem; border-top: 1px solid #3b3e40; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .economy-hud thead th { height: 1.35rem; color: #d7d1bb; background: #222527; font-size: .68rem; font-weight: 600; letter-spacing: .02em; }
    .economy-hud thead th:first-child, .economy-hud tbody th { width: 4.4rem; text-align: left; }
    .economy-hud tbody th { color: #bdb7a3; background: #202326; font-size: .7rem; font-weight: 600; }
    .economy-hud td { background: #101214; font-size: .88rem; font-weight: 700; }
    .economy-hud .worker-total-cell { height: auto; min-height: 1.65rem; white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.05; }
    .economy-hud .worker-total-cell .worker-total-current,
    .economy-hud .worker-total-cell .worker-total-other { display: block; overflow: visible; text-overflow: clip; white-space: nowrap; }
    .economy-hud .worker-total-cell .worker-total-current { font-size: .88rem; line-height: 1; }
    .economy-hud .worker-total-cell .worker-total-other { margin-top: .08rem; color: #d7d1bb; font-size: .58rem; font-weight: 700; line-height: 1; }
    .economy-hud .worker-total-cell .worker-total-other[hidden] { display: none; }
    .economy-hud .resource-food { box-shadow: inset 0 .16rem #a75b3d; }
    .economy-hud .resource-wood { box-shadow: inset 0 .16rem #567b35; }
    .economy-hud .resource-gold { box-shadow: inset 0 .16rem #c49525; }
    .economy-hud .resource-stone { box-shadow: inset 0 .16rem #7a8188; }
    .player-details { min-width: 0; border-top: 1px solid #3b3e40; background: #202326; color: #f4f0dc; font-size: .76rem; }
    .player-details-body { padding: .35rem .5rem; }
    .player-icon-body { display: grid; grid-template-columns: 1.45rem minmax(0, 1fr); gap: .35rem; max-height: none; padding: .25rem .45rem .25rem .35rem; overflow: visible; }
    .player-side-heading { display: grid; place-items: center; align-self: stretch; min-width: 0; min-height: 0; margin: 0; padding: .08rem .1rem; border-right: 1px solid #3b3e40; color: #d7d1bb; background: #292d30; font-size: .6rem; font-weight: 700; line-height: 1; letter-spacing: 0; text-align: center; white-space: nowrap; writing-mode: vertical-rl; transform: rotate(180deg); }
    .player-icon-host { min-width: 0; min-height: 0; overflow: visible; line-height: 1.35; }
    .player-icon-host > .sprite-grid { min-width: 0; }
    .player-units-summary { margin: 0; line-height: 1.35; }
    .sprite-grid { display: flex; flex-wrap: wrap; gap: .18rem; margin: 0; padding: 0; list-style: none; overflow: visible; }
    .sprite-tile { position: relative; display: inline-grid; place-items: center; width: 1.85rem; height: 1.85rem; padding: .06rem; border: 1px solid #363a3c; border-radius: 3px; background: #101214; image-rendering: pixelated; cursor: pointer; }
    .sprite-tile:hover { border-color: #c9b66b; background: #171b1d; }
    .sprite-tile:focus { outline: 2px solid #f2d46f; outline-offset: 2px; }
    .sprite-tile:focus:not(:focus-visible) { outline: 0; }
    .sprite-tile img { display: block; max-width: 1.55rem; max-height: 1.55rem; object-fit: contain; image-rendering: pixelated; }
    .sprite-count { position: absolute; top: -.3rem; right: -.25rem; min-width: .95rem; padding: .02rem .13rem; border: 1px solid var(--player-color, #505456); border-radius: 999px; color: #fff; background: rgba(12, 14, 15, .92); font-size: .58rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: .95; text-align: center; text-shadow: 0 1px 0 #111; }
    .unit-stat-list { gap: .16rem; align-items: flex-start; overflow: visible; }
    .unit-count-tile { grid-template-columns: 2rem minmax(1.25rem, auto); align-items: center; justify-content: start; flex: 0 1 auto; width: auto; min-width: 3.65rem; max-width: 100%; height: 2.55rem; min-height: 0; padding: .12rem .2rem .12rem .12rem; gap: .14rem; overflow: hidden; }
    .unit-count-tile img { justify-self: center; width: 1.9rem; height: 1.9rem; max-width: 1.9rem; max-height: 1.9rem; }
    .unit-count-metrics { display: grid; grid-template-rows: repeat(3, minmax(.62rem, auto)); align-content: center; gap: .03rem; min-width: 0; }
    .unit-count-metric { display: block; min-width: 0; padding: 0; font-variant-numeric: tabular-nums; line-height: 1; }
    .unit-count-value { display: block; min-width: 1.25rem; color: #fff; font-size: .68rem; font-weight: 800; line-height: 1; text-align: right; overflow-wrap: anywhere; }
    .unit-count-metric-queued .unit-count-value { color: #fff4bd; }
    .unit-count-metric-built .unit-count-value { color: #d8edff; }
    .unit-stat-caveat { margin: .35rem 0 0; color: #aaa38f; font-size: .7rem; line-height: 1.25; }
    .sprite-name-label { position: fixed; z-index: 1000; max-width: min(16rem, calc(100vw - 1rem)); padding: .2rem .38rem; border: 1px solid #5c5642; border-radius: 3px; color: #fff8d7; background: rgba(13, 15, 16, .96); box-shadow: 0 2px 8px rgba(0, 0, 0, .35); font: 700 .72rem/1.15 sans-serif; text-align: center; overflow-wrap: anywhere; pointer-events: none; }
    #chat { width: 100%; padding-left: 1.5rem; }
    #chat li { margin: .4rem 0; padding-left: .4rem; border-left: .35rem solid var(--player-color); }
    #viewer-notice { width: 100%; margin: 0 0 .65rem; padding: .45rem .6rem; border: 1px solid #777; background: #f7f7f7; }
    #viewer-notice[data-state="error"] { border-color: #7f1d1d; color: #7f1d1d; background: #fff7f7; }
    .hud-sprite-frame { display: grid; place-items: center; width: 1.55rem; height: 1.55rem; }
    .unit-count-tile .hud-sprite-frame { justify-self: center; width: 1.9rem; height: 1.9rem; }
    .hud-sprite-frame img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
    .hud-sprite-fallback, .generated-marker { display: inline-grid; place-items: center; width: 1.15rem; height: 1.15rem; border: 1px solid currentColor; border-radius: 3px; color: #f4f0dc; background: #101214; font: 800 .62rem/1 sans-serif; text-align: center; }
    .unit-count-tile .hud-sprite-fallback { width: 1.55rem; height: 1.55rem; }
    .legend-category-icon.generated-marker { margin-right: .25rem; color: #111; background: #eee; }
    .party-sprite-image.generated-marker { grid-column: 1; justify-self: center; width: var(--sprite-size); height: var(--sprite-size); color: #fff; border-color: var(--player-color); background: rgba(12, 14, 15, .88); text-shadow: 0 1px 0 #111; filter: drop-shadow(0 0 1px #111) drop-shadow(0 0 2px var(--player-color)); }
    .party-sprite-task-marker.generated-marker { border-radius: 50%; color: #fff; border-color: var(--player-color); background: rgba(12, 14, 15, .9); font-size: calc(var(--task-marker-size) * .7); }
    @media (max-width: 50rem) {
      main { grid-template: min(48vh, 100vw) minmax(0, 1fr) / 100%; }
      #map-column { height: 100%; }
      #map-stack { width: min(100%, 48vh); height: 100%; }
      #detail-column { height: 100%; padding-bottom: calc(var(--timeline-height) + .75rem); }
      .node, .primitive { margin-left: .6rem; }
      dd { margin-left: 1rem; }
      .player-header { min-height: 2.25rem; }
      .economy-hud thead th:first-child, .economy-hud tbody th { width: 3.8rem; }
      .economy-hud th, .economy-hud td { padding-inline: .12rem; }
    }
  </style>
</head>
<body>
  <main>
    <section id="map-column" aria-label="Map">
      <div id="map-stack">
        <canvas id="map-canvas" aria-label="Terrain and elevation map"></canvas>
        <canvas id="resource-canvas" aria-label="Resource layer"></canvas>
        <canvas id="building-canvas" aria-label="Persistent building placement layer"></canvas>
        <canvas id="gameplay-canvas" aria-label="Character and command evidence layer"></canvas>
        <div id="sprite-overlay" aria-hidden="true"></div>
      </div>
    </section>
    <aside id="detail-column" aria-label="Replay details">
      <p id="viewer-notice" role="status">Waiting for generated replay data from the upload page.</p>
      <div id="timeline-players" aria-label="Player statistics"></div>
      <details id="map-legend-details" class="panel-details" open>
        <summary>Map legend</summary>
        <div id="map-legend" aria-label="Map legend"></div>
      </details>

      <section aria-labelledby="chat-heading">
        <h2 id="chat-heading">Chat</h2>
        <ol id="chat"></ol>
      </section>
    </aside>
    <section id="timeline-section" aria-label="Timeline">
      <div id="timeline-controls">
        <button id="timeline-play" type="button">Play</button>
        <button id="timeline-speed" type="button" aria-label="Playback speed: 30×. Activate for 4×.">30×</button>
        <button id="timeline-map-size" type="button" aria-label="Map size locked to viewport height">Map 1×</button>
        <input id="timeline-slider" type="range" min="0" value="0" step="any" aria-label="Match time">
        <output id="timeline-time" for="timeline-slider"></output>
      </div>
    </section>
  </main>
  <noscript>This viewer requires JavaScript and a same-origin upload page data payload.</noscript>
  <script>
    const main = document.querySelector('main');
    const viewerNotice = document.querySelector('#viewer-notice');
    const timelineSection = document.querySelector('#timeline-section');
    const timelinePlay = document.querySelector('#timeline-play');
    const timelineSpeed = document.querySelector('#timeline-speed');
    const timelineMapSize = document.querySelector('#timeline-map-size');
    const timelineSlider = document.querySelector('#timeline-slider');
    const timelineTime = document.querySelector('#timeline-time');
    const timelinePlayers = document.querySelector('#timeline-players');

    const mapStack = document.querySelector('#map-stack');
    const mapCanvas = document.querySelector('#map-canvas');
    const resourceCanvas = document.querySelector('#resource-canvas');
    const buildingCanvas = document.querySelector('#building-canvas');
    const gameplayCanvas = document.querySelector('#gameplay-canvas');
    const spriteOverlay = document.querySelector('#sprite-overlay');
    const mapLegendDetails = document.querySelector('#map-legend-details');
    const mapLegend = document.querySelector('#map-legend');

    const chat = document.querySelector('#chat');

    const viewerPayloadType = 'aoe-sim.dataview.generated-payload.v1';
    const viewerReadyType = 'aoe-sim.dataview.viewer-ready.v1';
    const viewerShellScrollRequestType = 'aoe-sim.dataview.shell-scroll-request.v1';
    const viewerShellScrollStateType = 'aoe-sim.dataview.shell-scroll-state.v1';
    const viewerRequiredOutputNames = Object.freeze(['game.json', 'schemas.json', 'lifetimes.json', 'economy.json', 'resource_estimates.json', 'unit_stats.json']);
    const viewerOptionalOutputNames = Object.freeze([]);
    const viewerOutputNames = Object.freeze([...viewerRequiredOutputNames, ...viewerOptionalOutputNames]);
    const viewerHandshake = parseViewerHandshake();
    let shellScrollTop = 0;
    let shellScrollMax = 0;
    const maxViewerJsonBytes = 96 * 1024 * 1024;
    const maxViewerTotalJsonBytes = 192 * 1024 * 1024;
    const townCenterAssetBasePath = 'https://raw.githubusercontent.com/TimMikeladze/towncenter/8e42a41642b9bdd697037f9ec6a7e975537fb3b0/public/img/';
    const townCenterMissingAsset = '';
    const categoryDefinitions = Object.freeze([
      { key: 'villagers', label: 'Villagers', shortLabel: 'V', symbol: 'V', asset: null },
      { key: 'ranged', label: 'Archery / ranged', shortLabel: 'Bow', symbol: 'B', asset: null },
      { key: 'infantry', label: 'Barracks / infantry', shortLabel: 'Sword', symbol: 'S', asset: null },
      { key: 'cavalry', label: 'Cavalry', shortLabel: 'Cav', symbol: 'C', asset: null },
      { key: 'siege', label: 'Siege', shortLabel: 'Gear', symbol: 'G', asset: null },
    ]);
    const categoryByKey = new Map(categoryDefinitions.map((definition) => [definition.key, definition]));
    const mapSpriteDefinitions = Object.freeze([
      { key: 'villagers', label: 'Villagers', symbol: 'V' },
      { key: 'archer', label: 'Archers / foot ranged', symbol: 'Ar' },
      { key: 'spear', label: 'Spear infantry', symbol: 'Sp' },
      { key: 'swordsman', label: 'Swordsmen / infantry', symbol: 'Sw' },
      { key: 'camel', label: 'Camels', symbol: 'Ca' },
      { key: 'knight', label: 'Knights / heavy cavalry', symbol: 'Kn' },
      { key: 'cavalryArcher', label: 'Cavalry archers / mounted ranged', symbol: 'CA' },
      { key: 'scout', label: 'Scouts / light cavalry', symbol: 'Sc' },
      { key: 'elephant', label: 'Elephants', symbol: 'El' },
      { key: 'priest', label: 'Monks / priests', symbol: 'Mo' },
      { key: 'scorpion', label: 'Scorpions', symbol: 'Scp' },
      { key: 'catapult', label: 'Catapults / siege engines', symbol: 'Ct' },
    ]);
    const mapSpriteByKey = new Map(mapSpriteDefinitions.map((definition) => [definition.key, definition]));
    const mapSpriteSymbols = new Map(mapSpriteDefinitions.map((definition) => [definition.key, definition.symbol]));
    const mapSpriteUnitCategories = Object.freeze(new Map([
      ['villagers', 'villagers'],
      ['archer', 'ranged'],
      ['cavalryArcher', 'ranged'],
      ['spear', 'infantry'],
      ['swordsman', 'infantry'],
      ['camel', 'cavalry'],
      ['knight', 'cavalry'],
      ['scout', 'cavalry'],
      ['elephant', 'cavalry'],
      ['scorpion', 'siege'],
      ['catapult', 'siege'],
    ]));
    const villagerTaskMarkerDefinitions = Object.freeze({
      food: Object.freeze({ key: 'food', label: 'food gather', symbol: 'F', asset: null }),
      wood: Object.freeze({ key: 'wood', label: 'wood gather', symbol: 'W', asset: null }),
      gold: Object.freeze({ key: 'gold', label: 'gold gather', symbol: 'G', asset: null }),
      stone: Object.freeze({ key: 'stone', label: 'stone gather', symbol: 'S', asset: null }),
      gather: Object.freeze({ key: 'gather', label: 'unresolved gather', symbol: '?', asset: null }),
      build: Object.freeze({ key: 'build', label: 'build', symbol: 'B', asset: null }),
      repair: Object.freeze({ key: 'repair', label: 'repair', symbol: 'R', asset: null }),
    });
    const villagerWorkAnimationDefinitions = Object.freeze({
      food: Object.freeze({ key: 'food', label: 'food gathering marker', asset: null }),
      wood: Object.freeze({ key: 'wood', label: 'wood cutting marker', asset: null }),
      gold: Object.freeze({ key: 'gold', label: 'gold mining marker', asset: null }),
      stone: Object.freeze({ key: 'stone', label: 'stone mining marker', asset: null }),
      build: Object.freeze({ key: 'build', label: 'building marker', asset: null }),
      repair: Object.freeze({ key: 'repair', label: 'repair marker', asset: null }),
    });
    const partySpriteAssets = Object.freeze({
      move: Object.freeze({}),
      attack: Object.freeze({}),
      gather: Object.freeze({}),
      build: Object.freeze({}),
      repair: Object.freeze({}),
    });
    // Sparse replay commands do not confirm exact construction completion.
    // These constants only drive an estimated post-build worker phase.
    const estimatedBuildCompletionPolicy = Object.freeze({
      villagerBaseSpeedTilesPerSecond: .8,
      baseBuildSecondsByBuilding: Object.freeze({
        Farm: 15,
        'Lumber Camp': 35,
        'Mining Camp': 35,
      }),
      miningResourceRadiusTiles: 4,
      miningResourceTieTiles: .5,
    });

    function estimatedConstructionDurationSeconds(baseBuildSeconds, builderCount) {
      const builders = Math.max(1, Math.floor(Number(builderCount) || 0));
      return Number(baseBuildSeconds) * 3 / (builders + 2);
    }

    function numericId(value) {
      if (value === null || value === undefined || String(value).trim() === '') return null;
      const number = Number(value);
      return Number.isInteger(number) ? number : null;
    }

    function townCenterAssetPath(kind, filename) {
      return `${townCenterAssetBasePath}${kind}/${filename}.webp`;
    }

    const townCenterUnitVisualKeyOverrides = Object.freeze(new Map([
      [293, '125_293'],
    ]));

    function townCenterUnitAssetPath(unitId) {
      const id = numericId(unitId);
      return id === null ? townCenterMissingAsset : townCenterAssetPath('Units', townCenterUnitVisualKeyOverrides.get(id) ?? id);
    }

    function townCenterTechAssetPath(technologyId) {
      const id = numericId(technologyId);
      return id === null ? townCenterMissingAsset : townCenterAssetPath('Techs', id);
    }

    function townCenterAgeAssetPath(technology) {
      const normalized = normalizedLookupName(technology?.name ?? technology?.label ?? technology?.source_label);
      const age = String(technology?.age ?? '').toUpperCase();
      const hasAgeIntent = /\b(age|advance|uptime)\b/.test(normalized) || !normalized;
      if (/\bfeudal age\b/.test(normalized) || normalized === 'feudal' || (hasAgeIntent && age === 'FEUDAL_AGE')) return townCenterAssetPath('Ages', 'feudal_age_de');

    function typeName(value, showCounts = true) {

        return showCounts ? `Object (${Object.keys(value).length} keys)` : 'Object';

    function renderNode(label, value, options = {}) {

        open = false,
        expandDescendants = false,
        showCounts = true,

        const line = document.createElement('div');
        line.className = 'primitive';

        key.textContent = `${label}: `;

      const node = document.createElement('details');
      node.className = 'node';
      const heading = document.createElement('summary');
      heading.textContent = `${label} — ${typeName(value, showCounts)}`;
      node.append(heading);

      let rendered = false;
      function renderChildren() {
        if (rendered) return;
        rendered = true;
        const children = document.createDocumentFragment();
        const entries = Array.isArray(value)
          ? value.map((item, index) => [`[${index}]`, item])
          : Object.entries(value);
        if (entries.length === 0) {

          empty.className = 'primitive';
          empty.textContent = Array.isArray(value) ? '[]' : '{}';
          children.append(empty);
        } else {
          entries.forEach(([key, item]) => children.append(renderNode(key, item, {
            open: expandDescendants,
            expandDescendants,
            showCounts,
          })));
        }
        node.append(children);

    function timestampSeconds(timestamp) {

      const minutes = Math.floor(milliseconds % 3600000 / 60000);
      const wholeSeconds = Math.floor(milliseconds % 60000 / 1000);
      const remainder = milliseconds % 1000;
      return `${hours}:${String(minutes).padStart(2, '0')}:${String(wholeSeconds).padStart(2, '0')}.${String(remainder).padStart(3, '0')}`;

    function normalizedObjectId(instanceId) {
      const value = Number(instanceId);

    function classifyUnitCategory({ name = '', stats = null, worker = false } = {}) {
      if (worker || unitNameMatches(name, /\bvillager\b/)) return 'villagers';
      if (unitNameMatches(name, /\b(ram|mangonel|onager|scorpion|trebuchet|bombard cannon|siege|ballista|houfnice)\b/)) return 'siege';
      if (unitNameMatches(name, /\b(archer|skirmisher|crossbow|bowman|longbow|chu ko nu|hand cannoneer|janissary|slinger|plumed|rattan|genoese|kipchak|mangudai|cavalry archer|camel archer|elephant archer|conquistador|arambai|genitour|ratha)\b/)) return 'ranged';
      if (unitNameMatches(name, /\b(cavalry|knight|cavalier|paladin|hussar|camel|elephant|lancer|tarkan|cataphract|keshik|leitis|boyar|konnik|magyar huszar|coustillier|shrivamsha|centurion)\b/)) return 'cavalry';
      if (unitNameMatches(name, /\b(militia|man-at-arms|swordsman|champion|spearman|pikeman|halb|eagle|huskarl|samurai|teutonic|woad|berserk|jaguar|condottiero|karambit|kamayuk|gbeto|serjeant|obuch|legionary|throwing axeman)\b/)) return 'infantry';

      const attackAmount = Number(stats?.attack?.amount ?? 0);
      const maxRange = Number(stats?.max_range ?? 0);
      const minRange = Number(stats?.min_range ?? 0);
      const pierceArmor = Number(stats?.pierce_armor ?? 0);
      const speed = Number(stats?.speed ?? 0);
      const hp = Number(stats?.hp ?? 0);
      if (attackAmount > 0 && (pierceArmor >= 50 || (minRange >= 2 && speed <= .85))) return 'siege';
      if (attackAmount > 0 && maxRange > 0) return 'ranged';
      if (attackAmount > 0 && speed >= 1.15 && hp >= 40) return 'cavalry';
      if (attackAmount > 0 && speed >= .7) return 'infantry';
      return null;
    }

    function resolveMapSpriteKey({ name = '', stats = null, category = null, worker = false } = {}) {
      const normalized = normalizedLookupName(name);
      const has = (pattern) => pattern.test(normalized);
      if (worker || has(/\bvillager\b/)) return 'villagers';
      if (has(/\belephant archer\b/)) return 'elephant';
      if (has(/\b(war elephant|battle elephant|ballista elephant|armored elephant|siege elephant|elephant)\b/)) return 'elephant';
      if (has(/\b(cavalry archer|camel archer|conquistador|arambai|mangudai|kipchak|genitour|ratha|mounted ranged)\b/)) return 'cavalryArcher';
      if (has(/\b(spearman|pikeman|halberdier|halb|kamayuk)\b/)) return 'spear';
      if (has(/\b(militia|man at arms|long swordsman|two handed swordsman|swordsman|champion|condottiero|legionary|serjeant|samurai|teutonic knight|woad raider|berserk|jaguar warrior|huskarl|karambit warrior|gbeto|obuch|throwing axeman|eagle warrior)\b/)) return 'swordsman';
      if (has(/\b(scout cavalry|light cavalry|hussar|magyar huszar|steppe scout)\b/)) return 'scout';
      if (has(/\b(camel|mameluke)\b/)) return 'camel';
      if (has(/\b(knight|cavalier|paladin|cataphract|boyar|keshik|leitis|konnik|coustillier|lancer|shrivamsha|centurion|tarkan)\b/)) return 'knight';
      if (has(/\b(scorpion)\b/)) return 'scorpion';
      if (has(/\b(mangonel|onager|catapult|trebuchet|bombard cannon|houfnice|ram|siege ram|capped ram)\b/)) return 'catapult';
      if (has(/\b(monk|priest|missionary)\b/)) return 'priest';
      if (has(/\b(archer|skirmisher|crossbow|bowman|longbow|chu ko nu|hand cannoneer|janissary|slinger|plumed|rattan|genoese|organ gun)\b/)) return 'archer';
      const resolvedCategory = category ?? classifyUnitCategory({ name, stats, worker });
      if (resolvedCategory === 'villagers') return 'villagers';
      if (resolvedCategory === 'ranged') return 'archer';
      if (resolvedCategory === 'infantry') return 'swordsman';

    function resolveTechnologyHudSprite(technology) {

    function generatedMarker(className, text, title = '') {

    function createHudSpriteImage(src) {

      fallback.className = 'hud-sprite-fallback';
      fallback.textContent = '?';

      image.src = src;

    function cachedHudSpriteImage(cache, renderClaims, cacheKey, createImage) {
      const claimIndex = renderClaims.get(cacheKey) ?? 0;
      renderClaims.set(cacheKey, claimIndex + 1);
      let images = cache.get(cacheKey);
      if (!images) {
        images = [];
        cache.set(cacheKey, images);
      }
      if (!images[claimIndex]) images[claimIndex] = createImage();
      return images[claimIndex];

    const spriteTileNameLabel = (() => {
      const selector = '.sprite-tile[data-item-name]';
      const margin = 8;
      const gap = 6;
      let label = null;
      let hoveredTile = null;
      let focusedTile = null;
      let pinnedTile = null;
      let visibleTile = null;
      let interactionSequence = 0;
      let hoveredAt = 0;
      let focusedAt = 0;

        if (label) return label;

        label.className = 'sprite-name-label';
        label.setAttribute('aria-hidden', 'true');
        label.hidden = true;
        document.body.append(label);

        return event.target instanceof Element ? event.target.closest(selector) : null;
      }

      function relatedTarget(event) {
        return event.relatedTarget instanceof Node ? event.relatedTarget : null;
      }

      function isUsableTile(tile) {
        if (!tile || !tile.isConnected || !tile.matches(selector) || !tile.dataset.itemName) return false;
        if (tile.closest('details:not([open])')) return false;
        return tile.getClientRects().length > 0;
      }

      function clearStaleTiles() {
        if (!isUsableTile(hoveredTile)) {
          hoveredTile = null;
          hoveredAt = 0;
        }
        if (!isUsableTile(focusedTile)) {
          focusedTile = null;
          focusedAt = 0;
        }
        if (!isUsableTile(pinnedTile)) {
          pinnedTile = null;
          pinnedAt = 0;
        }
      }

      function hideLabel() {
        visibleTile = null;
        if (label) label.hidden = true;
      }

      function positionLabel(tile) {
        if (!isUsableTile(tile)) {
          hideLabel();
          return;
        }
        const node = ensureLabel();
        const rect = tile.getBoundingClientRect();
        node.textContent = tile.dataset.itemName;
        node.hidden = false;
        node.style.left = '0px';
        node.style.top = '0px';
        node.style.visibility = 'hidden';

        const labelRect = node.getBoundingClientRect();
        const maxLeft = Math.max(margin, window.innerWidth - labelRect.width - margin);
        const maxTop = Math.max(margin, window.innerHeight - labelRect.height - margin);
        const preferredTop = rect.top - labelRect.height - gap;
        const fallbackTop = rect.bottom + gap;
        const unclampedTop = preferredTop >= margin ? preferredTop : fallbackTop;
        const left = Math.min(Math.max(rect.left + rect.width / 2 - labelRect.width / 2, margin), maxLeft);
        const top = Math.min(Math.max(unclampedTop, margin), maxTop);

        node.style.left = `${left}px`;
        node.style.top = `${top}px`;
        node.style.visibility = 'visible';
        visibleTile = tile;
      }

      function showCurrent() {
        clearStaleTiles();
        const tile = [
          { tile: hoveredTile, at: hoveredAt },
          { tile: focusedTile, at: focusedAt },
          { tile: pinnedTile, at: pinnedAt },
        ]
          .filter((entry) => entry.tile)
          .sort((a, b) => b.at - a.at)[0]?.tile ?? null;
        if (tile) {
          positionLabel(tile);
        } else {
          hideLabel();
        }
      }

      function dismiss() {
        hoveredTile = null;
        focusedTile = null;
        pinnedTile = null;
        hoveredAt = 0;
        focusedAt = 0;
        pinnedAt = 0;
        hideLabel();
      }

      function dismissWithin(root) {
        if (!root) return;
        const trackedTiles = [hoveredTile, focusedTile, pinnedTile, visibleTile];
        if (trackedTiles.some((tile) => tile && root.contains(tile))) dismiss();
      }

      document.addEventListener('pointerover', (event) => {
        const tile = eventTile(event);
        const related = relatedTarget(event);
        if (!tile || (related && tile.contains(related))) return;
        hoveredTile = tile;
        hoveredAt = ++interactionSequence;
        showCurrent();
      });

      document.addEventListener('pointerout', (event) => {
        const tile = eventTile(event);
        const related = relatedTarget(event);
        if (!tile || (related && tile.contains(related))) return;
        if (hoveredTile === tile) {
          hoveredTile = null;
          hoveredAt = 0;
        }
        showCurrent();
      });

      document.addEventListener('focusin', (event) => {
        const tile = eventTile(event);
        if (!tile) return;
        focusedTile = tile;
        focusedAt = ++interactionSequence;
        showCurrent();
      });

      document.addEventListener('focusout', (event) => {
        const tile = eventTile(event);
        const related = relatedTarget(event);
        if (!tile || (related && tile.contains(related))) return;
        if (focusedTile === tile) {
          focusedTile = null;
          focusedAt = 0;
        }
        showCurrent();
      });

      document.addEventListener('click', (event) => {
        const tile = eventTile(event);
        if (!tile) {
          dismiss();
          return;
        }
        pinnedTile = tile;
        pinnedAt = ++interactionSequence;
        showCurrent();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          dismiss();
          return;
        }
        const tile = eventTile(event);
        if (!tile || !['Enter', ' '].includes(event.key)) return;

        pinnedTile = tile;
        focusedTile = tile;
        pinnedAt = ++interactionSequence;
        focusedAt = pinnedAt;
        showCurrent();

      document.addEventListener('toggle', (event) => {
        if (event.target instanceof HTMLDetailsElement && !event.target.open) {
          dismissWithin(event.target);

        if (visibleTile) showCurrent();
      });

      return {
        configure(tile, itemName) {

          tile.tabIndex = 0;
          tile.setAttribute('role', 'button');

    function latestAt(rows, seconds) {
      let latest = null;
      for (const row of rows) {
        if (row.seconds > seconds) break;
        latest = row;
      }
      return latest;
    }

    function formatResourceValue(value) {
      if (!Number.isFinite(Number(value))) return 'n/a';
      const number = Number(value);
      return Math.abs(number) >= 10 ? String(Math.round(number)) : number.toFixed(1).replace(/\.0$/, '');
    }

    function formatEstimateRange(sample, resource) {
      const central = sample?.central?.[resource];
      const range = sample?.likely_ranges?.[resource];
      if (!range || !Number.isFinite(Number(range.low)) || !Number.isFinite(Number(range.high))) {
        return formatResourceValue(central);
      }
      const value = formatResourceValue(central);
      const low = formatResourceValue(range.low);
      const high = formatResourceValue(range.high);
      return low === high ? value : `${value} [${low}-${high}]`;
    }

    function formatStatNumber(value, digits = 2) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '—';
      if (Number.isInteger(number)) return String(number);
      return number.toFixed(digits).replace(/0+$/, '').replace(/\.$/, '');
    }

    function statScalar(stats, field) {
      if (field === 'attack') return stats?.attack?.amount;

    function rangeText(stats) {
      const max = statScalar(stats, 'max_range');
      const min = statScalar(stats, 'min_range');
      if (Number(min) > 0) return `${formatStatNumber(min)}-${formatStatNumber(max)}`;
      return formatStatNumber(max);
    }

    function armorText(stats) {
      return `${formatStatNumber(statScalar(stats, 'melee_armor'))}/${formatStatNumber(statScalar(stats, 'pierce_armor'))}`;
    }

    function statChanged(baseStats, stats, field) {
      if (field === 'armor') return armorText(baseStats) !== armorText(stats);
      if (field === 'range') return rangeText(baseStats) !== rangeText(stats);
      return formatStatNumber(statScalar(baseStats, field)) !== formatStatNumber(statScalar(stats, field));

    function snapshotUnit(snapshot, unitId) {
      return snapshot?.units?.find((unit) => unit.unit_id === unitId) ?? null;

    function unitLineTitle(unit, playerUnitStats, snapshot, caveat) {
      const stats = snapshotUnit(snapshot, unit.unit_id)?.stats;
      const baseStats = playerUnitStats?.units?.[String(unit.unit_id)]?.base_stats;
      const parts = [
        `${unit.name} (${unitIdentityText(unit)}).`,
        `Total built/produced estimate: ${unit.produced}; this is economy.unit_completions production intent and excludes starting units.`,
        `Queued estimate: ${unit.queued} active queue intent remaining after estimated completions and observed unqueue commands.`,
        `Current map-position estimate: ${unit.currentMapEstimate}; counted from active, deduplicated map party-strip actors for this line.`,
        unit.currentMapEvidenceTitle,
        unit.title,
        unit.mapPositionNote,
        unitSpriteTitle(unit),
      ];
      if (stats && baseStats) {
        const statParts = [
          ['HP', formatStatNumber(statScalar(stats, 'hp')), formatStatNumber(statScalar(baseStats, 'hp')), statChanged(baseStats, stats, 'hp'), ''],
          ['Atk', formatStatNumber(statScalar(stats, 'attack')), formatStatNumber(statScalar(baseStats, 'attack')), statChanged(baseStats, stats, 'attack'), stats.attack?.kind ? `${stats.attack.kind} class ${stats.attack.class}` : ''],
          ['Arm', armorText(stats), armorText(baseStats), statChanged(baseStats, stats, 'armor'), 'melee/pierce'],
          ['Range', rangeText(stats), rangeText(baseStats), statChanged(baseStats, stats, 'range'), 'min-max when a minimum range exists'],
          ['Spd', formatStatNumber(statScalar(stats, 'speed')), formatStatNumber(statScalar(baseStats, 'speed')), statChanged(baseStats, stats, 'speed'), ''],
          ['LoS', formatStatNumber(statScalar(stats, 'line_of_sight')), formatStatNumber(statScalar(baseStats, 'line_of_sight')), statChanged(baseStats, stats, 'line_of_sight'), ''],
          ['Rld', formatStatNumber(statScalar(stats, 'reload_time')), formatStatNumber(statScalar(baseStats, 'reload_time')), statChanged(baseStats, stats, 'reload_time'), ''],
        ].map(([label, value, baseValue, changed, detail]) =>
          changed
            ? `${label}: base ${baseValue}, effective ${value}${detail ? ` (${detail})` : ''}`
            : `${label}: ${value}${detail ? ` (${detail})` : ''}`);
        parts.push(`Current stats: ${statParts.join('; ')}.`);

        list.append(item);
      });
      container.append(list);
      container.title = caveat;
    }

    function unitSummaryAccessibleDescription(producedTotal, queuedTotal, currentMapTotal) {
      return `Total built/produced ${producedTotal}, queued ${queuedTotal}, current map-position estimate ${currentMapTotal}. Units show total built/produced intent, queued estimate, and current map-position estimate. Total built/produced excludes starting units. Current map-position counts only classified actors represented by active map party sprite strips; absent or stale positions are position-unknown, not confirmed dead, and this is not a complete army population.`;
    }

    const technologyLinePatterns = Object.freeze([
      ['age', /\b(feudal age|castle age|imperial age)\b/],
      ['eco:lumber', /\b(double bit axe|bow saw|two man saw)\b/],
      ['eco:farm', /\b(horse collar|heavy plow|crop rotation)\b/],
      ['eco:cart', /\b(wheelbarrow|hand cart)\b/],
      ['eco:gold', /\b(gold mining|gold shaft mining)\b/],
      ['eco:stone', /\b(stone mining|stone shaft mining)\b/],
      ['vision:town', /\b(town watch|town patrol)\b/],
      ['blacksmith:ranged-attack', /\b(fletching|bodkin arrow|bracer)\b/],
      ['blacksmith:ranged-armor', /\b(padded archer armor|leather archer armor|ring archer armor)\b/],
      ['blacksmith:melee-attack', /\b(forging|iron casting|blast furnace)\b/],
      ['blacksmith:infantry-armor', /\b(scale mail armor|chain mail armor|plate mail armor)\b/],
      ['blacksmith:cavalry-armor', /\b(scale barding armor|chain barding armor|plate barding armor)\b/],
      ['unit:militia', /\b(man at arms|long swordsman|two handed swordsman|champion)\b/],
      ['unit:spear', /\b(pikeman|halberdier)\b/],
      ['unit:scout', /\b(light cavalry|hussar|magyar huszar)\b/],
      ['unit:knight', /\b(cavalier|paladin)\b/],
      ['unit:mangonel', /\b(onager|siege onager)\b/],
      ['unit:ram', /\b(capped ram|siege ram)\b/],
      ['unit:skirmisher', /\b(skirmisher|imperial skirmisher)\b/],
      ['unit:genoese-crossbowman', /\bgenoese crossbowman\b/],
    ]);

    function technologyLineKey(technology) {
      const normalized = normalizedLookupName(technology?.name);
      const matched = technologyLinePatterns.find(([, pattern]) => pattern.test(normalized));
      if (matched) return matched[0];
      const upgradeTarget = technology?.unit_upgrades?.[0]?.target_unit_id;
      if (Number.isInteger(upgradeTarget)) return `unit-upgrade:${upgradeTarget}`;
      return Number.isInteger(technology?.technology_id)
        ? `tech:${technology.technology_id}`
        : `tech-name:${normalized}`;
    }

    function topTechnologyLines(technologies) {
      const byLine = new Map();
      technologies
        .filter((technology) => technology.name && !technology.source?.startsWith('civilization_hidden'))
        .forEach((technology) => {
          const key = technologyLineKey(technology);
          const prior = byLine.get(key);
          if (!prior || technology.time >= prior.time) byLine.set(key, technology);
        });
      return [...byLine.values()].sort((a, b) => a.time - b.time || a.name.localeCompare(b.name));
    }

    function renderTechnologyGrid(container, technologies, imageCache) {
      spriteTileNameLabel.dismissWithin(container);
      container.replaceChildren();
      if (!technologies.length) {
        container.textContent = 'None yet';
        container.title = 'No visible completed technologies yet.';
        return;
      }
      const list = document.createElement('ul');
      list.className = 'sprite-grid technology-list';
      const imageClaims = new Map();
      technologies.forEach((technology) => {
        const item = document.createElement('li');
        item.className = 'sprite-tile';
        spriteTileNameLabel.configure(item, technology.name);
        const cacheKey = `tech:${technology.technology_id ?? technologyLineKey(technology)}:${technology.name}:${technology.time}`;
        const image = cachedHudSpriteImage(imageCache, imageClaims, cacheKey, () =>
          createHudSpriteImage(resolveTechnologyHudSprite(technology)));
        item.title = `${technology.name}: completed by ${formatDuration(technology.time)}.`;
        item.setAttribute('aria-label', `${technology.name}, completed by ${formatDuration(technology.time)}.`);
        item.append(image);
        list.append(item);
      });
      container.append(list);
      container.title = 'Showing only the highest completed technology in each conservative upgrade line.';
    }

    function dedupeAdjacentInputRows(rows, identityForRow) {
      const sortedRows = rows
        .map((row) => ({ ...row, time: timestampSeconds(row.timestamp) }))
        .sort((a, b) => a.time - b.time || (a.payload?.sequence ?? 0) - (b.payload?.sequence ?? 0));
      const deduped = [];
      const lastByIdentity = new Map();
      sortedRows.forEach((row) => {
        const identity = identityForRow(row);
        const prior = lastByIdentity.get(identity);
        if (prior && row.time - prior.time <= 1) return;
        deduped.push(row);
        lastByIdentity.set(identity, row);
      });
      return deduped;
    }

    function inputSourceIds(row) {
      return uniqueNormalizedIds(row.payload?.object_ids).sort((a, b) => a - b);
    }

    function resolveUnitLineIdentity(row, statSnapshot, playerUnitStats) {
      const sourceValue = row.unitId ?? row.unit_id ?? row.object_id;
      const sourceUnitId = Number(sourceValue);
      const resolvedUnitId = Number(statSnapshot?.resolved_unit_ids?.[String(sourceUnitId)] ?? sourceUnitId);
      const resolvedUnit = Number.isInteger(resolvedUnitId) ? snapshotUnit(statSnapshot, resolvedUnitId) : null;
      const unitRecord = Number.isInteger(resolvedUnitId)
        ? playerUnitStats?.units?.[String(resolvedUnitId)]
        : null;
      const sourceRecord = Number.isInteger(sourceUnitId)
        ? playerUnitStats?.units?.[String(sourceUnitId)]
        : null;
      const name = resolvedUnit?.name ?? unitRecord?.name ?? sourceRecord?.name ?? row.name ?? 'Unit';
      const stats = resolvedUnit?.stats ?? unitRecord?.base_stats ?? sourceRecord?.base_stats ?? null;
      const category = classifyUnitCategory({ name, stats, worker: name === 'Villager' });
      return {
        key: Number.isInteger(resolvedUnitId) ? `unit:${resolvedUnitId}` : `unit-name:${name}`,
        unit_id: Number.isInteger(resolvedUnitId) ? resolvedUnitId : null,
        sourceUnitId: Number.isInteger(sourceUnitId) ? sourceUnitId : null,
        name,
        category,
      };
    }

    function categorySortValue(category) {
      const index = categoryDefinitions.findIndex((definition) => definition.key === category);
      return index === -1 ? categoryDefinitions.length : index;
    }

    function createProductionTracker(game, economy) {
      function queueIdentity(row) {
        const payload = row.payload ?? {};
        return [
          row.player,
          row.type,
          payload.unit_id ?? '',
          payload.unit ?? row.param ?? '',
          payload.amount ?? 1,
          inputSourceIds(row).join(','),
        ].join(':');
      }

      function unqueueIdentity(row) {
        const payload = row.payload ?? {};
        return [
          row.player,
          row.type,
          payload.order_id ?? '',
          payload.slot_id ?? '',
          inputSourceIds(row).join(','),
        ].join(':');
      }

      const queueEvents = dedupeAdjacentInputRows(
        game.match.inputs.filter((row) => row.type === 'Queue'),
        queueIdentity,
      ).map((row) => {
        const sourceIds = inputSourceIds(row);
        const payload = row.payload ?? {};
        return {
          time: row.time,
          player: row.player,
          sourceIds,
          unitId: Number.isInteger(payload.unit_id) ? payload.unit_id : null,
          name: payload.unit ?? row.param ?? 'Unit',
          amount: Math.max(1, Number(payload.amount) || 1),
        };
      });

      const unqueueEvents = dedupeAdjacentInputRows(
        game.match.inputs.filter((row) => row.type === 'Unqueue'),
        unqueueIdentity,
      ).map((row) => ({
        time: row.time,
        player: row.player,
        sourceIds: inputSourceIds(row),
      }));

      function sourceIdsIntersect(first, second) {
        if (!first.length || !second.length) return true;
        const lookup = new Set(first);
        return second.some((id) => lookup.has(id));
      }

      function decrementEntry(entries, count, predicate, preferLatest = false) {
        let remaining = count;
        const candidates = entries
          .map((entry, index) => ({ entry, index }))
          .filter(({ entry }) => entry.remaining > 0 && predicate(entry))
          .sort((a, b) => preferLatest
            ? b.entry.time - a.entry.time || b.index - a.index
            : a.entry.time - b.entry.time || a.index - b.index);
        for (const { entry } of candidates) {
          if (remaining <= 0) break;
          const deduction = Math.min(entry.remaining, remaining);
          entry.remaining -= deduction;
          remaining -= deduction;
        }
        return count - remaining;
      }

      function sourceUnitLabel(item, playerUnitStats) {
        if (!Number.isInteger(item.sourceUnitId)) return item.name;
        const sourceName = playerUnitStats?.units?.[String(item.sourceUnitId)]?.name ?? item.name;
        return `${sourceName} #${item.sourceUnitId}`;
      }

      function addUnitRow(rowMap, item, playerUnitStats, produced = 0, queued = 0, note = '') {
        const key = item.key;
        const row = rowMap.get(key) ?? {
          itemKey: item.key,
          unit_id: item.unit_id,
          name: item.name,
          category: item.category,
          produced: 0,
          queued: 0,
          starting: 0,
          sourceCounts: new Map(),
          queueSourceIds: new Set(),
          notes: new Set(),
        };
        row.produced += produced;
        row.queued += queued;
        if (produced > 0) {
          const sourceLabel = sourceUnitLabel(item, playerUnitStats);
          row.sourceCounts.set(sourceLabel, (row.sourceCounts.get(sourceLabel) ?? 0) + produced);
        }
        if (queued > 0 && Number.isInteger(item.sourceUnitId)) row.queueSourceIds.add(item.sourceUnitId);
        if (note) row.notes.add(note);
        rowMap.set(key, row);
      }

      function activeQueueRows(player, seconds, statSnapshot, playerUnitStats) {
        const entries = [];
        const timeline = [
          ...queueEvents
            .filter((event) => event.player === player && event.time <= seconds)
            .map((event) => ({ phase: 0, type: 'queue', event })),
          ...unqueueEvents
            .filter((event) => event.player === player && event.time <= seconds)
            .map((event) => ({ phase: 1, type: 'unqueue', event })),
          ...economy.unit_completions
            .filter((event) => event.player === player && event.time <= seconds)
            .map((event) => ({ phase: 2, type: 'completion', event })),
        ].sort((a, b) => a.event.time - b.event.time || a.phase - b.phase);

        let conservativeUnqueueDeductions = 0;
        timeline.forEach(({ type, event }) => {
          if (type === 'queue') {
            const item = resolveUnitLineIdentity(event, statSnapshot, playerUnitStats);
            entries.push({
              time: event.time,
              remaining: event.amount,
              sourceIds: event.sourceIds,
              sourceUnitId: item.sourceUnitId,
              item,
            });
            return;
          }
          if (type === 'completion') {
            const item = resolveUnitLineIdentity(event, statSnapshot, playerUnitStats);
            const producerId = normalizedObjectId(event.producer_id);
            for (let index = 0; index < event.count; index += 1) {
              const exact = decrementEntry(entries, 1, (entry) =>
                entry.sourceUnitId === item.sourceUnitId
                  && (producerId === null || !entry.sourceIds.length || entry.sourceIds.includes(producerId)));
              if (exact) continue;
              decrementEntry(entries, 1, (entry) => entry.item.key === item.key);
            }
            return;
          }
          const deducted = decrementEntry(entries, 1, (entry) =>
            sourceIdsIntersect(entry.sourceIds, event.sourceIds), true);
          conservativeUnqueueDeductions += deducted;
        });

        return {
          entries: entries.filter((entry) => entry.remaining > 0),
          conservativeUnqueueDeductions,
        };
      }

      function unitSummaryForPlayer(player, seconds, statSnapshot, playerUnitStats) {
        const rowMap = new Map();
        economy.unit_completions
          .filter((event) => event.player === player && event.time <= seconds)
          .forEach((event) => {
            const item = resolveUnitLineIdentity(event, statSnapshot, playerUnitStats);
            addUnitRow(rowMap, item, playerUnitStats, event.count, 0, 'Built count is the existing production-intent estimate.');
          });

        const queueState = activeQueueRows(player, seconds, statSnapshot, playerUnitStats);
        queueState.entries.forEach((entry) => {
          addUnitRow(
            rowMap,
            entry.item,
            playerUnitStats,
            0,
            entry.remaining,
            'Queued count is evidence-based and reduced by estimated completions and observed unqueue commands.',
          );
        });

        const rows = [...rowMap.values()]
          .filter((row) => row.produced > 0 || row.queued > 0)
          .map((row) => {
            const sources = [...row.sourceCounts.entries()]
              .sort((a, b) => a[0].localeCompare(b[0]))
              .map(([name, count]) => `${name}: ${count}`)
              .join(', ');
            const queueSourceIds = [...row.queueSourceIds].sort((a, b) => a - b).join(', ');
            return {
              ...row,
              title: [
                sources ? `Production source IDs before current line resolution: ${sources}.` : '',
                queueSourceIds ? `Active queue source unit IDs before current line resolution: ${queueSourceIds}.` : '',
                ...row.notes,
              ].filter(Boolean).join(' '),
            };
          })
          .sort((a, b) =>
            categorySortValue(a.category) - categorySortValue(b.category)
              || a.name.localeCompare(b.name)
              || (a.unit_id ?? 0) - (b.unit_id ?? 0)
              || a.itemKey.localeCompare(b.itemKey));

        return {
          rows,
          queueEstimateNote: queueState.conservativeUnqueueDeductions
            ? `${queueState.conservativeUnqueueDeductions} unidentified unqueue event(s) conservatively deducted from queued estimates.`
            : 'Queued values are evidence estimates.',
        };
      }

      return {
        queueEvents,
        unqueueEvents,
        unitSummaryForPlayer,
      };
    }

    function renderTimeline(game, lifetimes, economy, resourceEstimates, unitStats, updateGameplay) {
      const duration = Number(game.summary.duration_seconds);
      const uptimeRows = game.match.uptimes.map((row) => ({ ...row, seconds: timestampSeconds(row.timestamp) }));
      const estimatePlayers = resourceEstimates?.players ?? {};
      const unitStatPlayers = unitStats?.schema === 'aoe2-unit-stats/v1' ? (unitStats.players ?? {}) : {};
      const productionTracker = createProductionTracker(game, economy);
      const unitStatsCaveat = unitStats?.caveats?.[0]
        ?? 'Unit stats are unavailable for this replay; counts still show production intent, queue intent, and current map-position estimates.';
      const observationNote = resourceEstimates?.methodology?.observation_semantics?.limitation ?? 'Resource composition is inferred.';
      const resourceOrder = ['Food', 'Wood', 'Gold', 'Stone'];
      const workerResourceAssignmentKeys = Object.freeze({
        food: 'Food',
        wood: 'Wood',
        gold: 'Gold',
        stone: 'Stone',
      });
      const startingVillagersByPlayer = new Map(game.match.players.map((player) => [
        player.number,
        lifetimes.objects.filter((object) =>
          object.owner === player.number && object.initial === true && object.name === 'Villager'
        ).length,
      ]));

      function emptyMappedWorkerCounts() {
        return {
          Food: 0,
          Wood: 0,
          Gold: 0,
          Stone: 0,
          Other: 0,
        };
      }

      function compactCountSummary(values) {
        const counts = new Map();
        values.filter(Boolean).forEach((value) => {
          counts.set(value, (counts.get(value) ?? 0) + 1);
        });
        return [...counts.entries()]
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([value, count]) => `${value}:${count}`)
          .join(',');
      }

      function currentMappedWorkerSummaryForPlayer(assignments) {
        const counts = emptyMappedWorkerCounts();
        const mappedWorkers = assignments.filter((assignment) =>
          assignment.mapRendered && assignment.worker);
        mappedWorkers.forEach((assignment) => {
          const resource = workerResourceAssignmentKeys[assignment.villagerTaskAssignment];
          counts[resource ?? 'Other'] += 1;
        });
        const resourceTotal = resourceOrder.reduce((sum, resource) => sum + counts[resource], 0);
        return {
          counts,
          resourceTotal,
          total: mappedWorkers.length,
          other: counts.Other,
          equationMatchesTotal: resourceTotal + counts.Other === mappedWorkers.length,
          taskAssignments: compactCountSummary(mappedWorkers.map((assignment) =>
            assignment.villagerTaskAssignment ?? 'unresolved')),
        };
      }

      function mappedWorkerEquation(summary) {
        return `${resourceOrder.map((resource) =>
          `${resource} ${summary.counts[resource]}`).join(' + ')} + Other ${summary.other} = Total ${summary.total}`;
      }

      function mappedWorkerTitle(summary, availableVillagers, startingVillagers, trainedVillagers) {
        return [
          `Current map-position worker estimate: ${mappedWorkerEquation(summary)}.`,
          'Food, Wood, Gold, and Stone count only currently mapped Villagers whose effective assignment is exactly that resource.',
          'Other counts currently mapped Villagers assigned to build, repair, attack, generic gather, move, unresolved, or any non-resource task.',
          `Available Villager upper-bound evidence: ${availableVillagers} (${startingVillagers} starting + ${trainedVillagers} trained); this is not displayed as current field state.`,
          'Counts come from activeMappedActorAssignments(seconds) with map-rendered filtering, so sparse replay positions can be incomplete and missing positions are position-unknown, not confirmed dead.',
          summary.taskAssignments ? `Effective worker assignments: ${summary.taskAssignments}.` : '',
        ].filter(Boolean).join(' ');
      }

      function applyMappedWorkerDatasets(element, summary, availableVillagers, startingVillagers, trainedVillagers) {
        element.dataset.mappedWorkerTotal = String(summary.total);
        resourceOrder.forEach((resource) => {
          element.dataset[`mappedWorker${resource}`] = String(summary.counts[resource]);
        });
        element.dataset.mappedWorkerOther = String(summary.other);
        element.dataset.mappedWorkerResourceTotal = String(summary.resourceTotal);
        element.dataset.mappedWorkerEquationParity = String(summary.equationMatchesTotal);
        element.dataset.availableWorkerUpperBound = String(availableVillagers);
        element.dataset.availableStartingVillagers = String(startingVillagers);
        element.dataset.availableTrainedVillagers = String(trainedVillagers);
        element.dataset.mappedWorkerAssignments = summary.taskAssignments;
      }

      function addVisibleUnitLine(rowMap, item, values = {}) {
        const row = rowMap.get(item.itemKey ?? item.key) ?? {
          itemKey: item.itemKey ?? item.key,
          unit_id: item.unit_id,
          name: item.name,
          category: item.category,
          produced: 0,
          queued: 0,
          currentMapEstimate: 0,
          starting: 0,
          titleParts: [],
          startingSourceCounts: new Map(),
          currentMapEvidenceCounts: new Map(),
          currentMapMemberIds: new Set(),
          currentMapEvidenceParts: [],
        };
        row.produced += values.produced ?? 0;
        row.queued += values.queued ?? 0;
        row.currentMapEstimate += values.currentMapEstimate ?? 0;
        row.starting += values.starting ?? 0;
        if (values.title) row.titleParts.push(values.title);
        if (values.startingSource) {
          row.startingSourceCounts.set(
            values.startingSource,
            (row.startingSourceCounts.get(values.startingSource) ?? 0) + (values.starting ?? 0),
          );
        }
        values.currentMapEvidenceCounts?.forEach((count, quality) => {
          row.currentMapEvidenceCounts.set(
            quality,
            (row.currentMapEvidenceCounts.get(quality) ?? 0) + count,
          );
        });
        (values.currentMapMemberIds ?? []).forEach((id) => row.currentMapMemberIds.add(id));
        if (values.currentMapEvidenceParts) row.currentMapEvidenceParts.push(...values.currentMapEvidenceParts);
        rowMap.set(row.itemKey, row);
      }

      function mapPositionEvidenceNote(rows) {
        const explicitDeletes = rows
          .filter((row) => row.kind === 'delete')
          .reduce((sum, row) => sum + Math.max(1, row.object_ids?.length ?? 0), 0);
        const possibleLosses = rows
          .filter((row) => row.kind === 'possible_loss')
          .reduce((sum, row) => sum + Math.max(1, row.object_ids?.length ?? 0), 0);
        if (!explicitDeletes && !possibleLosses) {
          return 'No explicit delete or possible-loss rows have elapsed for this player; current map-position counts still require active unexpired position evidence.';
        }
        return `${explicitDeletes} explicit delete object(s) and ${possibleLosses} possible-loss object(s) have elapsed for this player. The current map-position estimate follows active map party assignments; stale or absent positions are treated as position-unknown, not confirmed dead.`;
      }

      function representedStartingUnits(player, playerUnitStats) {
        const representedIds = new Set([
          ...(playerUnitStats?.included_unit_ids ?? []),
          ...(playerUnitStats?.queued_unit_ids ?? []),
        ]);
        const rows = new Map();
        (player.objects ?? [])
          .filter((object) =>
            object.name
            && object.class_id === 70
            && Number.isInteger(object.object_id)
            && (representedIds.has(object.object_id) || unitNameMatches(object.name, /\bvillager\b/)))
          .forEach((object) => {
            const key = `${object.object_id}:${object.name}`;
            const row = rows.get(key) ?? {
              unit_id: object.object_id,
              name: object.name,
              count: 0,
            };
            row.count += 1;
            rows.set(key, row);
          });
        return [...rows.values()];
      }

      function incrementCount(counts, key, amount = 1) {
        counts.set(key, (counts.get(key) ?? 0) + amount);
      }

      function evidenceCountText(counts) {
        const labels = {
          direct: 'direct',
          'production-inferred': 'production-inferred',
          'sprite-category': 'sprite/category fallback',
          unclassified: 'unclassified',
        };
        const parts = ['direct', 'production-inferred', 'sprite-category', 'unclassified']
          .map((quality) => [quality, counts.get(quality) ?? 0])
          .filter(([, count]) => count > 0)
          .map(([quality, count]) => `${labels[quality]} ${count}`);
        return parts.length ? parts.join(', ') : 'none';
      }

      function evidenceCountDataText(counts) {
        return ['direct', 'production-inferred', 'sprite-category', 'unclassified']
          .map((quality) => `${quality}:${counts.get(quality) ?? 0}`)
          .join(',');
      }

      function activeMappedAssignmentsByPlayer(assignments) {
        const byPlayer = new Map();
        assignments.forEach((assignment) => {
          const rows = byPlayer.get(assignment.player) ?? [];
          rows.push(assignment);
          byPlayer.set(assignment.player, rows);
        });
        return byPlayer;
      }

      function currentMapIdentityItem(assignment, statSnapshot, playerUnitStats) {
        const identity = assignment.unitIdentity ?? {};
        const unitId = numericId(identity.unit_id ?? identity.unitId);
        const name = String(identity.name ?? assignment.referenceUnitName ?? '').trim();
        if (assignment.worker) {
          const villagerRecord = Object.values(playerUnitStats?.units ?? {})
            .find((unit) => unit.name === 'Villager');
          const villagerUnitId = unitId ?? numericId(villagerRecord?.unit_id);
          return resolveUnitLineIdentity({
            unit_id: villagerUnitId ?? undefined,
            unitId: villagerUnitId ?? undefined,
            object_id: villagerUnitId ?? undefined,
            name: name || 'Villager',
          }, statSnapshot, playerUnitStats);
        }
        if ((identity.quality === 'direct' || identity.quality === 'production-inferred')
          && (unitId !== null || name)) {
          return resolveUnitLineIdentity({
            unit_id: unitId ?? undefined,
            unitId: unitId ?? undefined,
            object_id: unitId ?? undefined,
            name,
          }, statSnapshot, playerUnitStats);
        }
        const definition = mapSpriteByKey.get(assignment.spriteKey);
        const spriteKey = assignment.spriteKey ?? 'unknown';
        const category = unitCategoryForMapSpriteKey(spriteKey, assignment.category);
        return {
          key: `map-sprite:${spriteKey}:${category ?? 'unknown'}`,
          unit_id: null,
          sourceUnitId: null,
          name: `Estimated ${definition?.label ?? 'mapped unit'}`,
          category,
        };
      }

      function currentMapUnitSummaryForPlayer(assignments, statSnapshot, playerUnitStats) {
        const rows = new Map();
        const diagnostics = {
          activeAssignments: assignments.length,
          mapRenderedCategorized: 0,
          mapRenderedWorkers: 0,
          evidenceCounts: new Map(),
        };
        assignments.forEach((assignment) => {
          const quality = assignment.evidenceQuality ?? 'unclassified';
          incrementCount(diagnostics.evidenceCounts, quality);
          if (!assignment.mapRendered) return;
          diagnostics.mapRenderedCategorized += 1;
          if (assignment.worker) diagnostics.mapRenderedWorkers += 1;
          const item = currentMapIdentityItem(assignment, statSnapshot, playerUnitStats);
          const row = rows.get(item.key) ?? {
            ...item,
            itemKey: item.key,
            currentMapEstimate: 0,
            currentMapEvidenceCounts: new Map(),
            currentMapMemberIds: new Set(),
            currentMapEvidenceParts: [],
          };
          row.currentMapEstimate += 1;
          incrementCount(row.currentMapEvidenceCounts, quality);
          row.currentMapMemberIds.add(assignment.instanceId);
          row.currentMapEvidenceParts.push([
            `id${assignment.instanceId}`,
            assignment.unitIdentity?.quality ?? quality,
            assignment.unitIdentity?.unit_id !== null && assignment.unitIdentity?.unit_id !== undefined
              ? `source#${assignment.unitIdentity.unit_id}`
              : '',
            assignment.unitIdentity?.name ?? '',
            `sprite=${assignment.spriteKey}`,
            assignment.worker ? 'worker' : '',
            `party=${assignment.partyKind}`,
          ].filter(Boolean).join('/'));
          rows.set(item.key, row);
        });
        return {
          rows: [...rows.values()]
            .map((row) => ({
              ...row,
              title: [
                `Current map-position evidence: ${row.currentMapEstimate} active classified party-strip actor(s).`,

                || (a.unit_id ?? 0) - (b.unit_id ?? 0)

      function currentMapLineEvidenceText(rows) {

          .filter((row) => row.currentMapEstimate > 0)
          .map((row) => `${row.itemKey}=${row.currentMapEstimate}(${evidenceCountDataText(row.currentMapEvidenceCounts)})[${row.currentMapEvidenceParts.join('|')}]`)

      const playerStates = game.match.players.map((player) => {

        const civilization = document.createElement('span');

        const age = document.createElement('span');
        age.className = 'player-meta player-age';
        const objects = document.createElement('span');
        objects.className = 'player-meta player-objects';
        const separator = () => {

        const economyHud = document.createElement('table');

        const caption = document.createElement('caption');

        const resourceHead = document.createElement('thead');
        const headRow = document.createElement('tr');
        const corner = document.createElement('th');
        corner.scope = 'col';
        corner.textContent = 'Resources';
        headRow.append(corner);
        resourceOrder.forEach((resource) => {

          cell.className = `resource-${resource.toLowerCase()}`;

        const totalHeadCell = document.createElement('th');
        totalHeadCell.scope = 'col';
        totalHeadCell.className = 'resource-total';
        totalHeadCell.textContent = 'Total';
        headRow.append(totalHeadCell);
        resourceHead.append(headRow);
        const resourceBody = document.createElement('tbody');
        const spentRow = document.createElement('tr');
        const spentLabel = document.createElement('th');
        spentLabel.scope = 'row';
        spentLabel.textContent = 'Spent est.';
        spentRow.append(spentLabel);
        const spentCells = {};
        const stockpileRow = document.createElement('tr');
        const stockpileLabel = document.createElement('th');
        stockpileLabel.scope = 'row';
        stockpileLabel.textContent = 'Stockpile';
        stockpileRow.append(stockpileLabel);
        const stockpileCells = {};
        resourceOrder.forEach((resource) => {
          const spentCell = document.createElement('td');
          spentCell.textContent = '0';
          spentCells[resource] = spentCell;
          spentRow.append(spentCell);
          const stockpileCell = document.createElement('td');
          stockpileCell.textContent = '—';
          stockpileCells[resource] = stockpileCell;
          stockpileRow.append(stockpileCell);
        });
        const spentTotalCell = document.createElement('td');
        spentTotalCell.className = 'resource-total';
        spentTotalCell.textContent = '0';
        spentTotalCell.title = 'Sum of estimated spent base costs across Food, Wood, Gold, and Stone: 0.';
        spentTotalCell.setAttribute('aria-label', spentTotalCell.title);
        spentRow.append(spentTotalCell);
        const stockpileTotalCell = document.createElement('td');
        stockpileTotalCell.className = 'resource-total';
        stockpileTotalCell.textContent = 'n/a';
        stockpileTotalCell.title = 'Replay-observed total resources unavailable at this timeline point. This is not the sum of estimated per-resource stockpiles.';
        stockpileTotalCell.setAttribute('aria-label', stockpileTotalCell.title);
        stockpileRow.append(stockpileTotalCell);
        const workersRow = document.createElement('tr');
        const workersLabel = document.createElement('th');
        workersLabel.scope = 'row';
        workersLabel.textContent = '# workers';
        workersLabel.title = 'Current map-position worker estimate from map-rendered Villager party-strip evidence.';
        workersLabel.setAttribute('aria-label', workersLabel.title);
        workersRow.append(workersLabel);
        const workerCells = {};
        resourceOrder.forEach((resource) => {
          const cell = document.createElement('td');
          cell.textContent = '0';
          cell.title = `${resource} currently mapped Villagers with effective assignment exactly ${resource.toLowerCase()}: 0.`;
          workerCells[resource] = cell;
          workersRow.append(cell);
        });
        const workerTotalCell = document.createElement('td');
        workerTotalCell.className = 'resource-total worker-total-cell';
        const workerTotalCurrent = document.createElement('span');
        workerTotalCurrent.className = 'worker-total-current';
        workerTotalCurrent.textContent = '0';
        const workerTotalOther = document.createElement('span');
        workerTotalOther.className = 'worker-total-other';
        workerTotalOther.hidden = true;
        workerTotalCell.append(workerTotalCurrent, workerTotalOther);
        workerTotalCell.title = 'Current map-position worker estimate: Food 0 + Wood 0 + Gold 0 + Stone 0 + Other 0 = Total 0. Available Villager upper-bound evidence: 0 (0 starting + 0 trained); this is not displayed as current field state.';
        workerTotalCell.setAttribute('aria-label', workerTotalCell.title);
        workersRow.append(workerTotalCell);
        resourceBody.append(spentRow, stockpileRow, workersRow);
        economyHud.append(caption, resourceHead, resourceBody);
        const unitsSection = document.createElement('section');
        unitsSection.className = 'player-details units-details';
        const unitsSummary = document.createElement('h4');
        unitsSummary.className = 'player-side-heading';

        unitsSummary.textContent = 'Units';
        unitsSummary.title = unitSummaryAccessibleDescription(0, 0, 0);
        unitsSummary.setAttribute('aria-label', `Units. ${unitsSummary.title}`);
        unitsSection.setAttribute('aria-labelledby', unitsSummary.id);
        const unitsBody = document.createElement('div');
        unitsBody.className = 'player-details-body player-icon-body';
        const unitsValue = document.createElement('div');
        unitsValue.className = 'player-icon-host';
        unitsValue.textContent = 'None yet';
        unitsBody.append(unitsSummary, unitsValue);
        unitsSection.append(unitsBody);
        const technologiesSection = document.createElement('section');
        technologiesSection.className = 'player-details technologies-details';
        const technologiesSummary = document.createElement('h4');
        technologiesSummary.className = 'player-side-heading';
        technologiesSummary.id = `player-${player.number}-technologies-heading`;
        technologiesSummary.textContent = 'Tech';
        technologiesSummary.title = 'Visible completed technologies: 0.';
        technologiesSummary.setAttribute('aria-label', 'Tech. Visible completed technologies: 0.');
        technologiesSection.setAttribute('aria-labelledby', technologiesSummary.id);
        const technologiesBody = document.createElement('div');
        technologiesBody.className = 'player-details-body player-icon-body';
        const technologiesList = document.createElement('div');
        technologiesList.className = 'player-icon-host';

        technologiesBody.append(technologiesSummary, technologiesList);

        const disclosures = document.createElement('div');

        heading.append(playerName, separator(), civilization, separator(), age, separator(), objects);

        card.append(header, economyHud, disclosures);
        timelinePlayers.append(card);
        const estimateSamples = (estimatePlayers[String(player.number)]?.samples ?? [])
          .map((row) => ({ ...row, seconds: Number(row.time) }))
          .sort((a, b) => a.seconds - b.seconds);
        const playerUnitStats = unitStatPlayers[String(player.number)] ?? null;

        const unitTechnologyEvents = (playerUnitStats?.technology_events ?? [])
          .filter((row) => row.display !== false)
          .map((row) => ({ ...row, time: Number(row.time) }))
          .sort((a, b) => a.time - b.time || (a.source_label ?? '').localeCompare(b.source_label ?? '') || a.name.localeCompare(b.name));
        return {
