          stockpileTotalCell,
          workersRow,
          workersLabel,
          workerCells,
          workerTotalCell,
          workerTotalCurrent,
          workerTotalOther,
          unitsSummary,
          unitsValue,
          technologiesSummary,
          technologiesList,
          unitSpriteImages: new Map(),
          technologySpriteImages: new Map(),
          playerUnitStats,
          startingUnits: representedStartingUnits(player, playerUnitStats),
          unitStatSnapshots,
          startingVillagers: startingVillagersByPlayer.get(player.number) ?? 0,
          uptimes: uptimeRows.filter((row) => row.player === player.number),
          timeseries: player.timeseries.map((row) => ({ ...row, seconds: timestampSeconds(row.timestamp) })),
          completions: economy.unit_completions.filter((row) => row.player === player.number),
          technologyCompletions: (resourceEstimates?.technology_completions ?? [])
            .filter((row) => row.player === player.number)
            .map((row) => ({ ...row, time: Number(row.time) }))
            .sort((a, b) => a.time - b.time || a.name.localeCompare(b.name)),
          unitTechnologyEvents,
          terminalEvents: (lifetimes.lifecycle_events ?? [])
            .filter((row) => row.player === player.number && ['delete', 'possible_loss'].includes(row.kind))
            .map((row) => ({ ...row, time: Number(row.time) }))
            .sort((a, b) => a.time - b.time || a.kind.localeCompare(b.kind)),
          spending: economy.spending.filter((row) => row.player === player.number),
          estimateSamples,
        };
      });

      timelineSlider.max = String(duration);

      function updateTimeline(seconds) {
        const bounded = Math.max(0, Math.min(duration, seconds));
        const currentMappedAssignments = typeof updateGameplay.activeMappedActorAssignments === 'function'
          ? updateGameplay.activeMappedActorAssignments(bounded)
          : [];
        const currentMappedAssignmentsByPlayer = activeMappedAssignmentsByPlayer(currentMappedAssignments);
        timelineSlider.value = String(bounded);
        timelineTime.value = `${formatDuration(bounded)} / ${formatDuration(duration)}`;
        playerStates.forEach((state) => {
          const uptime = latestAt(state.uptimes, bounded);
          const row = latestAt(state.timeseries, bounded);
          const estimate = latestAt(state.estimateSamples, bounded);
          const age = uptime?.age ?? 'DARK_AGE';
          const ageText = displayHeaderAge(age);
          const ageTitle = uptime?.age
            ? `Replay age: ${displayAge(uptime.age)}.`
            : 'No replay age sample yet; showing starting Dark Age.';
          const objectsAvailable = Number.isFinite(Number(row?.total_objects));
          const objectsText = objectsAvailable ? formatResourceValue(row.total_objects) : 'n/a';
          const objectsTitle = objectsAvailable
            ? `Replay-observed total objects: ${objectsText}.`
            : 'Replay-observed total objects unavailable at this timeline point.';
          state.age.textContent = ageText;
          state.age.title = ageTitle;
          state.age.setAttribute('aria-label', `Age: ${ageText}. ${ageTitle}`);
          state.objects.textContent = objectsText;
          state.objects.title = objectsTitle;
          state.objects.setAttribute('aria-label', `Objects: ${objectsText}. ${objectsTitle}`);
          if (estimate) {
            resourceOrder.forEach((resource) => {
              const cell = state.stockpileCells[resource];
              cell.textContent = formatResourceValue(estimate.central?.[resource]);
              cell.title = `${resource} estimated stockpile ${formatEstimateRange(estimate, resource)}. ${observationNote}`;
              cell.setAttribute('aria-label', `${resource} estimated stockpile ${formatEstimateRange(estimate, resource)}`);
            });
          } else {
            resourceOrder.forEach((resource) => {
              state.stockpileCells[resource].textContent = '—';
              state.stockpileCells[resource].title = 'Resource estimate unavailable.';
              state.stockpileCells[resource].setAttribute('aria-label', `${resource} estimated stockpile unavailable`);
            });
          }
          const observedResourceTotalAvailable = Number.isFinite(Number(row?.total_resources));
          const observedResourceTotalText = observedResourceTotalAvailable
            ? formatResourceValue(row.total_resources)
            : 'n/a';
          state.stockpileTotalCell.textContent = observedResourceTotalText;
          state.stockpileTotalCell.title = observedResourceTotalAvailable
            ? `Replay-observed total resources: ${observedResourceTotalText}. This is not the sum of estimated per-resource stockpiles.`
            : 'Replay-observed total resources unavailable at this timeline point. This is not the sum of estimated per-resource stockpiles.';
          state.stockpileTotalCell.setAttribute('aria-label', state.stockpileTotalCell.title);
          const spent = { Food: 0, Wood: 0, Gold: 0, Stone: 0 };
          state.spending.slice(0, upperBound(state.spending, bounded)).forEach((event) => {
            Object.entries(event.cost).forEach(([resource, amount]) => { spent[resource] += amount; });
          });
          resourceOrder.forEach((resource) => {
            const cell = state.spentCells[resource];
            cell.textContent = formatResourceValue(spent[resource]);
            cell.title = `${resource} spent, estimated base cost: ${formatResourceValue(spent[resource])}`;
            cell.setAttribute('aria-label', `${resource} spent estimated base cost ${formatResourceValue(spent[resource])}`);
          });
          const spentTotal = resourceOrder.reduce((sum, resource) => sum + spent[resource], 0);
          const spentTotalText = formatResourceValue(spentTotal);
          state.spentTotalCell.textContent = spentTotalText;
          state.spentTotalCell.title = `Sum of estimated spent base costs across Food, Wood, Gold, and Stone: ${spentTotalText}.`;
          state.spentTotalCell.setAttribute('aria-label', state.spentTotalCell.title);
          const completedUnitEvents = state.completions.slice(0, upperBound(state.completions, bounded));
          const trainedVillagers = completedUnitEvents
            .filter((event) => event.name === 'Villager')
            .reduce((sum, event) => sum + event.count, 0);
          const availableVillagers = state.startingVillagers + trainedVillagers;
          const playerCurrentMappedAssignments = currentMappedAssignmentsByPlayer.get(state.player.number) ?? [];
          const mappedWorkerSummary = currentMappedWorkerSummaryForPlayer(playerCurrentMappedAssignments);
          const mappedWorkerDescription = mappedWorkerTitle(
            mappedWorkerSummary,
            availableVillagers,
            state.startingVillagers,
            trainedVillagers,
          );
          state.workersRow.title = mappedWorkerDescription;
          state.workersRow.setAttribute('aria-label', mappedWorkerDescription);
          state.workersLabel.title = mappedWorkerDescription;
          state.workersLabel.setAttribute('aria-label', mappedWorkerDescription);
          applyMappedWorkerDatasets(
            state.workersRow,
            mappedWorkerSummary,
            availableVillagers,
            state.startingVillagers,
            trainedVillagers,
          );
          resourceOrder.forEach((resource) => {
            const cell = state.workerCells[resource];
            const count = mappedWorkerSummary.counts[resource];
            cell.textContent = String(count);
            cell.title = [
              `${resource} currently mapped Villagers with effective assignment exactly ${resource.toLowerCase()}: ${count}.`,
              mappedWorkerDescription,
            ].join(' ');
            cell.setAttribute('aria-label', cell.title);
            cell.dataset.mappedWorkerResource = resource;
            cell.dataset.mappedWorkerCount = String(count);
            cell.dataset.availableWorkerUpperBound = String(availableVillagers);
          });
          state.workerTotalCurrent.textContent = String(mappedWorkerSummary.total);
          state.workerTotalOther.textContent = mappedWorkerSummary.other > 0
            ? `+${mappedWorkerSummary.other} other`
            : '';
          state.workerTotalOther.hidden = mappedWorkerSummary.other <= 0;
          state.workerTotalCell.title = mappedWorkerDescription;
          state.workerTotalCell.setAttribute('aria-label', state.workerTotalCell.title);
          applyMappedWorkerDatasets(
            state.workerTotalCell,
            mappedWorkerSummary,
            availableVillagers,
            state.startingVillagers,
            trainedVillagers,
          );
          const statSnapshot = latestAt(state.unitStatSnapshots, bounded);
          const productionSummary = productionTracker.unitSummaryForPlayer(
            state.player.number,
            bounded,
            statSnapshot,
            state.playerUnitStats,
          );
          const currentMapSummary = currentMapUnitSummaryForPlayer(
            playerCurrentMappedAssignments,
            statSnapshot,
            state.playerUnitStats,
          );
          const unitLineMap = new Map();
          productionSummary.rows.forEach((row) => {
            addVisibleUnitLine(unitLineMap, row, {
              produced: row.produced,
              queued: row.queued,
              title: row.title,
            });
          });
          currentMapSummary.rows.forEach((row) => {
            addVisibleUnitLine(unitLineMap, row, {
              currentMapEstimate: row.currentMapEstimate,
              currentMapEvidenceCounts: row.currentMapEvidenceCounts,
              currentMapMemberIds: row.currentMapMemberIds,
              currentMapEvidenceParts: row.currentMapEvidenceParts,
              title: row.title,
            });
          });
          state.startingUnits.forEach((startingUnit) => {
            const item = resolveUnitLineIdentity(startingUnit, statSnapshot, state.playerUnitStats);
            addVisibleUnitLine(unitLineMap, item, {
              starting: startingUnit.count,
              startingSource: `${startingUnit.name} #${startingUnit.unit_id}`,
            });
          });
          const terminalRows = state.terminalEvents.slice(0, upperBound(state.terminalEvents, bounded));
          const mapPositionNote = mapPositionEvidenceNote(terminalRows);
          const visibleUnits = [...unitLineMap.values()]
            .map((unit) => {
              const startingSources = [...unit.startingSourceCounts.entries()]
                .sort((a, b) => a[0].localeCompare(b[0]))
                .map(([name, count]) => `${name}: ${count}`)
                .join(', ');
              const currentMapEvidenceText = unit.currentMapEstimate > 0
                ? `Current map evidence split: ${evidenceCountText(unit.currentMapEvidenceCounts)}.`
                : 'No active classified map party-strip actor is counted for this line.';
              return {
                ...unit,
                currentMapEvidenceText,
                currentMapEvidenceTitle: [
                  currentMapEvidenceText,
                  unit.currentMapEvidenceParts.length
                    ? `Per-actor map evidence: ${unit.currentMapEvidenceParts.join(', ')}.`
                    : '',
                ].filter(Boolean).join(' '),
                title: [
                  unit.titleParts.join(' '),
                  startingSources
                    ? `Represented starting unit source IDs: ${startingSources}; these are not automatically counted in the current map-position estimate.`
                    : 'No represented starting units in this line.',
                  productionSummary.queueEstimateNote,
                ].filter(Boolean).join(' '),
                mapPositionNote,
              };
            })
            .filter((unit) => unit.currentMapEstimate > 0 || unit.queued > 0 || unit.produced > 0)
            .sort((a, b) =>
              categorySortValue(a.category) - categorySortValue(b.category)
                || a.name.localeCompare(b.name)
                || (a.unit_id ?? 0) - (b.unit_id ?? 0)
                || a.itemKey.localeCompare(b.itemKey));
          const currentMapTotal = visibleUnits.reduce((sum, unit) => sum + unit.currentMapEstimate, 0);
          const currentMappedVillagerUnitTotal = visibleUnits
            .filter((unit) => unit.category === 'villagers')
            .reduce((sum, unit) => sum + unit.currentMapEstimate, 0);
          const currentMappedWorkerTotal = currentMapSummary.diagnostics.mapRenderedWorkers;
          const currentMappedWorkerUnitsParity = currentMappedVillagerUnitTotal === currentMappedWorkerTotal;
          const currentMappedWorkerResourcesParity = mappedWorkerSummary.total === currentMappedWorkerTotal;
          const currentMappedWorkerVisibleParity = currentMappedVillagerUnitTotal === mappedWorkerSummary.total;
          [state.workersRow, state.workerTotalCell].forEach((element) => {
            element.dataset.unitsCurrentMappedVillagerTotal = String(currentMappedVillagerUnitTotal);
            element.dataset.currentMappedWorkerTotal = String(currentMappedWorkerTotal);
            element.dataset.currentMappedWorkerUnitsParity = String(currentMappedWorkerUnitsParity);
            element.dataset.currentMappedWorkerResourcesParity = String(currentMappedWorkerResourcesParity);
            element.dataset.currentMappedWorkerVisibleParity = String(currentMappedWorkerVisibleParity);
          });
          const queuedTotal = visibleUnits.reduce((sum, unit) => sum + unit.queued, 0);
          const producedTotal = visibleUnits.reduce((sum, unit) => sum + unit.produced, 0);
          state.unitsSummary.textContent = 'Units';
          state.unitsSummary.title = unitSummaryAccessibleDescription(producedTotal, queuedTotal, currentMapTotal);
          state.unitsSummary.setAttribute('aria-label', `Units. ${state.unitsSummary.title}`);
          state.unitsSummary.dataset.hudBuiltProducedTotal = String(producedTotal);
          state.unitsSummary.dataset.hudQueuedTotal = String(queuedTotal);
          state.unitsSummary.dataset.hudCurrentMapTotal = String(currentMapTotal);
          state.unitsSummary.dataset.currentMapActiveAssignments = String(currentMapSummary.diagnostics.activeAssignments);
          state.unitsSummary.dataset.mapRenderedCategorizedTotal = String(currentMapSummary.diagnostics.mapRenderedCategorized);
          state.unitsSummary.dataset.currentMappedWorkerTotal = String(currentMappedWorkerTotal);
          state.unitsSummary.dataset.currentMappedVillagerUnitTotal = String(currentMappedVillagerUnitTotal);
          state.unitsSummary.dataset.currentMappedWorkerUnitsParity = String(currentMappedWorkerUnitsParity);
          state.unitsSummary.dataset.currentMappedWorkerResourcesParity = String(currentMappedWorkerResourcesParity);
          state.unitsSummary.dataset.currentMappedWorkerVisibleParity = String(currentMappedWorkerVisibleParity);
          state.unitsSummary.dataset.currentMapParity = String(
            currentMapTotal === currentMapSummary.diagnostics.mapRenderedCategorized,
          );
          state.unitsSummary.dataset.currentMapEvidenceSplits = evidenceCountDataText(currentMapSummary.diagnostics.evidenceCounts);
          renderUnitStatsList(
            state.unitsValue,
            visibleUnits,
            state.playerUnitStats,
            statSnapshot,
            `${unitStatsCaveat} Total built/produced is production intent and excludes starting units; queued is active queue intent remaining after completions/unqueues; current map-position is the classified active party-strip actor estimate from the map model. Actors absent from active unexpired position evidence are position-unknown, not confirmed dead, and this is not complete army population. Technology completion times are estimates. ${economy.methodology.unit_completions}`,
            economy.methodology.unit_completions,
            state.unitSpriteImages,
          );
          state.unitsValue.dataset.hudCurrentMapTotal = String(currentMapTotal);
          state.unitsValue.dataset.currentMapActiveAssignments = String(currentMapSummary.diagnostics.activeAssignments);
          state.unitsValue.dataset.mapRenderedCategorizedTotal = String(currentMapSummary.diagnostics.mapRenderedCategorized);
          state.unitsValue.dataset.currentMappedWorkerTotal = String(currentMappedWorkerTotal);
          state.unitsValue.dataset.currentMappedVillagerUnitTotal = String(currentMappedVillagerUnitTotal);
          state.unitsValue.dataset.currentMappedWorkerUnitsParity = String(currentMappedWorkerUnitsParity);
          state.unitsValue.dataset.currentMappedWorkerResourcesParity = String(currentMappedWorkerResourcesParity);
          state.unitsValue.dataset.currentMappedWorkerVisibleParity = String(currentMappedWorkerVisibleParity);
          state.unitsValue.dataset.currentMapParity = String(
            currentMapTotal === currentMapSummary.diagnostics.mapRenderedCategorized,
          );
          state.unitsValue.dataset.currentMapEvidenceSplits = evidenceCountDataText(currentMapSummary.diagnostics.evidenceCounts);
          state.unitsValue.dataset.currentMapLineEvidence = currentMapLineEvidenceText(visibleUnits);
          const technologyRows = state.unitTechnologyEvents.length
            ? state.unitTechnologyEvents
            : state.technologyCompletions;
          const visibleTechnologies = technologyRows.slice(0, upperBound(technologyRows, bounded));
          const displayedTechnologies = topTechnologyLines(visibleTechnologies);
          state.technologiesSummary.textContent = 'Tech';
          state.technologiesSummary.title = `Visible completed technologies: ${displayedTechnologies.length}.`;
          state.technologiesSummary.setAttribute(
            'aria-label',
            `Tech. Visible completed technologies: ${displayedTechnologies.length}.`,
          );
          renderTechnologyGrid(state.technologiesList, displayedTechnologies, state.technologySpriteImages);
          state.economyHud.title = economy.methodology.spending;
        });
        updateGameplay(bounded);
      }

      let playing = false;
      let lastFrame = null;
      const playbackSpeeds = [4, 10, 30];
      let speedIndex = playbackSpeeds.indexOf(30);
      const mapScales = [1, 2, 3];
      let mapScaleIndex = 0;
      function updateSpeedButton() {
        const speed = playbackSpeeds[speedIndex];
        const nextSpeed = playbackSpeeds[(speedIndex + 1) % playbackSpeeds.length];
        timelineSpeed.textContent = `${speed}×`;
        timelineSpeed.dataset.speed = String(speed);
        timelineSpeed.setAttribute('aria-label', `Playback speed: ${speed}×. Activate for ${nextSpeed}×.`);
      }
      function updateMapScaleDiagnostics(scale, widthFormula) {
        const elements = [
          timelinePlayers,
          timelineSection,
          mapStack,
          mapLegendDetails,
          mapLegend,
          mapCanvas,
          resourceCanvas,
          buildingCanvas,
          gameplayCanvas,
          spriteOverlay,
        ];
        elements.forEach((element) => {
          if (!element) return;
          element.dataset.mapScale = String(scale);
          element.dataset.mapScaleWidth = widthFormula;
        });
        requestAnimationFrame(() => {
          const renderedWidth = `${Math.round(mapStack.getBoundingClientRect().width)}px`;
          [
            timelinePlayers,
            timelineSection,
            mapStack,
            mapLegendDetails,
            mapLegend,
          ].forEach((element) => {
            if (!element) return;
            element.dataset.mapRenderedWidth = renderedWidth;
          });
          [mapCanvas, resourceCanvas, buildingCanvas, gameplayCanvas, spriteOverlay].forEach((element) => {
            if (!element) return;
            element.dataset.mapRenderedWidth = `${Math.round(element.getBoundingClientRect().width)}px`;
          });
        });
      }

        buildingContext.globalAlpha = farmStatus?.inferred ? .65 : .5;
        buildingContext.fillStyle = name.toLowerCase() === 'farm'
          ? (farmStatus?.inferred ? 'rgba(90, 118, 54, .65)' : '#777')
          : (playerColors.get(row.player) ?? '#888');
        buildingContext.fillRect(left, top, width, height);
        buildingContext.globalAlpha = 1;
        buildingContext.strokeStyle = '#111';
        buildingContext.lineWidth = 1;
        buildingContext.strokeRect(left + .5, top + .5, Math.max(1, width - 1), Math.max(1, height - 1));
        if (buildingNeedsIcon(name)) {
          drawBuildingIcon(name, left + width / 2, top + height / 2, width, height);
        }
      }

      function drawBuildingRange(row) {
        const range = buildingAttackRange(buildingName(row));
        if (!range) return;
        const color = playerColors.get(row.player ?? row.owner) ?? '#aaa';
        buildingContext.save();
        buildingContext.globalAlpha = .3;
        buildingContext.strokeStyle = color;
        buildingContext.lineWidth = 1;
        buildingContext.setLineDash([3, 3]);
        buildingContext.beginPath();
        buildingContext.arc(row.position.x * cellSize, row.position.y * cellSize, range * cellSize, 0, Math.PI * 2);
        buildingContext.stroke();
        buildingContext.restore();
      }

      function drawBuildingImage(image, x, y, availableWidth, availableHeight) {
        const padding = Math.min(2, Math.max(.75, Math.min(availableWidth, availableHeight) * .12));
        const maxWidth = Math.max(1, availableWidth - padding * 2);
        const maxHeight = Math.max(1, availableHeight - padding * 2);
        const naturalWidth = image.naturalWidth || image.width || maxWidth;
        const naturalHeight = image.naturalHeight || image.height || maxHeight;
        const scale = Math.min(maxWidth / naturalWidth, maxHeight / naturalHeight);
        const drawWidth = Math.max(1, naturalWidth * scale);
        const drawHeight = Math.max(1, naturalHeight * scale);
        buildingContext.save();
        buildingContext.imageSmoothingEnabled = false;
        buildingContext.drawImage(image, x - drawWidth / 2, y - drawHeight / 2, drawWidth, drawHeight);
        buildingContext.restore();
      }

      function drawBuildingIcon(name, x, y, availableWidth, availableHeight = availableWidth) {
        const imageRecord = cachedBuildingIconImage(name);
        if (imageRecord) {
          buildingIconRenderStats.visibleMapped += 1;
          if (imageRecord.failed) buildingIconRenderStats.missingVisibleMapped += 1;
          if (imageRecord.loaded) {
            buildingIconRenderStats.loadedVisibleMapped += 1;
            if (imageRecord.fallbackApplied) buildingIconRenderStats.missingVisibleMapped += 1;
            drawBuildingImage(imageRecord.image, x, y, availableWidth, availableHeight);
            return;
          }
        }
        const icon = buildingIcon(name);
        const availableSize = Math.min(availableWidth, availableHeight);
        const fontSize = Math.max(5, Math.min(8, availableSize - 2, availableSize / Math.max(1, icon.length * .7)));
        buildingContext.font = `bold ${fontSize}px sans-serif`;
        buildingContext.textAlign = 'center';
        buildingContext.textBaseline = 'middle';
        buildingContext.lineWidth = 2;
        buildingContext.strokeStyle = '#111';
        buildingContext.strokeText(icon, x, y + .3);
        buildingContext.fillStyle = '#fff';
        buildingContext.fillText(icon, x, y + .3);
      }

      function drawRecentEvent(row, currentTime) {
        const position = row.position;
        if (!position) return;
        const x = position.x * cellSize;
        const y = position.y * cellSize;
        const age = currentTime - row.time;
        const fadeDuration = row.kind === 'gather'
          ? (row.commandDisplayLifetime ?? gatherEventLifetime(row))
          : (row.commandDisplayLifetime ?? 60);
        context.globalAlpha = Math.max(0, 1 - age / fadeDuration);
        context.strokeStyle = playerColors.get(row.player) ?? '#fff';
        context.fillStyle = playerColors.get(row.player) ?? '#fff';
        context.lineWidth = 2;
        context.beginPath();
        if (row.kind === 'build' || row.kind === 'repair' || row.kind === 'gather') {
          const letter = row.kind === 'build' ? 'B' : row.kind === 'repair' ? 'R' : 'G';
          const teamColor = playerColors.get(row.player) ?? '#888';
          context.font = 'bold 11px sans-serif';
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.strokeStyle = teamColor;
          context.lineWidth = 2;
          context.strokeText(letter, x, y + .5);
          context.fillStyle = '#fff';
          context.fillText(letter, x, y + .5);
        } else if (row.kind === 'garrison' || row.kind === 'ungarrison') {
          const symbol = row.kind === 'garrison' ? '⌣' : '◉';
          context.font = 'bold 13px sans-serif';
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.strokeStyle = '#fff';
          context.lineWidth = 2;
          context.strokeText(symbol, x, y);
          context.fillStyle = '#8b5a2b';
          context.fillText(symbol, x, y);
        } else if (row.kind === 'attack') {
          context.moveTo(x - 4, y - 4);
          context.lineTo(x + 4, y + 4);
          context.moveTo(x + 4, y - 4);
          context.lineTo(x - 4, y + 4);
          context.stroke();
        } else if (row.kind === 'target' || row.kind === 'order') {
          context.arc(x, y, 6, 0, Math.PI * 2);
          context.stroke();
        } else {
          context.arc(x, y, 3.5, 0, Math.PI * 2);
          context.fill();
          context.strokeStyle = '#111';
          context.lineWidth = 1;
          context.stroke();
        }
        context.globalAlpha = 1;
      }

      function drawCommandArrow(row, currentTime) {
        const age = currentTime - row.time;
        if (age < 0 || age >= row.lifetime) return;
        const startX = row.from.x * cellSize;
        const startY = row.from.y * cellSize;
        const endX = row.to.x * cellSize;
        const endY = row.to.y * cellSize;
        const angle = Math.atan2(endY - startY, endX - startX);
        const length = Math.hypot(endX - startX, endY - startY);
        if (length < 2) return;
        const trimStart = Math.min(5, length / 4);
        const trimEnd = Math.min(7, length / 4);
        const fromX = startX + Math.cos(angle) * trimStart;
        const fromY = startY + Math.sin(angle) * trimStart;
        const toX = endX - Math.cos(angle) * trimEnd;
        const toY = endY - Math.sin(angle) * trimEnd;
        const opacity = Math.max(0, 1 - age / row.lifetime);
        context.save();
        context.globalAlpha = opacity;
        context.strokeStyle = playerColors.get(row.player) ?? '#fff';
        context.fillStyle = playerColors.get(row.player) ?? '#fff';
        context.lineWidth = 1.5;
        context.setLineDash([5, 3]);
        context.beginPath();
        context.moveTo(fromX, fromY);
        context.lineTo(toX, toY);
        context.stroke();
        context.setLineDash([]);
        context.beginPath();
        context.moveTo(toX, toY);
        context.lineTo(
          toX - Math.cos(angle - Math.PI / 6) * 6,
          toY - Math.sin(angle - Math.PI / 6) * 6,
        );
        context.lineTo(
          toX - Math.cos(angle + Math.PI / 6) * 6,
          toY - Math.sin(angle + Math.PI / 6) * 6,
        );
        context.closePath();
        context.fill();
        context.restore();
      }

      function drawGatherPoint(row) {
        const x = row.position.x * cellSize;
        const y = row.position.y * cellSize;
        const color = playerColors.get(row.player) ?? '#fff';
        context.globalAlpha = 1;
        context.strokeStyle = '#111';
        context.fillStyle = color;
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(x - 3, y + 6);
        context.lineTo(x - 3, y - 6);
        context.stroke();
        context.beginPath();
        context.moveTo(x - 2, y - 6);
        context.lineTo(x + 6, y - 3);
        context.lineTo(x - 2, y);
        context.closePath();
        context.fill();
        context.stroke();
      }

      function currentViewlocks(seconds) {
        return indexedViewlockPlayers.flatMap((player) => {
          const rows = indexedViewlocksByPlayer.get(player) ?? [];
          const index = upperBound(rows, seconds) - 1;
          return index >= 0 ? [rows[index]] : [];
        });
      }

      function viewlockEvidence(row) {
        return `p${row.player}:${row.time.toFixed(3)}@${row.position.x.toFixed(1)},${row.position.y.toFixed(1)}`;
      }

      function drawViewlock(row) {
        const size = viewlockSquareTiles * cellSize;
        const x = row.position.x * cellSize;
        const y = row.position.y * cellSize;
        context.save();
        context.globalAlpha = .46;
        context.strokeStyle = playerColors.get(row.player) ?? '#fff';
        context.lineWidth = 1.25;
        context.setLineDash([5, 4]);
        context.strokeRect(x - size / 2, y - size / 2, size, size);
        context.restore();
      }

      function placementKey(row) {
        const end = row.end_position ? `:${row.end_position.x}:${row.end_position.y}` : '';
        return `${row.player}:${row.position.x.toFixed(2)}:${row.position.y.toFixed(2)}:${buildingName(row)}${end}`;
      }

      function segmentIntersectsExpandedBounds(start, end, bounds, margin = 0) {
        const expanded = {
          left: bounds.left - margin,
          right: bounds.right + margin,
          top: bounds.top - margin,
          bottom: bounds.bottom + margin,
        };
        let minimum = 0;
        let maximum = 1;
        for (const [origin, delta, low, high] of [
          [start.x, end.x - start.x, expanded.left, expanded.right],
          [start.y, end.y - start.y, expanded.top, expanded.bottom],
        ]) {
          if (Math.abs(delta) < 1e-9) {
            if (origin < low || origin > high) return false;
            continue;
          }
          const first = (low - origin) / delta;
          const second = (high - origin) / delta;
          minimum = Math.max(minimum, Math.min(first, second));
          maximum = Math.min(maximum, Math.max(first, second));
          if (minimum > maximum) return false;
        }
        return true;
      }

      // A large hostile formation ending inside a low-durability structure's
      // footprint is useful control evidence. Short inferred routes and long
      // map-spanning crossings remain nonterminal encounter evidence; geometry
      // cannot create a terminal event without an exact-generation anchor.
      const occupationInferencePolicy = Object.freeze({
        minimumSelectedActors: 12,
        endpointMarginTiles: .5,
        maximumShortRouteTiles: 12,
        confirmationDelaySeconds: 30,
        eligibleBuildings: new Set(['House', 'Stable']),
      });
      const terminalCandidateBuildings = [...startingBuildings, ...buildingEvents];
      const buildingGenerationId = new Map();
      startingBuildings.forEach((building, index) => buildingGenerationId.set(building, `starting:${index}`));
      buildingEvents.forEach((building, index) => buildingGenerationId.set(building, `placement:${index}`));
      function generationIdFor(building) {
        return buildingGenerationId.get(building);
      }
      const observedPlacementLastActivity = new Map();
      targetEvents.forEach((rows, targetId) => {
        const actorActivity = lastActorTime.get(targetId);
        if (actorActivity === undefined) return;
        rows.forEach((row) => {
          const name = row.label.replace(/^Target:\s*/i, '');
          const building = terminalCandidateBuildings
            .filter((candidate) => candidate.time <= row.time
              && buildingName(candidate) === name
              && Math.hypot(
                candidate.position.x - row.position.x,
                candidate.position.y - row.position.y,
              ) <= .6)
            .sort((a, b) => (b.time ?? 0) - (a.time ?? 0))[0];
          if (!building) return;
          const key = generationIdFor(building);
          observedPlacementLastActivity.set(key, Math.max(
            observedPlacementLastActivity.get(key) ?? -1,
            actorActivity,
          ));
        });
      });
      const occupationDemolitionsByKey = new Map();
      const occupationEvidence = [];
      commandMapEvents
        .filter((row) => ['move', 'attack'].includes(row.kind) && row.position)
        .forEach((command) => {
          const selectedActors = new Set((command.object_ids ?? [])
            .filter((instanceId) => !controllableFoodActorIds.has(instanceId))).size;
          if (selectedActors < occupationInferencePolicy.minimumSelectedActors) return;
          terminalCandidateBuildings
            .filter((building) => building.player !== command.player
              && building.time <= command.time
              && occupationInferencePolicy.eligibleBuildings.has(buildingName(building)))
            .filter((building) => {
              const bounds = buildingBounds(building);
              const endpointOccupiesFootprint = segmentIntersectsExpandedBounds(
                command.position,
                command.position,
                bounds,
                occupationInferencePolicy.endpointMarginTiles,
              );
              const shortRouteCrossesFootprint = command.commandArrow
                && command.commandArrow.distance <= occupationInferencePolicy.maximumShortRouteTiles
                && segmentIntersectsExpandedBounds(
                  command.commandArrow.from,
                  command.commandArrow.to,
                  bounds,
                  0,
                );
              return endpointOccupiesFootprint || shortRouteCrossesFootprint;
            })
            .forEach((building) => {
              const key = generationIdFor(building);
              const inferredTime = command.time + occupationInferencePolicy.confirmationDelaySeconds;
              const bounds = buildingBounds(building);
              const endpointOccupiesFootprint = segmentIntersectsExpandedBounds(
                command.position,
                command.position,
                bounds,
                occupationInferencePolicy.endpointMarginTiles,
              );
              const evidence = {
                time: inferredTime,
                commandTime: command.time,
                player: command.player,
                owner: building.player,
                generationId: key,
                name: buildingName(building),
                position: building.position,
                selectedActors,
                endpointOccupiesFootprint,
                confidence: 'generic hostile-formation footprint evidence; nonterminal without anchored sustained control',
              };
              occupationEvidence.push(evidence);
              if ((occupationDemolitionsByKey.get(key)?.time ?? Infinity) <= inferredTime) return;
              occupationDemolitionsByKey.set(key, evidence);
            });
        });
      const occupationDemolitions = [...occupationDemolitionsByKey.values()];

      // Correlated terminal anchors can establish that a compact base area was
      // overrun even when sparse command telemetry omits direct target IDs for
      // every individual structure. Geometry never creates a collapse episode
      // by itself: every qualifying episode includes direct hostile terminal
      // evidence for at least one exact placement generation.
      const clusterCollapsePolicy = Object.freeze({
        maximumEpisodeSeconds: 360,
        maximumConsecutiveAnchorGapSeconds: 180,
        maximumAnchorDistanceTiles: 15,
        zoneMarginTiles: 6,
        maximumConnectedGapTiles: 2,
        maximumComponentDiameterTiles: 24,
        normalEndpointActors: 12,
        corroboratedEndpointActors: 10,
        assaultCohortEndpointActors: 8,
        minimumAssaultDirectAnchors: 4,
        minimumAssaultSequenceSeconds: 120,
        minimumAssaultComponentControlSamples: 2,
        maximumAssaultComponentDiameterTiles: 14,
        directAnchorPreControlSeconds: 30,
        minimumEndpointSeparationSeconds: 30,
        maximumPostAnchorControlSeconds: 120,
        confirmationDelaySeconds: 30,
        excludedBuildings: new Set(['Farm', 'Palisade Wall', 'Stone Wall', 'Gate']),
      });
      const hostileEndpointSamples = commandMapEvents
        .filter((command) => ['move', 'attack'].includes(command.kind) && command.position)
        .map((command) => ({
          time: command.time,
          kind: command.kind,
          player: command.player,
          position: command.position,
          selectedActors: new Set((command.object_ids ?? [])
            .filter((instanceId) => !controllableFoodActorIds.has(instanceId))).size,
        }))
        .filter((sample) => sample.selectedActors >= clusterCollapsePolicy.assaultCohortEndpointActors);
      function exactTerminalPlacement(evidence) {
        return terminalCandidateBuildings
          .filter((building) => building.player !== evidence.player
            && building.time <= evidence.time
            && buildingName(building) === evidence.name
            && Math.hypot(
              building.position.x - evidence.position.x,
              building.position.y - evidence.position.y,
            ) <= .6)
          .sort((a, b) => (b.time ?? 0) - (a.time ?? 0))[0] ?? null;
      }
      const terminalAnchorByKey = new Map();
      function registerTerminalAnchor(anchor) {
        const key = `${anchor.player}:${anchor.owner}:${anchor.generationId}`;
        const prior = terminalAnchorByKey.get(key);
        if (!prior) {
          terminalAnchorByKey.set(key, anchor);
          return;
        }
        prior.time = Math.min(prior.time, anchor.time);
        prior.direct ||= anchor.direct;
      }
      demolitionEvents.forEach((evidence) => {
        const building = exactTerminalPlacement(evidence);
        if (!building) return;
        const generationId = generationIdFor(building);
        evidence.generationId = generationId;
        registerTerminalAnchor({
          time: evidence.time,
          player: evidence.player,
          owner: building.player,
          generationId,
          building,
          direct: true,
        });
      });
      function aliveGenerationIdsAt(time) {
        const alive = new Map();
        startingBuildings.forEach((building) => alive.set(generationIdFor(building), building));
        const lifecycleEvents = [
          ...buildingEvents.map((building) => ({ type: 'placement', time: building.time, building })),
          ...demolitionEvents
            .filter((evidence) => evidence.generationId)
            .map((evidence) => ({ type: 'terminal', time: evidence.time, evidence })),
        ].filter((event) => event.time <= time)
          .sort((a, b) => a.time - b.time || (a.type === 'terminal' ? -1 : 1));
        lifecycleEvents.forEach((event) => {
          if (event.type === 'terminal') {
            alive.delete(event.evidence.generationId);
            return;
          }
          if (!event.building.end_position) {
            [...alive.entries()].forEach(([generationId, prior]) => {
              if (buildingsOverlap(prior, event.building)) alive.delete(generationId);
            });
          }
          alive.set(generationIdFor(event.building), event.building);
        });
        return new Set(alive.keys());
      }
      const clusterCollapseDemolitionsByKey = new Map();
      const anchorsByConflict = new Map();
      [...terminalAnchorByKey.values()]
        .filter((anchor) => anchor.building)
        .forEach((anchor) => {
          const key = `${anchor.player}:${anchor.owner}`;
          if (!anchorsByConflict.has(key)) anchorsByConflict.set(key, []);
          anchorsByConflict.get(key).push(anchor);
        });
      anchorsByConflict.forEach((conflictAnchors) => {
        const remaining = [...conflictAnchors].sort((a, b) => a.time - b.time);
        while (remaining.length) {
          const seed = remaining.shift();
          const episode = [seed];
          let changed = true;
          while (changed) {
            changed = false;
            for (let index = remaining.length - 1; index >= 0; index -= 1) {
              const candidate = remaining[index];
              if (candidate.time > seed.time + clusterCollapsePolicy.maximumEpisodeSeconds) continue;
              const temporalLink = episode.some((anchor) => Math.abs(candidate.time - anchor.time)
                <= clusterCollapsePolicy.maximumConsecutiveAnchorGapSeconds);
              const linked = temporalLink && episode.some((anchor) => Math.hypot(
                candidate.building.position.x - anchor.building.position.x,
                candidate.building.position.y - anchor.building.position.y,
              ) <= clusterCollapsePolicy.maximumAnchorDistanceTiles);
              if (!linked) continue;
              episode.push(candidate);
              remaining.splice(index, 1);
              changed = true;
            }
          }
          const directTimes = episode.map((anchor) => anchor.time).sort((a, b) => a - b);
          const minimumEndpointActors = episode.length >= 3
            ? clusterCollapsePolicy.corroboratedEndpointActors
            : clusterCollapsePolicy.normalEndpointActors;
          const episodeEndpointSamples = hostileEndpointSamples
            .filter((sample) => sample.player === seed.player
              && episode.some((anchor) => sample.time >= anchor.time - clusterCollapsePolicy.maximumConsecutiveAnchorGapSeconds
                && sample.time <= anchor.time + clusterCollapsePolicy.maximumEpisodeSeconds)
              && episode.some((anchor) => Math.hypot(
                sample.position.x - anchor.building.position.x,
                sample.position.y - anchor.building.position.y,
              ) <= clusterCollapsePolicy.maximumAnchorDistanceTiles))
            .sort((a, b) => a.time - b.time);
          const controlSamples = episodeEndpointSamples
            .filter((sample) => sample.selectedActors >= minimumEndpointActors);
          const hasBracketingControl = controlSamples.some((first, firstIndex) => controlSamples
            .slice(firstIndex + 1)
            .some((second) => second.time - first.time >= clusterCollapsePolicy.minimumEndpointSeparationSeconds
              && second.time - first.time <= clusterCollapsePolicy.maximumEpisodeSeconds
              && directTimes.some((time) => time >= first.time && time <= second.time)));
          const directSequenceSeconds = directTimes.at(-1) - directTimes[0];
          const hasPostAnchorControl = episode.length >= 3
            && directSequenceSeconds >= 60
            && controlSamples.some((sample) => sample.time >= directTimes.at(-1)
              && sample.time <= directTimes.at(-1) + clusterCollapsePolicy.maximumPostAnchorControlSeconds);
          if (!hasBracketingControl && !hasPostAnchorControl) continue;
          const endpointOccupationEvidence = occupationEvidence
            .filter((evidence) => evidence.endpointOccupiesFootprint
              && evidence.player === seed.player
              && evidence.owner === seed.owner
              && evidence.selectedActors >= minimumEndpointActors
              && controlSamples.some((sample) => Math.abs(sample.time - evidence.commandTime) < 1e-6));
          const occupiedBuildings = endpointOccupationEvidence
            .map((evidence) => terminalCandidateBuildings
              .find((building) => generationIdFor(building) === evidence.generationId))
            .filter(Boolean);
          const houseEvidenceIds = new Set([
            ...episode.filter((anchor) => buildingName(anchor.building) === 'House')
              .map((anchor) => anchor.generationId),
            ...endpointOccupationEvidence.filter((evidence) => evidence.name === 'House')
              .map((evidence) => evidence.generationId),
          ]);
          const baseCollapseBranch = episode.length >= 3;
          const houseOnlyBranch = houseEvidenceIds.size >= 3;
          if (!baseCollapseBranch && !houseOnlyBranch) continue;
          const finalAnchorTime = Math.max(...directTimes);
          const finalControlTime = Math.max(finalAnchorTime, ...controlSamples.map((sample) => sample.time));
          const aliveAtFinalControl = aliveGenerationIdsAt(finalControlTime);
          const directAnchorBuildings = episode.map((anchor) => anchor.building);
          const occupiedAliveBuildings = occupiedBuildings
            .filter((building) => aliveAtFinalControl.has(generationIdFor(building)));
          const evidenceBuildings = [...new Map([
            ...directAnchorBuildings,
            ...occupiedAliveBuildings,
          ].map((building) => [generationIdFor(building), building])).values()];
          const left = Math.min(...evidenceBuildings.map((building) => buildingBounds(building).left))
            - clusterCollapsePolicy.zoneMarginTiles;
          const right = Math.max(...evidenceBuildings.map((building) => buildingBounds(building).right))
            + clusterCollapsePolicy.zoneMarginTiles;
          const top = Math.min(...evidenceBuildings.map((building) => buildingBounds(building).top))
            - clusterCollapsePolicy.zoneMarginTiles;
          const bottom = Math.max(...evidenceBuildings.map((building) => buildingBounds(building).bottom))
            + clusterCollapsePolicy.zoneMarginTiles;
          const zoneCandidates = terminalCandidateBuildings
            .filter((building) => aliveAtFinalControl.has(generationIdFor(building))
              && building.player === seed.owner
              && building.time <= finalControlTime
              && !building.end_position
              && (baseCollapseBranch || buildingName(building) === 'House')
              && !clusterCollapsePolicy.excludedBuildings.has(buildingName(building)))
            .filter((building) => {
              const bounds = buildingBounds(building);
              return bounds.right >= left && bounds.left <= right
                && bounds.bottom >= top && bounds.top <= bottom;
            });
          const connectedKeys = new Set(evidenceBuildings.map((building) => generationIdFor(building)));
          function footprintGap(first, second) {
            const a = buildingBounds(first);
            const b = buildingBounds(second);
            const dx = Math.max(0, a.left - b.right, b.left - a.right);
              const dy = Math.max(0, a.top - b.bottom, b.top - a.bottom);
              return Math.hypot(dx, dy);
          }
          const connectionCandidates = [...new Map([
            ...evidenceBuildings,
            ...zoneCandidates,
          ].map((building) => [generationIdFor(building), building])).values()];
          let expanded = true;
          while (expanded) {
            expanded = false;
            zoneCandidates.forEach((candidate) => {
              const key = generationIdFor(candidate);
              if (connectedKeys.has(key)) return;
              const touchesEvidenceCluster = connectionCandidates.some((connected) => connectedKeys.has(generationIdFor(connected))
                && footprintGap(candidate, connected) <= clusterCollapsePolicy.maximumConnectedGapTiles);
              if (!touchesEvidenceCluster) return;
              connectedKeys.add(key);
              expanded = true;
            });
          }
          const connectedBuildings = connectionCandidates
            .filter((building) => connectedKeys.has(generationIdFor(building)));
          const componentPool = [...connectedBuildings];
          const components = [];
          while (componentPool.length) {
            const component = [componentPool.shift()];
            let componentExpanded = true;
            while (componentExpanded) {
              componentExpanded = false;
              for (let index = componentPool.length - 1; index >= 0; index -= 1) {
                if (!component.some((building) => footprintGap(building, componentPool[index])
                  <= clusterCollapsePolicy.maximumConnectedGapTiles)) continue;
                component.push(componentPool[index]);
                componentPool.splice(index, 1);
                componentExpanded = true;
              }
            }
            components.push(component);
          }
          components.forEach((component) => {
            const componentIds = new Set(component.map((building) => generationIdFor(building)));
            const componentDirectAnchors = episode
              .filter((anchor) => componentIds.has(anchor.generationId));
            const componentHouseEvidenceIds = new Set([
              ...componentDirectAnchors.filter((anchor) => buildingName(anchor.building) === 'House')
