<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>AoE II single-game data</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #1b1b1b; background: #fff; font: 16px/1.45 system-ui, sans-serif; overflow-wrap: anywhere; }
      main { width: min(100%, 72rem); margin: 0 auto; padding: 1rem; }
      h1 { margin: 0 0 .25rem; font-size: 1.45rem; line-height: 1.15; }
      p { margin: .35rem 0; }
      button, input { min-height: 2.75rem; font: inherit; }
      button { padding: .45rem .8rem; border: 1px solid #333; border-radius: 0; color: #111; background: #eee; cursor: pointer; }
      button:disabled { color: #777; cursor: not-allowed; }
      .shell { display: grid; gap: .75rem; }
      .upload-panel, .viewer-panel { border: 1px solid #333; padding: .75rem; background: #f7f7f7; }
      .upload-header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem; }
      .privacy { color: #444; font-size: .92rem; }
      .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: .6rem 0; }
      .file-control { display: inline-flex; align-items: center; gap: .45rem; }
      .file-control input { max-width: min(22rem, 100%); }
      #status { font-weight: 700; }
      #error { margin-top: .5rem; padding: .5rem; border: 1px solid #7f1d1d; color: #7f1d1d; background: #fff7f7; }
      #progress { width: 100%; height: 1rem; }
      #progress-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(15rem, 100%), 1fr)); gap: .2rem .75rem; margin: .5rem 0 0; padding-left: 1.2rem; font-size: .86rem; }
      #progress-list li[data-state="done"] { color: #285d2f; }
      #progress-list li[data-state="active"] { color: #111; font-weight: 700; }
      #progress-list li[data-state="skipped"] { color: #555; }
      #progress-list li[data-state="failed"] { color: #7f1d1d; font-weight: 700; }
      .diagnostics { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .15rem .65rem; margin: .65rem 0 0; font-size: .86rem; }
      .diagnostics dt { font-weight: 700; }
      .diagnostics dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .viewer-panel { padding: 0; background: #fff; }
      #viewer-empty { margin: 0; padding: .75rem; color: #555; }
      #viewer-host iframe { display: block; width: 100%; min-height: 30rem; border: 0; background: #fff; }
      .back-link { color: #0645ad; }
      @media (max-width: 40rem) {
        main { padding: .65rem; }
        .diagnostics { grid-template-columns: 1fr; }
      }
    </style>
    <script type="module" crossorigin src="./assets/dataview-DdfQUeNV.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/limits-BIuC5h1x.js">
  </head>
  <body>
    <main class="shell">
      <section class="upload-panel" aria-labelledby="page-heading">
        <div class="upload-header">
          <div>
            <h1 id="page-heading">AoE II single-game data</h1>
            <p class="privacy">Select a local .aoe2record. The replay bytes stay in this browser worker.</p>
          </div>
          <a class="back-link" href="./index.html">Simulator</a>
        </div>

        <div class="controls">
          <label class="file-control">
            <span>.aoe2record</span>
            <input id="recording-file" type="file" accept=".aoe2record,application/octet-stream" />
          </label>
          <button id="choose-recording" type="button">Choose replay</button>
          <button id="cancel-recording" type="button" disabled>Cancel</button>
          <button id="clear-recording" type="button">Clear</button>
        </div>

        <p id="status" aria-live="polite">Choose a local .aoe2record to begin.</p>
        <progress id="progress" value="0" max="1" aria-label="Replay preprocessing progress"></progress>
        <ul id="progress-list" aria-label="Preprocessing stages"></ul>
        <p id="error" role="alert" hidden></p>
        <dl id="output-summary" class="diagnostics"></dl>
      </section>

      <section class="viewer-panel" aria-label="Generated dataview">
        <p id="viewer-empty">Generated data will open here in the original dataview layout.</p>
        <div id="viewer-host"></div>
      </section>
    </main>

  </body>
</html>
