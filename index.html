<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>AoE Sim</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>AoE Sim</h1>
        <a class="standalone-dataview-link" href="./dataview.html">Standalone dataview</a>
        <div class="topbar-controls">
          <label class="scenario-control">
            <span>Scenario</span>
            <select id="scenario-select">
              <option value="replay" selected>Glade replay</option>
              <option value="synthetic">Synthetic economy</option>
              <option value="combat">Synthetic combat</option>
            </select>
          </label>
          <p id="status" class="status">Booting worker</p>
        </div>
      </header>

      <section class="workbench" aria-label="Simulation workbench">
        <div class="viewport">
          <canvas id="world" width="320" height="180" aria-label="Simulation viewport"></canvas>
        </div>

        <aside class="inspector" aria-label="Simulation controls and diagnostics">
          <div class="control-row">
            <button id="play-pause" type="button" disabled>Play</button>
            <button id="step" type="button" disabled>Step</button>
            <button id="sync" type="button" disabled>Sync</button>
            <label class="speed-control">
              <span>Speed</span>
              <select id="playback-speed" disabled>
                <option value="4" selected>4x</option>
                <option value="10">10x</option>
                <option value="30">30x</option>
              </select>
            </label>
          </div>

          <label class="timeline">
            <span id="time-label">0.000s</span>
            <input id="seek" type="range" min="0" max="0" step="50" value="0" disabled />
            <span id="duration-label">0.000s</span>
          </label>

          <section class="upload-panel" aria-labelledby="recording-heading">
            <div class="section-heading">
              <h2 id="recording-heading">Local Replay</h2>
              <p id="recording-status" class="status">No local file selected</p>
            </div>
            <label class="file-control">
              <span>.aoe2record</span>
              <input id="recording-file" type="file" accept=".aoe2record,application/octet-stream" />
            </label>
            <a id="replay-dataview-link" class="dataview-jump" href="#replay-dataview" hidden aria-disabled="true">
              View compiled dataview
            </a>
            <dl id="recording-report" class="diagnostics local-recording-report"></dl>
          </section>

          <dl id="diagnostics" class="diagnostics"></dl>
        </aside>
      </section>

      <section
        id="replay-dataview"
        class="dataview"
        tabindex="-1"
        aria-label="Browser-compiled replay dataview"
        aria-live="polite"
      ></section>
    </main>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
